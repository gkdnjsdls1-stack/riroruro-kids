=\"middle\" fill=\"#c62828\" font-weight=\"bold\">접선의 기울기</text><text x=\"262\" y=\"54\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">f′(1) = 2</text><text x=\"262\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">xⁿ → n·xⁿ⁻¹</text><text x=\"262\" y=\"106\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x² → 2x</text><text x=\"262\" y=\"126\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">x = 1 대입 → 2</text></svg>", "steps": ["f′(a) 는 x = a 에서 그래프에 닿는 선(접선)의 기울기예요. 그 순간 얼마나 가파른지를 나타내요.", "x = 1에서 h만큼 갔을 때의 평균 기울기는 {f(1+h) − f(1)} / h = {(1+h)² − 1} / h = 2 + h", "h 를 0 에 한없이 가깝게 하면 2 + h → 2. 그래서 f′(1) = 2.", "매번 이렇게 계산하지 않도록 공식이 있어요: xⁿ 을 미분하면 n·xⁿ⁻¹ (지수를 앞으로 내리고 1 빼기), 상수는 0.", "먼저 f′(x) 를 구하고, 그다음에 x = a 를 넣어요.", "💡 왜 n·xⁿ⁻¹ 일까요? (x+h)ⁿ 을 전개하면 xⁿ + n·xⁿ⁻¹h + (h 가 들어간 항들)이에요. 변화량 [(x+h)ⁿ − xⁿ] / h 에서 h 를 0 에 가깝게 하면 n·xⁿ⁻¹ 만 남아요. 상수는 변하지 않으니 기울기 0 이에요."], "ex": ["f(x) = x² → f′(x) = 2x → f′(1) = 2", "f(x) = x³ + 2x → f′(x) = 3x² + 2 → f′(1) = 5", "f(x) = 5 (상수) → f′(x) = 0"], "bad": ["3x³ 처럼 지수를 안 줄임 (x³ → 3x²)", "상수항을 미분해도 남겨 둠 (상수 → 0)", "f′(a) 대신 f(a) 를 계산함"]}, "극값과 도함수": {"short": "극값은 f′(x) = 0 인 x 에서. f′ 부호가 −→+ 이면 극소, +→− 이면 극대.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"f(x)=x²−2x의 그래프. 접선 기울기가 −,0,+로 바뀌며 x=1에서 극소\" class=\"nsvg\"><line x1=\"70.0\" y1=\"92\" x2=\"214.0\" y2=\"92\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"110\" y1=\"125.80000000000001\" x2=\"110\" y2=\"40\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"222.0\" y=\"106\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"120\" y=\"38\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><line x1=\"150\" y1=\"89\" x2=\"150\" y2=\"95\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"150\" y=\"107\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"190\" y1=\"89\" x2=\"190\" y2=\"95\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"190\" y=\"107\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><path d=\"M82.0,42.9 L84.3,47.8 L86.5,52.5 L88.8,57.1 L91.1,61.6 L93.3,65.8 L95.6,69.9 L97.9,73.8 L100.1,77.6 L102.4,81.2 L104.7,84.6 L106.9,87.9 L109.2,90.9 L111.5,93.9 L113.7,96.6 L116.0,99.2 L118.3,101.6 L120.5,103.9 L122.8,106.0 L125.1,107.9 L127.3,109.7 L129.6,111.2 L131.9,112.7 L134.1,113.9 L136.4,115.0 L138.7,115.9 L140.9,116.7 L143.2,117.2 L145.5,117.7 L147.7,117.9 L150.0,118.0 L152.3,117.9 L154.5,117.7 L156.8,117.2 L159.1,116.7 L161.3,115.9 L163.6,115.0 L165.9,113.9 L168.1,112.7 L170.4,111.2 L172.7,109.7 L174.9,107.9 L177.2,106.0 L179.5,103.9 L181.7,101.6 L184.0,99.2 L186.3,96.6 L188.5,93.9 L190.8,90.9 L193.1,87.9 L195.3,84.6 L197.6,81.2 L199.9,77.6 L202.1,73.8 L204.4,69.9 L206.7,65.8 L208.9,61.6 L211.2,57.1 L213.5,52.5 L215.7,47.8 L218.0,42.9\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"96.0\" y1=\"73.8\" x2=\"124.0\" y2=\"110.2\" stroke=\"#c62828\" stroke-width=\"2.5\"/><line x1=\"132.0\" y1=\"118.0\" x2=\"168.0\" y2=\"118.0\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><line x1=\"176.0\" y1=\"110.2\" x2=\"204.0\" y2=\"73.8\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><circle cx=\"150\" cy=\"118\" r=\"5\" fill=\"#2e7d32\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><text x=\"150\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">극솟값 f(1) = −1</text><text x=\"74.0\" y=\"65.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">f′ < 0</text><text x=\"202.0\" y=\"65.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">f′ > 0</text><text x=\"262\" y=\"34\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">f(x) = x² − 2x</text><text x=\"262\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">f′(x) = 2x − 2</text><text x=\"262\" y=\"80\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">기울기 0 →</text><text x=\"262\" y=\"98\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">2x − 2 = 0</text><text x=\"262\" y=\"116\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">x = 1 에서 극소</text></svg>", "steps": ["그래프가 내려가다 올라가는 골짜기 점이 극소, 올라가다 내려가는 꼭대기가 극대예요.", "골짜기에서는 접선이 수평이라서 기울기 f′(x) = 0 이에요. (왼쪽은 내려가서 f′ < 0, 오른쪽은 올라가서 f′ > 0)", "그래서 f′(x) = 0 인 x 를 먼저 찾아요. 2x − 2 = 0 → x = 1", "그 x 를 f(x) 에 넣으면 극솟값이에요. f(1) = 1 − 2 = −1", "f′ 의 부호가 − → + 로 바뀌면 극소, + → − 로 바뀌면 극대예요.", "💡 왜 f′ = 0 일까요? 증가하다 감소로 바뀌는 꼭대기(극대)와 감소하다 증가로 바뀌는 바닥(극소)에서 접선이 수평, 즉 기울기 f′ = 0 이에요. 부호가 바뀌어야 진짜 극값이에요."], "ex": ["f(x) = x² − 2x → f′ = 2x − 2 = 0 → x = 1 → 극솟값 f(1) = −1", "f(x) = x³ − 3x → f′ = 3x² − 3 = 0 → x = ±1. x = −1 에서 극대 f(−1) = 2, x = 1 에서 극소 f(1) = −2"], "bad": ["f′(x) = 0 인 x 를 그대로 극값이라고 씀 (극값은 f(x) 의 값)", "f′ = 0 이면 항상 극값이라고 생각함 — 부호가 바뀌어야 해요 (예: x³ 의 x = 0)"]}, "등차수열": {"short": "aₙ = a + (n − 1)d. (첫째항 a, 공차 d)", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"3에서 시작해 2씩 더해 가는 수열과 5번째 항\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3, 5, 7, 9, 11, …   (공차 d = 2)</text><circle cx=\"36\" cy=\"72\" r=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"36\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3</text><text x=\"36\" y=\"112\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₁</text><line x1=\"57\" y1=\"72\" x2=\"77\" y2=\"72\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"67\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+2</text><circle cx=\"98\" cy=\"72\" r=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"98\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">5</text><text x=\"98\" y=\"112\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₂</text><line x1=\"119\" y1=\"72\" x2=\"139\" y2=\"72\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"129\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+2</text><circle cx=\"160\" cy=\"72\" r=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">7</text><text x=\"160\" y=\"112\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₃</text><line x1=\"181\" y1=\"72\" x2=\"201\" y2=\"72\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"191\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+2</text><circle cx=\"222\" cy=\"72\" r=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"222\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">9</text><text x=\"222\" y=\"112\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₄</text><line x1=\"243\" y1=\"72\" x2=\"263\" y2=\"72\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"253\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+2</text><circle cx=\"284\" cy=\"72\" r=\"20\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"284\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">11</text><text x=\"284\" y=\"112\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₅</text><text x=\"160\" y=\"138\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₅ = 3 + 2 + 2 + 2 + 2 = 3 + 2 × 4</text><text x=\"160\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">aₙ = a + (n − 1)d   (d 를 n−1번 더해요)</text></svg>", "steps": ["등차수열은 앞 항에 같은 수(공차 d)를 계속 더해 만든 수열이에요.", "a₁ = a, a₂ = a + d, a₃ = a + 2d, a₄ = a + 3d … 몇 번째 항인지보다 d 가 1 적게 더해져요.", "그래서 n 번째 항은 d 를 (n − 1)번 더한 aₙ = a + (n − 1)d.", "공차는 (뒤 항) − (앞 항) 으로 구해요.", "💡 왜 (n − 1)d 일까요? 첫째항 a 에서 둘째항까지 d 를 1번, 셋째항까지 2번 더해요. n번째 항은 d 를 (n−1)번 더한 값이라 a + (n−1)d 예요."], "ex": ["3, 5, 7, … 의 5번째 항 = 3 + 2 × 4 = 11", "첫째항 10, 공차 −3 → 8번째 항 = 10 + (−3) × 7 = −11", "5, 9, 13, … 에서 45 는 몇 번째? 5 + 4(n − 1) = 45 → n = 11"], "bad": ["d 를 n 번 더함 (n − 1 번이에요)", "공차를 (앞 항) − (뒤 항) 으로 구함"]}, "등비수열": {"short": "aₙ = a·rⁿ⁻¹. (첫째항 a, 공비 r)", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2에서 시작해 3배씩 커지는 수열과 4번째 항\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2, 6, 18, 54, …   (공비 r = 3)</text><circle cx=\"46\" cy=\"72\" r=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"46\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><text x=\"46\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₁</text><line x1=\"69\" y1=\"72\" x2=\"99\" y2=\"72\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"84\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×3</text><circle cx=\"122\" cy=\"72\" r=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"122\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">6</text><text x=\"122\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₂</text><line x1=\"145\" y1=\"72\" x2=\"175\" y2=\"72\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×3</text><circle cx=\"198\" cy=\"72\" r=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"198\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">18</text><text x=\"198\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₃</text><line x1=\"221\" y1=\"72\" x2=\"251\" y2=\"72\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"236\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×3</text><circle cx=\"274\" cy=\"72\" r=\"22\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"274\" y=\"77\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">54</text><text x=\"274\" y=\"114\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₄</text><text x=\"160\" y=\"140\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a₄ = 2 × 3 × 3 × 3 = 2 × 3³</text><text x=\"160\" y=\"162\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">aₙ = a·rⁿ⁻¹   (r 를 n−1번 곱해요)</text></svg>", "steps": ["등비수열은 앞 항에 같은 수(공비 r)를 계속 곱해 만든 수열이에요.", "a₁ = a, a₂ = ar, a₃ = ar², a₄ = ar³ … 곱한 횟수가 항 번호보다 1 적어요.", "그래서 n 번째 항은 aₙ = a·rⁿ⁻¹.", "공비는 (뒤 항) ÷ (앞 항) 으로 구해요.", "💡 왜 rⁿ⁻¹ 일까요? 첫째항 a 에서 둘째항까지 r 을 1번, 셋째항까지 2번 곱해요. n번째 항은 r 을 (n−1)번 곱해서 a·rⁿ⁻¹ 예요."], "ex": ["2, 6, 18, … 의 4번째 항 = 2 × 3³ = 54", "첫째항 5, 공비 2 → 5번째 항 = 5 × 2⁴ = 80", "3, 6, 12, … 의 공비 = 6 ÷ 3 = 2"], "bad": ["r 를 n 번 곱함 (n − 1 번이에요)", "공비를 뺄셈으로 구함 — 등비는 나눗셈이에요"]}, "순환소수를 분수로": {"short": "소수점 바로 뒤부터 반복될 때, 순환마디의 숫자가 1개면 분모 9, 2개면 99. (0.2727… = 27/99)", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"x=0.333…에서 10x를 빼서 반복 부분을 지우는 과정\" class=\"nsvg\"><text x=\"18\" y=\"26\" font-size=\"14\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">x = 0.333…</text><text x=\"18\" y=\"52\" font-size=\"14\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">10x = 3.333…</text><text x=\"190\" y=\"52\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">(소수점을 한 칸 밀기)</text><line x1=\"14\" y1=\"64\" x2=\"170\" y2=\"64\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"18\" y=\"86\" font-size=\"14\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">10x − x = 3</text><text x=\"190\" y=\"86\" font-size=\"11\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">(… 부분이 지워짐)</text><text x=\"18\" y=\"110\" font-size=\"14\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">9x = 3  →  x = 1/3</text><text x=\"18\" y=\"140\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">0.2727… : 마디가 2개 → 100x − x = 27</text><text x=\"18\" y=\"160\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">99x = 27 → x = 27/99 = 3/11</text></svg>", "steps": ["순환마디가 1개면 10 배, 2개면 100 배를 해요. 마디 개수만큼 소수점을 오른쪽으로 밀어요.", "원래 식을 빼면 소수점 아래 반복 부분이 똑같아서 모두 지워져요.", "남은 식을 풀면 분수가 돼요. 9x = 3 → x = 3/9 = 1/3", "그래서 마디가 1개면 분모 9, 2개면 99, 3개면 999 예요. 분자는 반복되는 숫자. 0.1666…처럼 반복되지 않는 부분이 앞에 있으면 예제 3처럼 두 식을 빼서 구해요.", "💡 왜 9, 99 일까요? x = 0.2727… 이면 100x = 27.2727… 이에요. 100x − x = 27 이라 99x = 27, x = 27/99 예요. 마디가 1개면 10배, 2개면 100배 해서 빼요."], "ex": ["0.555… = 5/9", "0.2727… = 27/99 = 3/11", "0.1666… (0.1 뒤에 6 반복) → 10x = 1.666…, 100x = 16.666… → 90x = 15 → x = 1/6"], "bad": ["순환하지 않는 앞부분이 있는데 그냥 9 로만 나눔", "약분을 안 함 (27/99 → 3/11)"]}, "근호 밖으로 꺼내기": {"short": "√(a²b) = a√b. 제곱수를 √ 밖으로 꺼낸다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"√18을 √(9×2)로 쪼개 3√2로 만드는 과정\" class=\"nsvg\"><text x=\"160\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">√18 을 간단히 하기</text><rect x=\"110\" y=\"36\" width=\"100\" height=\"30\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"57\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">√18</text><line x1=\"160\" y1=\"67\" x2=\"160\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"95\" y=\"84\" width=\"130\" height=\"30\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"105\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">√(9 × 2)</text><text x=\"232\" y=\"104\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">제곱수 9 찾기</text><line x1=\"160\" y1=\"115\" x2=\"160\" y2=\"132\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"95\" y=\"132\" width=\"130\" height=\"30\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"153\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">√9 · √2 = 3√2</text><text x=\"232\" y=\"150\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">제곱수는 밖으로</text></svg>", "steps": ["√ 안의 수를 ‘제곱수 × 나머지’ 로 쪼개요. 18 = 9 × 2 (9 는 3² )", "√(a × b) = √a × √b 이므로 √9 × √2 로 나눌 수 있어요.", "√9 = 3 처럼 제곱수의 √ 는 자연수가 돼서 밖으로 나와요 → 3√2", "제곱수는 4, 9, 16, 25, 36 … 중에서 가장 큰 것을 찾아요. 그래야 한 번에 끝나요.", "💡 왜 꺼낼 수 있을까요? √(a²b) = √(a²) × √b = a√b 이기 때문이에요. √ 안의 제곱수는 제곱근을 씌우면 밖으로 나와요. 예: √12 = √(4×3) = 2√3."], "ex": ["√18 = √(9 × 2) = 3√2", "√50 = √(25 × 2) = 5√2", "√12 = √(4 × 3) = 2√3"], "bad": ["√12 = √(2 × 6) 처럼 제곱수가 아닌 수로 쪼갬", "√ 안에 제곱수가 남은 채로 끝냄 (√8 = 2√2 로 끝까지)", "3√2 를 3 + √2 로 착각함 (붙어 있으면 곱이에요)"]}, "원주각과 중심각": {"short": "같은 호의 원주각 = 중심각의 1/2.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"호 AB의 중심각 80도와 원주각 40도\" class=\"nsvg\"><circle cx=\"100\" cy=\"92\" r=\"66\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.8\"/><path d=\"M57.6,41.4 L100.0,92.0 L142.4,41.4\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"M57.6,41.4 L100.0,158.0 L142.4,41.4\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"100\" cy=\"92\" r=\"3.5\" fill=\"#333\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"57.5760177606884\" cy=\"41.44106675414745\" r=\"3.5\" fill=\"#333\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"142.4239822393116\" cy=\"41.44106675414745\" r=\"3.5\" fill=\"#333\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"100\" cy=\"158\" r=\"3.5\" fill=\"#333\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"100\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">중심각 80°</text><text x=\"100\" y=\"175\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">원주각 40°</text><text x=\"49.5760177606884\" y=\"37.44106675414745\" font-size=\"12\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">A</text><text x=\"150.4239822393116\" y=\"37.44106675414745\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">B</text><text x=\"106\" y=\"86\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">O</text><text x=\"110\" y=\"152\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">P</text><text x=\"250\" y=\"36\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">같은 호 AB 에 대한</text><text x=\"250\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">원주각 = 중심각 ÷ 2</text><text x=\"250\" y=\"86\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">80° ÷ 2 = 40°</text><text x=\"250\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">원 위의 어느 점 P 에서</text><text x=\"250\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">봐도 원주각은 같아요</text></svg>", "steps": ["같은 호를 보는 두 각이 있어요. 중심 O 에서 보는 중심각, 원 위의 점 P 에서 보는 원주각.", "선 PO를 길게 그어 원과 만나는 점을 Q라고 해요. OP = OA라서 삼각형 OPA는 이등변삼각형이고, 외각 ∠AOQ = ∠OPA + ∠OAP = 2∠OPA예요. 같은 방법으로 ∠BOQ = 2∠OPB. 두 식을 더하면 ∠AOB = 2∠APB예요.", "그래서 원주각 = 중심각 ÷ 2. 같은 호에 대한 원주각은 어느 점에서 봐도 같아요.", "💡 왜 1/2 일까요? 중심 O 와 원주 위 점 P 를 잇는 반지름 2개로 이등변삼각형이 생기고, 삼각형의 바깥각 = 안쪽 두 각의 합이라 중심각이 밑각의 2배가 돼요. 그래서 원주각은 중심각의 1/2 이에요."], "ex": ["중심각 80° → 원주각 40°", "원주각 35° → 중심각 70°", "지름에 대한 원주각 = 180° ÷ 2 = 90°"], "bad": ["원주각과 중심각을 바꿔서 계산함 (원주각이 더 작아요)", "서로 다른 호의 각을 비교함 — 같은 호인지 먼저 확인"]}, "두 점 사이의 거리": {"short": "√((x₂ − x₁)² + (y₂ − y₁)²).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"(0,0)과 (3,4) 사이에 직각삼각형을 그려 거리 5\" class=\"nsvg\"><line x1=\"37.0\" y1=\"140\" x2=\"193.0\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"50\" y1=\"140\" x2=\"50\" y2=\"4.799999999999983\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"201.0\" y=\"154\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"60\" y=\"2.799999999999983\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><line x1=\"76\" y1=\"137\" x2=\"76\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"76\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"102\" y1=\"137\" x2=\"102\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"102\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"128\" y1=\"137\" x2=\"128\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"128\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"47\" y1=\"114\" x2=\"53\" y2=\"114\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"42\" y=\"118\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"47\" y1=\"88\" x2=\"53\" y2=\"88\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"42\" y=\"92\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"47\" y1=\"62\" x2=\"53\" y2=\"62\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"42\" y=\"66\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"47\" y1=\"36\" x2=\"53\" y2=\"36\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"42\" y=\"40\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">4</text><path d=\"M50.0,140.0 L128.0,140.0 L128.0,36.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"50\" y1=\"140\" x2=\"128\" y2=\"36\" stroke=\"#c62828\" stroke-width=\"3\"/><circle cx=\"50\" cy=\"140\" r=\"4\" fill=\"#333\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"128\" cy=\"36\" r=\"4\" fill=\"#333\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"44\" y=\"134\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">(0, 0)</text><text x=\"136\" y=\"32\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">(3, 4)</text><text x=\"89.0\" y=\"134\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">3</text><text x=\"138\" y=\"88\" font-size=\"12\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">4</text><text x=\"83.80000000000001\" y=\"71.6\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5</text><text x=\"245\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">가로 3, 세로 4 인</text><text x=\"245\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">직각삼각형의 빗변</text><text x=\"245\" y=\"88\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3² + 4² = 5²</text><text x=\"245\" y=\"118\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">거리 = √(3² + 4²)</text><text x=\"245\" y=\"136\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">= √25 = 5</text></svg>", "steps": ["두 점 사이에 직각삼각형을 그려 보세요. 가로로 떨어진 만큼과 세로로 떨어진 만큼이 두 변이에요.", "두 점의 거리는 그 직각삼각형의 빗변이에요. 피타고라스 정리를 써요.", "가로 = x좌표의 차 |x₂ − x₁|, 세로 = y좌표의 차 |y₂ − y₁|", "거리 = √((x₂ − x₁)² + (y₂ − y₁)²). 제곱하니까 차의 부호는 신경 쓰지 않아도 돼요.", "💡 왜 이 식일까요? 두 점을 잇는 선분을 빗변으로 하고 가로 (x₂−x₁), 세로 (y₂−y₁) 인 직각삼각형을 그리면 피타고라스 정리로 거리² = (x₂−x₁)² + (y₂−y₁)² 예요."], "ex": ["(0, 0) 과 (3, 4) → √(9 + 16) = 5", "(1, 2) 와 (4, 6) → √(3² + 4²) = 5", "(−1, 3) 과 (2, −1) → √(3² + (−4)²) = √25 = 5"], "bad": ["√ 를 빼먹거나 제곱근을 취하지 않음", "음수 차를 제곱할 때 괄호를 빼먹음 (−4)² = 16", "x좌표 차와 y좌표 차를 더하고 제곱함 (제곱 후 더해야 해요)"]}, "절댓값과 거리": {"short": "|x − a| = x와 a 사이의 거리. |x − a| < k ⇔ a − k < x < a + k.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"수직선에서 3으로부터 거리 2 이내인 구간 1<x<5\" class=\"nsvg\"><line x1=\"28\" y1=\"80\" x2=\"292\" y2=\"80\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"76\" x2=\"40\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"40\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">0</text><line x1=\"80\" y1=\"76\" x2=\"80\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"80\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"120\" y1=\"76\" x2=\"120\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"120\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"160\" y1=\"76\" x2=\"160\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"160\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"200\" y1=\"76\" x2=\"200\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"200\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">4</text><line x1=\"240\" y1=\"76\" x2=\"240\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"240\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">5</text><line x1=\"280\" y1=\"76\" x2=\"280\" y2=\"84\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"280\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">6</text><line x1=\"80\" y1=\"80\" x2=\"240\" y2=\"80\" stroke=\"#2e7d32\" stroke-width=\"5\"/><circle cx=\"80\" cy=\"80\" r=\"5\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><circle cx=\"240\" cy=\"80\" r=\"5\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><circle cx=\"160\" cy=\"80\" r=\"5\" fill=\"#c62828\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"160\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3</text><path d=\"M166,50 L240,50\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"200\" y=\"44\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">거리 2</text><path d=\"M80,50 L154,50\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"120\" y=\"44\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">거리 2</text><text x=\"160\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">|x − 3| < 2  :  3 에서 거리가 2 보다 가까운 x</text><text x=\"160\" y=\"130\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">3 − 2 < x < 3 + 2   →   1 < x < 5</text><text x=\"160\" y=\"156\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">|x − 3| > 2 이면 바깥쪽: x < 1 또는 x > 5</text></svg>", "steps": ["|x − a| 는 수직선에서 x 와 a 사이의 거리예요.", "|x − 3| < 2 는 ‘3 에서 거리가 2 보다 가까운 x’. 왼쪽으로 2, 오른쪽으로 2 까지.", "그래서 3 − 2 < x < 3 + 2, 즉 1 < x < 5. (끝점은 포함하지 않아요)", "> 이면 거리가 더 먼 바깥쪽: x < 1 또는 x > 5", "≤, ≥ 이면 끝점을 포함해요.", "💡 왜 거리일까요? |x − a| 는 x − a 의 부호를 없앤 크기라서 수직선에서 두 점 사이의 칸 수와 같아요. 그래서 거리가 k 보다 작으면 a 에서 좌우로 k 이내예요."], "ex": ["|x − 3| < 2 → 1 < x < 5", "|x + 1| ≤ 4 → |x − (−1)| ≤ 4 → −5 ≤ x ≤ 3", "|x − 2| > 1 → x < 1 또는 x > 3"], "bad": ["|x + 1| 에서 a 를 +1 로 읽음 (x − (−1) 이라서 a = −1)", "< 인데 바깥쪽으로 답함"]}, "합성함수 (g∘f)(x)": {"short": "(g∘f)(x) = g(f(x)). f를 먼저, g를 나중에.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2를 f에 넣어 3, 그 3을 g에 넣어 9\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">f(x) = x + 1,   g(x) = x²,   x = 2</text><circle cx=\"26\" cy=\"80\" r=\"18\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"26\" y=\"85\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><line x1=\"46\" y1=\"80\" x2=\"74\" y2=\"80\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"74\" y=\"60\" width=\"64\" height=\"40\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"106\" y=\"76\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">f</text><text x=\"106\" y=\"92\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">+ 1</text><line x1=\"138\" y1=\"80\" x2=\"166\" y2=\"80\" stroke=\"#333\" stroke-width=\"2\"/><circle cx=\"184\" cy=\"80\" r=\"18\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"184\" y=\"85\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3</text><text x=\"184\" y=\"114\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">f(2)</text><line x1=\"202\" y1=\"80\" x2=\"228\" y2=\"80\" stroke=\"#333\" stroke-width=\"2\"/><rect x=\"228\" y=\"60\" width=\"64\" height=\"40\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"260\" y=\"76\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">g</text><text x=\"260\" y=\"92\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">x²</text><text x=\"160\" y=\"138\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">(g∘f)(2) = g( f(2) ) = g(3) = 9</text><text x=\"160\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">f 먼저 (안쪽), g 나중 (바깥쪽)</text></svg>", "steps": ["합성함수는 두 개의 기계를 이어 붙인 거예요. 첫 번째 기계 결과를 두 번째 기계에 넣어요.", "(g∘f)(x) = g(f(x)). 안쪽의 f 를 먼저 계산하고, 그 결과를 g 에 넣어요. (쓰는 순서와 계산 순서가 반대예요)", "x = 2 이면 f(2) = 3, g(3) = 9. 그래서 (g∘f)(2) = 9", "순서를 바꾼 (f∘g)(2) = f(g(2)) = f(4) = 5 로, 결과가 달라요.", "💡 왜 f 부터일까요? x 가 f 라는 기계를 먼저 통과해 f(x) 가 되고, 그 결과가 g 기계를 통과해 g(f(x)) 가 돼요. 안쪽 괄호부터 계산하는 거예요."], "ex": ["f(x) = x + 1, g(x) = x² → (g∘f)(2) = g(3) = 9", "같은 함수로 (f∘g)(2) = f(4) = 5", "(g∘f)(x) = g(x + 1) = (x + 1)²"], "bad": ["g 를 먼저 계산함 (g∘f 는 f 가 먼저)", "f∘g 와 g∘f 가 같다고 생각함"]}, "유리함수와 점근선": {"short": "y = k/(x − p) + q 의 점근선은 x = p, y = q.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"y=3/(x−2)+1의 그래프와 점근선 x=2, y=1\" class=\"nsvg\"><line x1=\"31.60000000000001\" y1=\"112\" x2=\"281.20000000000005\" y2=\"112\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"120\" y1=\"160.0\" x2=\"120\" y2=\"28.0\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"289.20000000000005\" y=\"126\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"130\" y=\"26.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><line x1=\"172\" y1=\"160.0\" x2=\"172\" y2=\"28.0\" stroke=\"#c62828\" stroke-width=\"1.5\" stroke-dasharray=\"5\"/><line x1=\"31.60000000000001\" y1=\"97\" x2=\"281.20000000000005\" y2=\"97\" stroke=\"#c62828\" stroke-width=\"1.5\" stroke-dasharray=\"5\"/><path d=\"M191.5,37.0 L193.0,41.2 L194.4,44.8 L195.9,48.0 L197.3,50.8 L198.8,53.3 L200.2,55.5 L201.7,57.6 L203.1,59.4 L204.6,61.1 L206.0,62.6 L207.5,64.0 L208.9,65.3 L210.4,66.5 L211.8,67.6 L213.3,68.7 L214.7,69.6 L216.2,70.5 L217.6,71.4 L219.1,72.1 L220.5,72.9 L222.0,73.6 L223.4,74.3 L224.9,74.9 L226.3,75.5 L227.8,76.0 L229.2,76.6 L230.7,77.1 L232.1,77.5 L233.6,78.0 L235.1,78.4 L236.5,78.9 L238.0,79.3 L239.4,79.6 L240.9,80.0 L242.3,80.4 L243.8,80.7 L245.2,81.0 L246.7,81.3 L248.1,81.6 L249.6,81.9 L251.0,82.2 L252.5,82.5 L253.9,82.7 L255.4,83.0 L256.8,83.2 L258.3,83.4 L259.7,83.7 L261.2,83.9 L262.6,84.1 L264.1,84.3 L265.5,84.5 L267.0,84.7 L268.4,84.9 L269.9,85.0 L271.3,85.2 L272.8,85.4 L274.2,85.6 L275.7,85.7 L277.1,85.9 L278.6,86.0\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"M34.2,105.5 L36.2,105.6 L38.1,105.7 L40.1,105.9 L42.1,106.0 L44.1,106.1 L46.0,106.3 L48.0,106.4 L50.0,106.6 L51.9,106.7 L53.9,106.9 L55.9,107.1 L57.9,107.3 L59.8,107.4 L61.8,107.6 L63.8,107.8 L65.7,108.0 \" stroke-width=\"2.5\"/><text x=\"88\" y=\"58\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">A</text><text x=\"222\" y=\"58\" font-size=\"15\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">B</text><text x=\"96\" y=\"88\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><text x=\"155\" y=\"76\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><text x=\"155\" y=\"100\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3</text><text x=\"214\" y=\"88\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">4</text><text x=\"155\" y=\"162\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">A = {1, 2, 3}   B = {2, 3, 4}</text><text x=\"278\" y=\"40\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">A∩B</text><text x=\"278\" y=\"58\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">겹친 부분</text><text x=\"278\" y=\"72\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">{2, 3}</text><text x=\"278\" y=\"104\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">A∪B</text><text x=\"278\" y=\"122\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">전부 합친 것</text><text x=\"278\" y=\"136\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">{1,2,3,4}</text></svg>", "steps": ["집합은 ‘모임’이에요. { } 안에 원소를 써요. A = {1, 2, 3}", "벤 다이어그램에서 두 원을 겹쳐 그리면 겹친 부분이 ‘둘 다에 들어 있는’ 원소예요.", "A∩B (교집합) = 둘 다에 속하는 원소 → {2, 3}. ∩는 '그리고', ∪는 '또는'으로 읽으면 쉬워요.", "A∪B (합집합) = 어느 한쪽에라도 속하는 원소 → {1, 2, 3, 4}. 중복은 한 번만 써요.", "∅ (공집합) = 원소가 하나도 없는 집합."], "ex": ["A = {1, 2, 3}, B = {2, 3, 4} → A∩B = {2, 3}, A∪B = {1, 2, 3, 4}", "A = {1, 2}, B = {3, 4} → A∩B = ∅"], "bad": ["합집합에서 2, 3 을 두 번 씀", "∩ 와 ∪ 를 바꿔 읽음 (교집합은 겹친 부분)"]}, "허수 단위 i": {"short": "i² = −1. 계산 중 i²이 나오면 −1로 바꾼다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"i의 거듭제곱이 i, −1, −i, 1로 반복\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">i 를 계속 곱하면 4 개가 돌아요</text><rect x=\"16\" y=\"38\" width=\"60\" height=\"44\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"46\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">i¹</text><text x=\"46\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">= i</text><text x=\"84\" y=\"64\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×i</text><rect x=\"92\" y=\"38\" width=\"60\" height=\"44\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2.5\"/><text x=\"122\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">i²</text><text x=\"122\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">= −1</text><text x=\"160\" y=\"64\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×i</text><rect x=\"168\" y=\"38\" width=\"60\" height=\"44\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"198\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">i³</text><text x=\"198\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">= −i</text><text x=\"236\" y=\"64\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×i</text><rect x=\"244\" y=\"38\" width=\"60\" height=\"44\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"274\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">i⁴</text><text x=\"274\" y=\"74\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">= 1</text><text x=\"160\" y=\"112\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">i² = −1  (제곱하면 −1 이 되는 수)</text><text x=\"160\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(2 + i)(2 − i) = 4 − i² = 4 − (−1) = 5</text><text x=\"160\" y=\"158\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(A + B)(A − B) = A² − B²  공식을 그대로 써요</text></svg>", "steps": ["실수는 제곱하면 항상 0 이상이라서, x² = −1 을 풀 수 있는 실수가 없어요. 그래서 ‘제곱하면 −1 이 되는 수’ i 를 새로 정했어요. i² = −1", "i 를 계속 곱하면 i, −1, −i, 1 이 4 개씩 반복돼요.", "계산할 때는 보통 문자처럼 다루다가 i² 이 나오면 −1 로 바꿔요.", "(2 + i)(2 − i) 는 (A + B)(A − B) = A² − B² 로 4 − i² = 4 + 1 = 5.", "💡 왜 만들었을까요? x² = −1 처럼 실수 범위에서 답이 없는 방정식을 풀기 위해 제곱해서 −1 이 되는 새 수 i 를 약속했어요. i² = −1 이라 i³ = −i, i⁴ = 1 로 네 개씩 반복돼요."], "ex": ["(2 + i)(2 − i) = 4 − i² = 5", "i³ = i² × i = −i", "i⁴ = (i²)² = 1"], "bad": ["i² 을 1 로 계산함 (−1 이에요)", "i² 을 바꾸지 않고 문자로 남김"]}, "이등변삼각형": {"short": "두 변이 같으면 밑각도 같다. 밑각 = (180° − 꼭지각) ÷ 2.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"꼭지각 40도인 이등변삼각형의 밑각 70도\" class=\"nsvg\"><path d=\"M90.0,28.0 L46.0,148.0 L134.0,148.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"90\" y1=\"28\" x2=\"90\" y2=\"148\" stroke=\"#2e7d32\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/><line x1=\"63\" y1=\"84\" x2=\"71\" y2=\"76\" stroke=\"#c62828\" stroke-width=\"2\"/><line x1=\"109\" y1=\"84\" x2=\"117\" y2=\"92\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"90\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">40°</text><text x=\"62\" y=\"140\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">70°</text><text x=\"118\" y=\"140\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">70°</text><text x=\"236\" y=\"34\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">두 변이 같으면</text><text x=\"236\" y=\"52\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">두 밑각도 같아요</text><text x=\"236\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">밑각 = (180° − 꼭지각) ÷ 2</text><text x=\"236\" y=\"104\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">= (180° − 40°) ÷ 2</text><text x=\"236\" y=\"122\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">= 70°</text><text x=\"236\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">가운데로 접으면 포개져요</text></svg>", "steps": ["이등변삼각형은 두 변의 길이가 같은 삼각형이에요. 같은 두 변 사이의 각이 꼭지각, 아래 두 각이 밑각.", "꼭지에서 밑변으로 수직선(점선)을 그으면 똑같은 직각삼각형 두 개로 나뉘어요. 그래서 두 밑각이 같아요.", "세 각의 합은 180° 이므로, 꼭지각을 빼고 남은 각을 두 밑각이 똑같이 나눠 가져요.", "밑각 = (180° − 꼭지각) ÷ 2.", "💡 왜 밑각이 같을까요? 꼭지각의 이등분선을 그으면 두 변이 같은 합동 삼각형 두 개로 나뉘고, 합동이면 대응하는 밑각이 같아요. 내각의 합 180° 에서 꼭지각을 빼 반으로 나누면 밑각이에요."], "ex": ["꼭지각 40° → 밑각 (180° − 40°) ÷ 2 = 70°", "밑각 50° → 꼭지각 180° − 50° × 2 = 80°"], "bad": ["밑각을 180° − 꼭지각 으로 (나누기 2 를 빼먹음)", "같은 변이 아닌 각을 밑각으로 착각함"]}, "삼각형의 넓이": {"short": "밑변 × 높이 ÷ 2.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"똑같은 삼각형 두 개를 붙여 평행사변형을 만든 그림\" class=\"nsvg\"><path d=\"M30.0,130.0 L150.0,130.0 L190.0,50.0 L70.0,50.0 Z\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M30.0,130.0 L150.0,130.0 L190.0,50.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M30.0,130.0 L190.0,50.0 L70.0,50.0 Z\" fill=\"#fff4cc\" stroke=\"#b8860b\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"190\" y1=\"50\" x2=\"190\" y2=\"130\" stroke=\"#c62828\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/><text x=\"150\" y=\"150\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">밑변</text><text x=\"198\" y=\"94\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">높이</text><text x=\"90\" y=\"100\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">삼각형 ①</text><text x=\"112\" y=\"70\" font-size=\"11\" text-anchor=\"middle\" fill=\"#8a5a00\" font-weight=\"normal\">삼각형 ②</text><text x=\"268\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">똑같은 삼각형</text><text x=\"268\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2개를 붙이면</text><text x=\"268\" y=\"72\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">평행사변형</text><text x=\"268\" y=\"102\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">평행사변형 넓이</text><text x=\"268\" y=\"118\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">= 밑변 × 높이</text><text x=\"268\" y=\"142\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">삼각형 = ÷ 2</text></svg>", "steps": ["똑같은 삼각형 두 개를 뒤집어서 붙이면 평행사변형이 돼요.", "평행사변형의 넓이는 밑변 × 높이예요.", "삼각형은 그 절반이니까 밑변 × 높이 ÷ 2.", "높이는 밑변에 수직으로 잰 길이예요. (비스듬한 변의 길이가 아니에요)", "💡 왜 ÷2 일까요? 같은 삼각형 두 개를 붙이면 밑변 × 높이인 평행사변형이 돼요. 삼각형은 그 절반이에요."], "ex": ["밑변 6, 높이 4 → 6 × 4 ÷ 2 = 12", "밑변 10, 높이 3 → 10 × 3 ÷ 2 = 15"], "bad": ["÷ 2 를 빼먹음", "높이 대신 비스듬한 변의 길이를 곱함"]}, "원의 넓이": {"short": "반지름 × 반지름 × 3.14 (π).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"원을 조각내어 엇갈려 붙이면 가로 πr, 세로 r인 직사각형\" class=\"nsvg\"><circle cx=\"62\" cy=\"86\" r=\"50\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><line x1=\"62\" y1=\"86\" x2=\"112.0\" y2=\"86.0\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><line x1=\"62\" y1=\"86\" x2=\"97.35533905932738\" y2=\"50.64466094067263\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><line x1=\"62\" y1=\"86\" x2=\"62.0\" y2=\"36.0\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><line x1=\"62\" y1=\"86\" x2=\"26.64466094067263\" y2=\"50.64466094067262\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><line x1=\"62\" y1=\"86\" x2=\"12.0\" y2=\"86.0\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><line x1=\"62\" y1=\"86\" x2=\"26.644660940672615\" y2=\"121.35533905932738\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><line x1=\"62\" y1=\"86\" x2=\"61.99999999999999\" y2=\"136.0\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><line x1=\"62\" y1=\"86\" x2=\"97.35533905932738\" y2=\"121.35533905932738\" stroke=\"#1a56a0\" stroke-width=\"1.2\"/><text x=\"62\" y=\"154\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">피자처럼 8조각</text><line x1=\"124\" y1=\"86\" x2=\"160\" y2=\"86\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><path d=\"M152,80 L162,86 L152,92\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><rect x=\"170\" y=\"52\" width=\"120\" height=\"48\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><text x=\"230\" y=\"46\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">가로 ≈ 원주의 반 = πr</text><text x=\"160\" y=\"82\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">r</text><text x=\"230\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">엇갈려 붙이면 직사각형</text><text x=\"230\" y=\"142\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">넓이 = πr × r = πr²</text><text x=\"230\" y=\"162\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(r = 10 → 10 × 10 × 3.14 = 314)</text></svg>", "steps": ["원을 피자처럼 아주 잘게 잘라서 위아래로 엇갈려 붙여 보세요.", "조각을 잘게 자를수록 직사각형에 가까워져요.", "직사각형의 가로 = 원주의 절반 = (2πr) ÷ 2 = πr, 세로 = 반지름 r", "넓이 = πr × r = πr². 계산할 땐 반지름 × 반지름 × 3.14.", "💡 왜 r×r×π 일까요? 원을 부채꼴 조각으로 잘게 잘라 이어 붙이면 직사각형에 가까워져요. 가로는 원둘레의 절반(πr), 세로는 반지름 r 이라 넓이는 πr × r = πr² 예요."], "ex": ["반지름 10 cm → 10 × 10 × 3.14 = 314 cm²", "지름 8 cm → 반지름 4 → 4 × 4 × 3.14 = 50.24 cm²"], "bad": ["지름을 반지름으로 착각함 (지름의 절반이 반지름)", "원의 둘레(2πr)와 섞어 씀"]}, "분수의 계산과 약분": {"short": "분모가 같아야 분자끼리 계산. 다르면 통분하고, 마지막에 약분.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"1/2과 1/3을 6칸으로 나눠 3/6+2/6=5/6\" class=\"nsvg\"><text x=\"10\" y=\"30\" font-size=\"13\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">1/2</text><rect x=\"40.0\" y=\"14\" width=\"120.0\" height=\"22\" fill=\"#e8f0fb\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"160.0\" y=\"14\" width=\"120.0\" height=\"22\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"10\" y=\"68\" font-size=\"13\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">+ 1/3</text><rect x=\"40.0\" y=\"50\" width=\"80.0\" height=\"22\" fill=\"#e6f4ea\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"120.0\" y=\"50\" width=\"80.0\" height=\"22\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"200.0\" y=\"50\" width=\"80.0\" height=\"22\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"160\" y=\"104\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">칸의 크기가 달라서 바로 못 더해요 → 같은 크기(6칸)로 나눠요 (통분)</text><text x=\"10\" y=\"128\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">3/6 + 2/6</text><rect x=\"40\" y=\"114\" width=\"40\" height=\"22\" fill=\"#e8f0fb\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"114\" width=\"40\" height=\"22\" fill=\"#e8f0fb\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"120\" y=\"114\" width=\"40\" height=\"22\" fill=\"#e8f0fb\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"160\" y=\"114\" width=\"40\" height=\"22\" fill=\"#e6f4ea\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"114\" width=\"40\" height=\"22\" fill=\"#e6f4ea\" stroke=\"#333\" stroke-width=\"1.5\"/><rect x=\"240\" y=\"114\" width=\"40\" height=\"22\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"160\" y=\"166\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">= 5/6   (분모는 그대로, 분자끼리 더해요)</text></svg>", "steps": ["분수는 ‘전체를 몇 칸으로 나눈 것 중 몇 칸’이에요. 칸의 크기가 같아야 더할 수 있어요.", "1/2 은 2칸, 1/3 은 3칸으로 나눈 거라서 크기가 달라요. 두 분모의 공배수(6)로 같게 맞춰요 → 통분. 1/2 = 3/6, 1/3 = 2/6", "칸 크기가 같아졌으니 분자끼리 더해요. 3/6 + 2/6 = 5/6 (분모는 그대로)", "마지막에 분모와 분자를 둘 다 나누어지는 수로 나눠요 → 약분. 4/6 = 2/3", "💡 왜 통분할까요? 조각 크기(분모)가 다르면 개수를 그냥 더할 수 없어요. 같은 크기로 맞춘 뒤 개수(분자)를 더해요. 약분은 분모·분자를 같은 수로 나눠도 크기가 같기 때문에 가능해요."], "ex": ["1/2 + 1/3 = 3/6 + 2/6 = 5/6", "3/4 − 1/6 = 9/12 − 2/12 = 7/12", "4/6 → 2 로 약분 → 2/3"], "bad": ["분모끼리도 더함 (1/2 + 1/3 = 2/5 ✗)", "약분 없이 끝냄 (4/6 를 그대로 둠)"]}, "최대공약수": {"short": "두 수의 공약수 중 가장 큰 수.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"12와 18의 약수 중 공통인 1,2,3,6 중 가장 큰 6\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">12 의 약수(위) · 18 의 약수(아래)</text><rect x=\"14\" y=\"26\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"35\" y=\"45\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><rect x=\"64\" y=\"26\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"85\" y=\"45\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><rect x=\"114\" y=\"26\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"135\" y=\"45\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3</text><rect x=\"164\" y=\"26\" width=\"42\" height=\"28\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.2\"/><text x=\"185\" y=\"45\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">4</text><rect x=\"214\" y=\"26\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"235\" y=\"45\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">6</text><rect x=\"264\" y=\"26\" width=\"42\" height=\"28\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.2\"/><text x=\"285\" y=\"45\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">12</text><rect x=\"14\" y=\"64\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"35\" y=\"83\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><rect x=\"64\" y=\"64\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"85\" y=\"83\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><rect x=\"114\" y=\"64\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"135\" y=\"83\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3</text><rect x=\"164\" y=\"64\" width=\"42\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"185\" y=\"83\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">6</text><rect x=\"214\" y=\"64\" width=\"42\" height=\"28\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.2\"/><text x=\"235\" y=\"83\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">9</text><rect x=\"264\" y=\"64\" width=\"42\" height=\"28\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.2\"/><text x=\"285\" y=\"83\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">18</text><text x=\"160\" y=\"118\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">공통인 약수(초록): 1, 2, 3, 6  → 가장 큰 수 = 6</text><text x=\"160\" y=\"142\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">12 = 2² × 3,   18 = 2 × 3²</text><text x=\"160\" y=\"162\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">공통으로 들어 있는 것만 곱하면 2 × 3 = 6</text></svg>", "steps": ["약수는 어떤 수를 나누어떨어지게 하는 수예요. 12 의 약수: 1, 2, 3, 4, 6, 12", "두 수에 모두 들어 있는 약수를 공약수라고 해요. 12 와 18 의 공약수: 1, 2, 3, 6", "그중 가장 큰 수가 최대공약수예요. → 6", "큰 수는 소인수분해로 찾아요. 12 = 2² × 3, 18 = 2 × 3² 에서 공통인 2 와 3 만(작은 쪽 지수로) 곱해요. 2 × 3 = 6", "약분할 때 분모와 분자를 최대공약수로 나누면 한 번에 끝나요.", "💡 왜 공통으로 나눌까요? 두 수를 모두 나누는 수가 공약수예요. 소인수분해에서 공통으로 들어 있는 소수를 낮은 지수만큼 모두 곱하면 가장 큰 공약수가 돼요."], "ex": ["12 와 18 → 6", "24 와 36 → 24 = 2³×3, 36 = 2²×3² → 2² × 3 = 12", "8 과 15 → 1 (공통 약수가 1 뿐)"], "bad": ["최소공배수와 헷갈림 (공배수는 더 큰 수가 나와요)", "공통인 약수 중 가장 큰 수가 아니라 가장 작은 수(1)를 답으로 씀"]}, "곱의 법칙": {"short": "이것도 하고 저것도 하면 곱하고, ‘또는’이면 더한다. 조건 있는 자리(0 불가, 짝수)는 먼저 정하고, 경우가 갈리면 나눠서 더한다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"셔츠 3벌 각각에 바지 2벌이 이어지는 나뭇가지 그림\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">셔츠 3벌 × 바지 2벌 = 입는 방법 몇 가지?</text><circle cx=\"40\" cy=\"46\" r=\"14\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"40\" y=\"51\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">가</text><line x1=\"54\" y1=\"46\" x2=\"138\" y2=\"34\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"138\" y=\"24\" width=\"34\" height=\"20\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"155\" y=\"39\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><line x1=\"54\" y1=\"46\" x2=\"138\" y2=\"58\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"138\" y=\"48\" width=\"34\" height=\"20\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"155\" y=\"63\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><circle cx=\"40\" cy=\"92\" r=\"14\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"40\" y=\"97\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">나</text><line x1=\"54\" y1=\"92\" x2=\"138\" y2=\"80\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"138\" y=\"70\" width=\"34\" height=\"20\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"155\" y=\"85\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><line x1=\"54\" y1=\"92\" x2=\"138\" y2=\"104\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"138\" y=\"94\" width=\"34\" height=\"20\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"155\" y=\"109\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><circle cx=\"40\" cy=\"138\" r=\"14\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"40\" y=\"143\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">다</text><line x1=\"54\" y1=\"138\" x2=\"138\" y2=\"126\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"138\" y=\"116\" width=\"34\" height=\"20\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"155\" y=\"131\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><line x1=\"54\" y1=\"138\" x2=\"138\" y2=\"150\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"138\" y=\"140\" width=\"34\" height=\"20\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"155\" y=\"155\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><text x=\"250\" y=\"70\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">셔츠 하나마다</text><text x=\"250\" y=\"88\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">바지가 2가지씩</text><text x=\"250\" y=\"120\" font-size=\"16\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3 × 2 = 6</text><text x=\"250\" y=\"140\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(가x, 가y, 나x, 나y, 다x, 다y)</text></svg>", "steps": ["‘이것도 고르고 그리고 저것도 고를 때’ 는 나뭇가지 그림을 그려 보세요.", "셔츠 하나를 고르면, 그 하나마다 바지 2가지가 이어져요.", "셔츠가 3벌이니 가지가 3 × 2 = 6 개 나와요. 그래서 방법의 수는 곱해요.", "‘또는’ (하나만 고르기) 일 때는 더해요. 셔츠 또는 바지 중 하나 → 3 + 2 = 5.", "자리에 조건이 있으면 조건이 있는 자리부터 정해요. ‘백의 자리에 0 불가’, ‘짝수’ 같은 조건이에요.", "조건 때문에 뒤의 가짓수가 달라지면 경우를 나눠 각각 곱한 뒤 더해요. 일의 자리가 0일 때와 2일 때를 따로 세는 식이에요."], "ex": ["셔츠 3벌, 바지 2벌 → 3 × 2 = 6가지", "주사위 한 개와 동전 한 개 → 6 × 2 = 12가지", "0, 1, 2, 3 카드 중 3장으로 만드는 세 자리 짝수 → 일의 자리 0: 3×2 = 6, 일의 자리 2: (백: 1·3) 2 × (십) 2 = 4, 합하면 10개"], "bad": ["‘그리고’ 인데 더함 (또는 ↔ 더하기, 그리고 ↔ 곱하기)", "백의 자리에 0이 올 수 없는데 4×3×2처럼 그냥 곱함 (조건 자리부터 먼저, 경우 나누기)"]}, "받아올림이 있는 덧셈": {"short": "같은 자리끼리 더하고, 10이 넘으면 윗자리로 1 올림.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"28+15를 세로로 더하며 일의 자리에서 십의 자리로 1을 올림\" class=\"nsvg\"><text x=\"60\" y=\"30\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">세로셈</text><text x=\"88\" y=\"56\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">1</text><text x=\"70\" y=\"86\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><text x=\"106\" y=\"86\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">8</text><text x=\"46\" y=\"116\" font-size=\"20\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">+</text><text x=\"70\" y=\"116\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><text x=\"106\" y=\"116\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">5</text><line x1=\"36\" y1=\"126\" x2=\"128\" y2=\"126\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"70\" y=\"152\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">4</text><text x=\"106\" y=\"152\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3</text><line x1=\"88\" y1=\"64\" x2=\"76\" y2=\"76\" stroke=\"#c62828\" stroke-width=\"1.5\"/><path d=\"M78.3,69.4 L76,76 L82.6,73.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"150\" y=\"50\" font-size=\"12\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">① 일의 자리 8 + 5 = 13</text><text x=\"150\" y=\"72\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">② 10 은 윗자리로 1 올림</text><text x=\"150\" y=\"94\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">   남은 3 은 일의 자리에</text><text x=\"150\" y=\"120\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">③ 십의 자리 1 + 2 + 1 = 4</text><text x=\"150\" y=\"150\" font-size=\"15\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">28 + 15 = 43</text></svg>", "steps": ["숫자를 자리끼리 맞춰 세로로 써요. 일의 자리는 일의 자리끼리, 십의 자리는 십의 자리끼리 더해요.", "일의 자리부터 더해요. 8 + 5 = 13 이에요. 한 자리에는 9까지만 쓸 수 있어서, 13 을 ‘10 과 3’ 으로 나눠요.", "3 은 일의 자리에 쓰고, 10 은 십의 자리로 보내요. 십의 자리 위에 작게 1 을 적어 둬요.", "십의 자리를 더해요. 올린 1 도 꼭 더해요. 1 + 2 + 1 = 4 → 답은 43.", "💡 왜 올릴까요? 한 자리에 쓸 수 있는 숫자는 0~9 뿐이에요. 10이 되면 한 자리 위의 1 개와 같은 값(10 = 십 1개)이라 윗자리로 1 올려요."], "ex": ["28 + 15 → 8 + 5 = 13 → 3 쓰고 1 올림 → 2 + 1 + 1 = 4 → 43", "47 + 38 → 7 + 8 = 15 → 5 쓰고 1 올림 → 4 + 3 + 1 = 8 → 85", "76 + 54 → 6 + 4 = 10 → 0 쓰고 1 올림 → 7 + 5 + 1 = 13 → 130"], "bad": ["올린 1 을 십의 자리에 더하는 것을 잊음 (28 + 15 = 33)", "13 을 그대로 일의 자리에 씀 (28 + 15 = 313)"]}, "받아내림이 있는 뺄셈": {"short": "같은 자리끼리 빼고, 모자라면 윗자리에서 10을 빌려 옴.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"42-17을 세로로 빼며 십의 자리에서 10을 빌려 옴\" class=\"nsvg\"><text x=\"60\" y=\"30\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">세로셈</text><text x=\"70\" y=\"56\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3</text><text x=\"94\" y=\"50\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">1</text><text x=\"70\" y=\"86\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">4</text><line x1=\"60\" y1=\"78\" x2=\"80\" y2=\"64\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"106\" y=\"86\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><text x=\"46\" y=\"116\" font-size=\"20\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">−</text><text x=\"70\" y=\"116\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><text x=\"106\" y=\"116\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">7</text><line x1=\"36\" y1=\"126\" x2=\"128\" y2=\"126\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"70\" y=\"152\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><text x=\"106\" y=\"152\" font-size=\"22\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">5</text><text x=\"150\" y=\"46\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">① 일의 자리 2 에서 7 못 뺌</text><text x=\"150\" y=\"66\" font-size=\"12\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">② 십의 자리에서 10 을 빌림</text><text x=\"150\" y=\"86\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">   4 → 3,  2 → 12</text><text x=\"150\" y=\"110\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">③ 12 − 7 = 5</text><text x=\"150\" y=\"130\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">④ 십의 자리 3 − 1 = 2</text><text x=\"150\" y=\"158\" font-size=\"15\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">42 − 17 = 25</text></svg>", "steps": ["일의 자리부터 빼요. 2 에서 7 을 뺄 수 없어요.", "십의 자리에서 10 을 빌려 와요. 십의 자리 4 는 하나 줄어 3 이 되고, 일의 자리 2 는 12 가 돼요. (10 + 2)", "일의 자리: 12 − 7 = 5 를 써요.", "십의 자리: 빌려 주고 남은 3에서 17의 십의 자리 1을 빼요. 3 − 1 = 2 → 답은 25.", "💡 왜 10을 빌릴까요? 윗자리 1 은 아랫자리 10 과 같은 값이에요. 일의 자리가 모자라면 십의 자리 1을 10으로 바꿔 와서 계산해요."], "ex": ["42 − 17 → 12 − 7 = 5, 3 − 1 = 2 → 25", "51 − 28 → 11 − 8 = 3, 4 − 2 = 2 → 23", "60 − 34 → 10 − 4 = 6, 5 − 3 = 2 → 26"], "bad": ["빌려 줬는데 십의 자리를 그대로 둠 (4 − 1 = 3 으로 계산)", "큰 수에서 작은 수를 거꾸로 뺌 (7 − 2 = 5 로 계산해서 일의 자리를 틀림)"]}, "자릿값": {"short": "같은 숫자도 자리에 따라 값이 달라진다. 100이 3개 = 300.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"325의 백, 십, 일의 자리 숫자와 각각의 값 300, 20, 5\" class=\"nsvg\"><text x=\"160\" y=\"18\" font-size=\"20\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">325</text><rect x=\"30\" y=\"30\" width=\"84\" height=\"28\" fill=\"#f1f3f6\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"72\" y=\"49\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">백의 자리</text><rect x=\"30\" y=\"58\" width=\"84\" height=\"40\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"72\" y=\"88\" font-size=\"26\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3</text><line x1=\"72\" y1=\"100\" x2=\"72\" y2=\"114\" stroke=\"#c62828\" stroke-width=\"2\"/><path d=\"M69.0,107.7 L72,114 L75.0,107.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"30\" y=\"116\" width=\"84\" height=\"28\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"72\" y=\"135\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">300</text><rect x=\"122\" y=\"30\" width=\"84\" height=\"28\" fill=\"#f1f3f6\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"164\" y=\"49\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">십의 자리</text><rect x=\"122\" y=\"58\" width=\"84\" height=\"40\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"164\" y=\"88\" font-size=\"26\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2</text><line x1=\"164\" y1=\"100\" x2=\"164\" y2=\"114\" stroke=\"#1a56a0\" stroke-width=\"2\"/><path d=\"M161.0,107.7 L164,114 L167.0,107.7\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"122\" y=\"116\" width=\"84\" height=\"28\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"164\" y=\"135\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">20</text><rect x=\"214\" y=\"30\" width=\"84\" height=\"28\" fill=\"#f1f3f6\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"256\" y=\"49\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">일의 자리</text><rect x=\"214\" y=\"58\" width=\"84\" height=\"40\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"256\" y=\"88\" font-size=\"26\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">5</text><line x1=\"256\" y1=\"100\" x2=\"256\" y2=\"114\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M253.0,107.7 L256,114 L259.0,107.7\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"214\" y=\"116\" width=\"84\" height=\"28\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.3\"/><text x=\"256\" y=\"135\" font-size=\"15\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">5</text><text x=\"160\" y=\"166\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">325 = 300 + 20 + 5</text></svg>", "steps": ["숫자는 놓인 자리에 따라 값이 달라져요. 오른쪽에서부터 일, 십, 백, 천 … 의 자리예요.", "325 에서 3 은 백의 자리라서 100 이 3개 = 300 이에요.", "2 는 십의 자리라서 10 이 2개 = 20, 5 는 일의 자리라서 5 예요.", "그래서 325 = 300 + 20 + 5 로 쓸 수 있어요. 거꾸로 100 이 3개, 10 이 2개, 1 이 5개를 모으면 325 예요.", "💡 왜 자리에 따라 다를까요? 십진법은 10개가 모이면 한 자리 위로 올라가요. 그래서 한 자리 왼쪽으로 갈 때마다 값이 10배가 돼요."], "ex": ["100 이 3개, 10 이 2개, 1 이 5개 → 325", "4,076 에서 4 는 천의 자리 → 4000, 0 은 백의 자리 → 0, 7 은 십의 자리 → 70", "253 에서 2 는 백의 자리 → 200 (325 의 2 는 20 이었죠)"], "bad": ["같은 숫자는 어디에 있든 같은 값이라고 생각함 (325 의 2 와 253 의 2)", "비어 있는 자리를 빼먹음 (100 이 3개, 1 이 5개 → 35 ✗, 305 ✓)"]}, "수의 크기 비교": {"short": "자리 수가 많은 쪽이 크다. 같으면 맨 앞자리부터 비교.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"35와 53은 앞자리 비교, 102와 99는 자리 수 비교\" class=\"nsvg\"><text x=\"80\" y=\"20\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">35  과  53</text><rect x=\"34\" y=\"30\" width=\"28\" height=\"34\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"48\" y=\"55\" font-size=\"20\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3</text><rect x=\"62\" y=\"30\" width=\"28\" height=\"34\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"76\" y=\"55\" font-size=\"20\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">5</text><rect x=\"130\" y=\"30\" width=\"28\" height=\"34\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"144\" y=\"55\" font-size=\"20\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5</text><rect x=\"158\" y=\"30\" width=\"28\" height=\"34\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"172\" y=\"55\" font-size=\"20\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">3</text><text x=\"114\" y=\"55\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">?</text><text x=\"48\" y=\"80\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">십</text><text x=\"144\" y=\"80\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">십</text><text x=\"96\" y=\"104\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">앞자리 3 &lt; 5</text><text x=\"96\" y=\"126\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">→ 53 이 더 커요</text><text x=\"252\" y=\"20\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">102  과  99</text><text x=\"252\" y=\"48\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">세 자리 &gt; 두 자리</text><text x=\"252\" y=\"70\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">자리 수 많은 쪽이 커요</text><text x=\"252\" y=\"100\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">102 &gt; 99</text><text x=\"160\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">자리 수 비교 → 같으면 맨 앞자리부터 하나씩</text></svg>", "steps": ["먼저 자리 수를 세어 봐요. 자리 수가 많은 쪽이 더 커요. (102 는 세 자리, 99 는 두 자리 → 102 가 커요)", "자리 수가 같으면 맨 앞(가장 큰 자리)부터 비교해요. 35 와 53 은 앞자리가 3 과 5 → 53 이 커요.", "앞자리가 같으면 그 다음 자리를 비교해요. 47 과 43 은 앞자리가 같아서 7 과 3 을 비교 → 47 이 커요.", "💡 왜 자리 수가 많으면 클까요? 자리 수가 하나 늘면 값이 10배가 되기 때문에, 맨 앞 자리가 가장 큰 영향을 줘요. 그래서 앞자리부터 비교해요."], "ex": ["35 와 53 → 앞자리 3 < 5 → 53 이 더 커요", "408 과 412 → 4 같음, 0 < 1 → 412 가 더 커요", "99 와 100 → 두 자리 < 세 자리 → 100 이 더 커요"], "bad": ["뒷자리가 큰 수가 더 크다고 생각함 (35 의 5 가 53 의 3 보다 크다고)", "자리 수를 세지 않고 눈으로만 비교함"]}, "가르기와 모으기": {"short": "10을 두 수로 가르면 두 수의 합이 10 (4와 6, 7과 3).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"10개의 동그라미를 4개와 6개로 가르고 다시 모음\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">10 을 4 와 6 으로 가르기</text><circle cx=\"36\" cy=\"62\" r=\"11\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"64\" cy=\"62\" r=\"11\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"92\" cy=\"62\" r=\"11\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"120\" cy=\"62\" r=\"11\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"148\" cy=\"62\" r=\"11\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><circle cx=\"176\" cy=\"62\" r=\"11\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><circle cx=\"204\" cy=\"62\" r=\"11\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><circle cx=\"232\" cy=\"62\" r=\"11\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"62\" r=\"11\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><circle cx=\"288\" cy=\"62\" r=\"11\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><line x1=\"134.0\" y1=\"40\" x2=\"134.0\" y2=\"86\" stroke=\"#2e7d32\" stroke-width=\"2\" stroke-dasharray=\"4\"/><text x=\"78.0\" y=\"106\" font-size=\"18\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">4</text><text x=\"218.0\" y=\"106\" font-size=\"18\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">6</text><text x=\"160\" y=\"138\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">4 + 6 = 10   ←  모으기</text><text x=\"160\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">10 − 4 = 6   ←  가르기 (한쪽을 알면 다른 쪽도 알아요)</text></svg>", "steps": ["전체를 두 묶음으로 나누는 것이 가르기, 두 묶음을 합치는 것이 모으기예요.", "10 은 1과 9, 2와 8, 3과 7, 4와 6, 5와 5 로 가를 수 있어요. 두 수를 더하면 항상 10 이에요.", "한쪽을 알면 다른 쪽을 빼서 알 수 있어요. 10 에서 4 를 덜어 내면 6 이 남아요."], "ex": ["10 은 4 와 6, 7 과 3", "7 은 2 와 □ → 7 − 2 = 5", "8 + □ = 10 → 10 − 8 = 2"], "bad": ["가른 두 수의 합이 처음 수와 다름 (4 와 5 를 10 의 가르기라고 함)", "□ 를 구할 때 더하기로 풀어 버림 (7 − 2 가 아니라 7 + 2 로 계산)"]}, "덧셈과 뺄셈 섞인 계산": {"short": "왼쪽부터 차례로 계산.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"10-3+2를 왼쪽부터 7, 그다음 9로 계산\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"18\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">10 − 3 + 2</text><rect x=\"30\" y=\"40\" width=\"110\" height=\"34\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"85\" y=\"63\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">10 − 3 = 7</text><line x1=\"142\" y1=\"57\" x2=\"176\" y2=\"57\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><path d=\"M169.7,60.0 L176,57 L169.7,54.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><text x=\"160\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">먼저</text><rect x=\"180\" y=\"40\" width=\"110\" height=\"34\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"235\" y=\"63\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">7 + 2 = 9</text><text x=\"160\" y=\"100\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">왼쪽부터 차례로!</text><text x=\"160\" y=\"126\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">✗  3 + 2 = 5 를 먼저 하면  10 − 5 = 5  (틀려요)</text><text x=\"160\" y=\"152\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">10 − 3 + 2 = 9</text></svg>", "steps": ["덧셈과 뺄셈이 같이 있으면 왼쪽부터 차례로 계산해요.", "10 − 3 + 2 에서는 먼저 10 − 3 = 7, 그다음 7 + 2 = 9 예요.", "뒤쪽을 먼저 계산하면 답이 달라져요. 3 + 2 를 먼저 하면 10 − 5 = 5 로 틀려요. 뺄셈 뒤의 + 는 따로 묶이지 않아요."], "ex": ["10 − 3 + 2 = 7 + 2 = 9", "15 + 8 − 6 = 23 − 6 = 17", "20 − 5 − 4 = 15 − 4 = 11"], "bad": ["뒤의 덧셈을 먼저 계산함 (10 − 3 + 2 → 10 − 5)", "20 − 5 − 4 를 20 − (5 − 4) 처럼 계산함"]}, "시계 보기": {"short": "짧은바늘 = 시, 긴바늘 = 분. 긴바늘이 12면 정각.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"짧은바늘이 2와 3 사이, 긴바늘이 6을 가리키는 2시 30분 시계\" class=\"nsvg\"><circle cx=\"84\" cy=\"92\" r=\"66\" fill=\"#fff\" stroke=\"#333\" stro
