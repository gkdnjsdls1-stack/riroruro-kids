fill=\"#1a56a0\" font-weight=\"bold\">다른 경우!</text></svg>", "steps": ["서로 다른 주사위 두 개를 던지면 (첫째 눈, 둘째 눈) 순서쌍으로 결과를 나타내요.", "표를 그려 빠짐없이 세요. 가로는 둘째 눈, 세로는 첫째 눈. 전체 경우는 6 × 6 = 36가지.", "조건에 맞는 칸만 찾아요. 합이 4 → (1, 3), (2, 2), (3, 1) 모두 3가지.", "(1, 3) 과 (3, 1) 은 서로 다른 경우예요. 순서가 달라지면 다른 결과로 세요."], "ex": ["합이 4 인 경우: (1, 3), (2, 2), (3, 1) → 3가지", "합이 7 인 경우: (1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1) → 6가지", "두 눈이 같은 경우: (1,1) … (6,6) → 6가지"], "bad": ["(1, 3) 과 (3, 1) 을 같은 경우로 셈", "표 없이 머릿속으로만 세어 빠뜨림"]}, "닮음비": {"short": "닮은 도형은 대응변의 비가 모두 같다. (작은 변) : (큰 변) = p : q 로 비례식을 세운다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"작은 삼각형과 큰 삼각형의 대응변 4와 12는 닮음비 1대3\" class=\"nsvg\"><path d=\"M30.0,150.0 L70.0,150.0 L50.0,120.0 Z\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M140.0,150.0 L260.0,150.0 L200.0,60.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"50\" y=\"168\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">4</text><text x=\"200\" y=\"168\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">12</text><text x=\"160\" y=\"20\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">닮음비  1 : 3</text><text x=\"160\" y=\"42\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">크기만 다르고 모양은 같아요</text><line x1=\"100\" y1=\"136\" x2=\"134\" y2=\"136\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M127.7,139.0 L134,136 L127.7,133.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"117\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×3</text><text x=\"160\" y=\"84\" font-size=\"1\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\"></text><text x=\"20\" y=\"92\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">4 : 12 = 1 : 3</text><text x=\"20\" y=\"108\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">모든 대응변의 비가 같아요</text></svg>", "steps": ["닮은 도형은 크기는 다르지만 모양이 같아요. 확대·축소한 도형이에요.", "대응하는 변끼리 길이의 비가 모두 같아요. 그 비가 닮음비예요. 4 : 12 = 1 : 3.", "닮음비를 알면 비례식으로 모르는 변을 구해요. 작은 변 4 에 대응하는 큰 변은 4 × 3 = 12.", "거꾸로 큰 변을 알면 3 으로 나눠 작은 변을 구해요.", "💡 왜 비례식일까요? 닮은 도형은 모양이 같고 크기만 일정한 배율로 바뀌어요. 모든 대응변에 같은 배율이 곱해져 대응변의 비가 모두 같아요."], "ex": ["닮음비 1 : 3, 작은 변 4 → 큰 변 12", "닮음비 2 : 5, 작은 변 6 → 6 : x = 2 : 5 → 2x = 30 → x = 15", "닮음비가 3 : 2 이고 큰 변이 9 → 9 × 2/3 = 6"], "bad": ["대응하지 않는 변끼리 비를 구함", "닮음비를 큰 쪽 : 작은 쪽 으로 섞어 씀 (순서를 통일해요)"]}, "점과 직선 사이의 거리": {"short": "점 (x₁, y₁)과 직선 ax + by + c = 0 의 거리 = |ax₁ + by₁ + c| ÷ √(a² + b²).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"점 (1,1)에서 직선 3x+4y−12=0까지 수직으로 잰 거리 1\" class=\"nsvg\"><line x1=\"30.0\" y1=\"140\" x2=\"180.0\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"36\" y1=\"146.0\" x2=\"36\" y2=\"32.0\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"188.0\" y=\"154\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"46\" y=\"30.0\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><line x1=\"66\" y1=\"137\" x2=\"66\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"66\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"96\" y1=\"137\" x2=\"96\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"96\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"126\" y1=\"137\" x2=\"126\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"126\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"156\" y1=\"137\" x2=\"156\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"156\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">4</text><line x1=\"33\" y1=\"110\" x2=\"39\" y2=\"110\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"28\" y=\"114\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"33\" y1=\"80\" x2=\"39\" y2=\"80\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"28\" y=\"84\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"33\" y1=\"50\" x2=\"39\" y2=\"50\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"28\" y=\"54\" font-size=\"11\" text-anchor=\"end\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"156\" y1=\"140\" x2=\"36\" y2=\"50\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><text x=\"54\" y=\"38\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">3x + 4y − 12 = 0</text><line x1=\"66\" y1=\"110\" x2=\"84.0\" y2=\"86.0\" stroke=\"#c62828\" stroke-width=\"2.5\"/><circle cx=\"66\" cy=\"110\" r=\"4.5\" fill=\"#c62828\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"58\" y=\"126\" font-size=\"11\" text-anchor=\"end\" fill=\"#c62828\" font-weight=\"bold\">(1, 1)</text><path d=\"M77.0,91.0 L81.2,86.5 L81.2,86.5\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><text x=\"200\" y=\"40\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">거리 = </text><text x=\"200\" y=\"58\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">|ax₁ + by₁ + c|</text><line x1=\"200\" y1=\"64\" x2=\"298\" y2=\"64\" stroke=\"#333\" stroke-width=\"1.4\"/><text x=\"200\" y=\"80\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">√(a² + b²)</text><text x=\"200\" y=\"108\" font-size=\"11\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"normal\">= |3 + 4 − 12| ÷ √25</text><text x=\"200\" y=\"128\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">= 5 ÷ 5 = 1</text></svg>", "steps": ["점에서 직선까지의 거리는 점에서 직선에 수직으로 내린 선분의 길이예요. 가장 짧은 거리예요.", "직선을 ax + by + c = 0 꼴로 만들어요. 3x + 4y − 12 = 0 이면 a = 3, b = 4, c = −12.", "점의 좌표를 대입해 절댓값을 취해요. |3 × 1 + 4 × 1 − 12| = |−5| = 5.", "√(a² + b²) = √(9 + 16) = 5 로 나눠요. 거리 = 5 ÷ 5 = 1.", "💡 왜 이 식일까요? 점에서 직선까지의 거리는 수직으로 내린 가장 짧은 길이에요. 직선의 법선(수직) 방향으로 잰 값은 |ax₁+by₁+c| 를 √(a²+b²) 로 나눈 것과 같아서 이 식이 돼요."], "ex": ["(1, 1) 과 3x + 4y − 12 = 0 → |3 + 4 − 12| ÷ 5 = 1", "원점과 x + y − 2 = 0 → |−2| ÷ √2 = √2", "(0, 0) 과 3x + 4y − 10 = 0 → 10 ÷ 5 = 2"], "bad": ["직선을 ax + by + c = 0 꼴로 정리하지 않고 대입함 (오른쪽이 0 이 되어야 해요)", "절댓값을 빼먹어서 거리가 음수가 됨"]}, "지수방정식": {"short": "밑을 같게 만들고 지수끼리 같다고 놓는다. aˣ = aᵏ ⇒ x = k.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"3의 x제곱이 9이면 3²으로 바꿔 x=2\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"18\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3ˣ = 9</text><line x1=\"160\" y1=\"24\" x2=\"160\" y2=\"42\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M157.0,35.7 L160,42 L163.0,35.7\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"222\" y=\"38\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">9 를 3² 으로</text><rect x=\"100\" y=\"44\" width=\"120\" height=\"28\" fill=\"#fff4cc\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"64\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">3ˣ = 3²</text><line x1=\"160\" y1=\"74\" x2=\"160\" y2=\"92\" stroke=\"#c62828\" stroke-width=\"2\"/><path d=\"M157.0,85.7 L160,92 L163.0,85.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"222\" y=\"88\" font-size=\"11\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">밑이 같으면</text><text x=\"222\" y=\"102\" font-size=\"11\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">지수끼리 같아요</text><rect x=\"100\" y=\"94\" width=\"120\" height=\"28\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"115\" font-size=\"16\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">x = 2</text><text x=\"160\" y=\"144\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2ˣ⁺¹ = 16 = 2⁴  →  x + 1 = 4  →  x = 3</text><text x=\"160\" y=\"168\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">밑이 다르면 먼저 같은 밑으로 맞춰요</text></svg>", "steps": ["지수방정식은 지수 자리에 x 가 있는 방정식이에요. 3ˣ = 9 같은 식이에요.", "양변의 밑을 같게 만들어요. 9 = 3² 이니까 3ˣ = 3².", "밑이 같으면 지수도 같아요. (밑이 1이 아닌 양수일 때) 그래서 x = 2.", "밑이 처음부터 다르면 거듭제곱으로 바꿔 맞춰요. 4ˣ = 8 → (2²)ˣ = 2³ → 2x = 3 → x = 3/2.", "💡 왜 지수만 같다고 놓을까요? 밑이 같으면 지수가 다를 때 값도 달라요. 즉 aˣ = aᵏ 이면 x = k 뿐이에요. 그래서 밑을 같게 맞추는 게 핵심이에요."], "ex": ["3ˣ = 9 = 3² → x = 2", "2ˣ⁺¹ = 16 = 2⁴ → x + 1 = 4 → x = 3", "4ˣ = 8 → 2²ˣ = 2³ → 2x = 3 → x = 3/2"], "bad": ["밑을 맞추지 않고 3ˣ = 9 에서 x = 9 ÷ 3 = 3 으로 계산함", "지수를 구한 뒤 x + 1 = 4 를 x = 4 로 둠"]}, "유리수 지수": {"short": "a > 0일 때 a^(m/n) = (ⁿ√a)ᵐ. 분모는 n제곱근, 분자는 m제곱.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"8의 3분의 2제곱은 8의 세제곱근 2를 제곱한 4\" class=\"nsvg\"><text x=\"66\" y=\"84\" font-size=\"44\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">8</text><text x=\"112\" y=\"52\" font-size=\"20\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">2</text><line x1=\"104\" y1=\"60\" x2=\"124\" y2=\"60\" stroke=\"#333\" stroke-width=\"1.6\"/><text x=\"112\" y=\"80\" font-size=\"20\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">3</text><line x1=\"112\" y1=\"38\" x2=\"92\" y2=\"24\" stroke=\"#c62828\" stroke-width=\"1.8\"/><path d=\"M98.9,25.1 L92,24 L95.4,30.1\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"78\" y=\"20\" font-size=\"11.5\" text-anchor=\"end\" fill=\"#c62828\" font-weight=\"bold\">분자 2: 제곱</text><line x1=\"112\" y1=\"88\" x2=\"112\" y2=\"108\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><path d=\"M109.0,101.7 L112,108 L115.0,101.7\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"112\" y=\"124\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">분모 3: 세제곱근</text><text x=\"160\" y=\"50\" font-size=\"15\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">= (³√8)²</text><text x=\"160\" y=\"76\" font-size=\"15\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">= 2²</text><text x=\"160\" y=\"102\" font-size=\"17\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">= 4</text><text x=\"160\" y=\"132\" font-size=\"13\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">aᵐ/ⁿ = (ⁿ√a)ᵐ</text><text x=\"160\" y=\"160\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">8 = 2³ 으로 바꾸면 (2³)²ᐟ³ = 2²</text></svg>", "steps": ["지수가 분수일 때는 분모가 ‘몇 제곱근’, 분자가 ‘몇 제곱’ 이라는 뜻이에요. a^(m/n) = (ⁿ√a)ᵐ.", "8^(2/3) 에서 분모 3 → 세제곱근, 분자 2 → 제곱.", "세제곱근 ³√8 = 2 이므로 8^(2/3) = 2² = 4.", "밑을 거듭제곱으로 바꾸면 더 쉬워요. 8 = 2³ 이라서 (2³)^(2/3) = 2^(3 × 2/3) = 2² = 4.", "💡 왜 a^(m/n) 일까요? (a^(1/n))ⁿ = a 가 되려면 a^(1/n) 은 ⁿ√a 여야 해요. 지수법칙 (aᵐ)ⁿ = aᵐⁿ 이 계속 성립하도록 분수 지수를 이렇게 약속했어요."], "ex": ["8^(2/3) = (2³)^(2/3) = 2² = 4", "9^(1/2) = √9 = 3", "27^(−1/3) = 1 / 27^(1/3) = 1/3"], "bad": ["분모와 분자의 역할을 바꿈 (분모가 제곱, 분자가 근호라고 생각함)", "지수가 음수일 때 역수를 취하지 않음"]}, "합의 기호 Σ와 거듭제곱의 합": {"short": "Σₖ₌₁ⁿ k = n(n+1)/2, Σₖ₌₁ⁿ k² = n(n+1)(2n+1)/6. 일반항이 다항식이면 항별로 쪼갠다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"계단 모양 1+2+3+4와 뒤집은 계단을 합쳐 4×5칸\" class=\"nsvg\"><text x=\"100\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1 + 2 + 3 + 4  (n = 4)</text><rect x=\"30\" y=\"32\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"50\" y=\"32\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"70\" y=\"32\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"32\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"110\" y=\"32\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"30\" y=\"52\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"50\" y=\"52\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"70\" y=\"52\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"52\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"110\" y=\"52\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"30\" y=\"72\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"50\" y=\"72\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"70\" y=\"72\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"72\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"110\" y=\"72\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"30\" y=\"92\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"50\" y=\"92\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"70\" y=\"92\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"90\" y=\"92\" width=\"20\" height=\"20\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"110\" y=\"92\" width=\"20\" height=\"20\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"80.0\" y=\"128\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">파랑 + 빨강 = 4 × 5 칸</text><text x=\"210\" y=\"44\" font-size=\"12.5\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">2 × (합) = n(n + 1)</text><text x=\"210\" y=\"66\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">합 = n(n + 1)/2</text><text x=\"210\" y=\"88\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">= 4 × 5 / 2 = 10</text><text x=\"210\" y=\"118\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">Σ k = n(n + 1)/2</text><text x=\"210\" y=\"136\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">Σ k² = n(n+1)(2n+1)/6</text><text x=\"160\" y=\"172\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">Σ (k = 1 → n) 은 ‘k 에 1 부터 n 까지 넣어 더하라’ 는 기호</text></svg>", "steps": ["Σ (시그마) 는 합의 기호예요. Σ(k = 1 → n) k 는 k 에 1, 2, …, n 을 차례로 넣어 모두 더하라는 뜻이에요.", "1 + 2 + 3 + 4 를 계단 모양으로 쌓고, 뒤집은 계단을 붙이면 4 × 5 직사각형이 돼요. 합의 2배가 n(n + 1).", "그래서 1 + 2 + … + n = n(n + 1)/2. n = 4 이면 4 × 5/2 = 10.", "제곱의 합은 Σk² = n(n + 1)(2n + 1)/6. 일반항이 다항식이면 항별로 쪼개서 이 공식들을 써요.", "💡 왜 n(n+1)/2 일까요? 1+2+…+n 을 거꾸로 써서 더하면 짝마다 합이 n+1 이고 n쌍이라 n(n+1) 이에요. 2번 센 값이라 2로 나눠요. 제곱의 합 공식은 (k+1)³ − k³ = 3k² + 3k + 1 을 모두 더해 얻어요."], "ex": ["Σ(k = 1 → 10) k = 10 × 11/2 = 55", "Σ(k = 1 → 3) k² = 1 + 4 + 9 = 14 (공식: 3 × 4 × 7/6 = 14)", "Σ(k = 1 → n) (2k + 1) = 2 × n(n + 1)/2 + n = n(n + 2)"], "bad": ["Σ 를 곱셈 기호로 읽음", "상수항의 합을 빼먹음 (Σ 1 = n 이에요)"]}, "식의 값 (대입)": {"short": "문자에 수를 넣어 계산한다. 음수를 넣을 땐 괄호를 쓴다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"x에 −2를 괄호로 넣어 (−2)²+1=5\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">x = −2 일 때 x² + 1</text><rect x=\"60\" y=\"28\" width=\"80\" height=\"30\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"100\" y=\"49\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">x² + 1</text><line x1=\"144\" y1=\"43\" x2=\"176\" y2=\"43\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><path d=\"M169.7,46.0 L176,43 L169.7,40.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><text x=\"160\" y=\"64\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">x 에 −2</text><rect x=\"180\" y=\"28\" width=\"110\" height=\"30\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"235\" y=\"49\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">(−2)² + 1</text><text x=\"235\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">음수는 괄호로!</text><text x=\"160\" y=\"100\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">= 4 + 1 = 5</text><text x=\"160\" y=\"130\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">✗  −2² + 1 = −4 + 1 = −3  (괄호 없이 넣으면 틀려요)</text><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">문자가 여러 개면 하나씩 정확히 바꿔 넣어요</text><text x=\"160\" y=\"172\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">x = 2, y = −1 일 때 x − y = 2 − (−1) = 3</text></svg>", "steps": ["식의 값은 문자 자리에 주어진 수를 넣어(대입) 계산한 결과예요.", "문자가 있던 자리를 하나도 빼놓지 말고 수로 바꿔 써요. 특히 음수를 넣을 때는 괄호로 묶어요. x² + 1 → (−2)² + 1.", "괄호 덕분에 (−2)² = (−2) × (−2) = 4 가 돼요. 계산 순서에 맞게 4 + 1 = 5.", "여러 문자는 각각 정확히 바꿔요. x = 2, y = −1 이면 x − y = 2 − (−1) = 3.", "💡 왜 괄호를 쓸까요? x = −3 일 때 x² 은 −3² (= −9) 가 아니라 (−3)² = 9 예요. 괄호가 있어야 부호까지 제곱이 돼요."], "ex": ["x = −2 일 때 x² + 1 = (−2)² + 1 = 5", "x = 3 일 때 2x − 5 = 6 − 5 = 1", "x = 2, y = −1 일 때 x − y = 2 − (−1) = 3"], "bad": ["음수를 괄호 없이 넣음 (−2² + 1 = −3 ✗)", "문자 한 곳만 바꾸고 다른 곳은 그대로 둠"]}, "메다 / 매다": {"short": "어깨에 걸치거나 지면 메다, 끈이나 줄을 묶으면 매다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"메다 / 매다\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">메다</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">어깨에 걸치거나 짊어짐</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 가방을 메다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">매다</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">끈·줄을 묶음</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 신발 끈을 매다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">어깨 → 메다 (멨다) / 끈 → 매다 (맸다)</text></svg>", "steps": ["두 낱말은 소리가 비슷해서 헷갈려요. 무엇을 하는지 동작을 떠올려요.", "어깨나 몸에 걸쳐 올리면 ‘메다’예요. 가방을 메다, 총을 메다.", "끈이나 줄을 묶어서 풀리지 않게 하면 ‘매다’예요. 신발 끈을 매다, 넥타이를 매다.", "과거형은 ‘멨다’, ‘맸다’로 써요."], "ex": ["어깨에 가방을 (메)고 학교에 갔다.", "운동화 끈을 단단히 (매)었다 → 맸다.", "넥타이를 (매)고 출근했다."], "bad": ["넥타이를 ‘메다’로 씀 (넥타이는 묶는 것이라 매다)", "가방을 ‘매다’로 씀 (어깨에 걸치는 것이라 메다)"]}, "가리키다 / 가르치다": {"short": "손가락 등으로 짚어 보이면 가리키다, 지식·기술을 알려 주면 가르치다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"가리키다 / 가르치다\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">가리키다</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">손가락 등으로</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">방향·대상을 짚음</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 손가락으로 칠판을</text><text x=\"82\" y=\"119\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">가리키다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">가르치다</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">지식·기술을 알려 줌</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 선생님이 수학을</text><text x=\"238\" y=\"119\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">가르치다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">짚으면 가리키다 / 배우게 하면 가르치다 (↔</text><text x=\"160\" y=\"168\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">배우다)</text></svg>", "steps": ["‘가리키다’는 어디, 무엇인지 방향이나 대상을 짚어서 알려 주는 거예요.", "‘가르치다’는 지식이나 기술을 익히게 해 주는 거예요. 반대말은 ‘배우다’예요.", "‘배우다’와 짝이 되면 ‘가르치다’, 손가락이나 시곗바늘이 어디를 향하면 ‘가리키다’예요."], "ex": ["시곗바늘이 3시를 (가리키)고 있다.", "선생님이 아이들에게 글자를 (가르치)신다.", "동생이 손가락으로 하늘을 (가리키)며 말했다."], "bad": ["시곗바늘이 3시를 ‘가르치다’로 씀 (가리키다)", "‘글을 가리키다’로 씀 (글을 알려 주는 것은 가르치다)"]}, "웬 / 왠": {"short": "‘웬’은 어찌 된·어떤(웬 사람, 웬일). ‘왠’은 ‘왠지’로만 쓴다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"웬 / 왠\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">웬</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">어찌 된, 어떠한 (뒤에</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">명사)</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 웬 사람이 왔다 ·</text><text x=\"82\" y=\"119\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">웬일이니</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">왠</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘왜인지’의 준말,</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘왠지’로만 씀</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 왠지 기분이 좋다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">‘왜인지’로 바꿔 말이 되면 왠지, 나머지는 모두</text><text x=\"160\" y=\"168\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">웬</text></svg>", "steps": ["‘웬’은 뒤에 오는 말(사람, 일, 떡 …)을 꾸며 주는 말이에요. ‘어찌 된, 어떠한’이라는 뜻이에요.", "‘왠’은 혼자서는 쓰지 않아요. ‘왜 + 인지’가 줄어든 ‘왠지’ 한 가지로만 쓰여요.", "헷갈리면 ‘왜인지’로 바꿔 보세요. 자연스러우면 ‘왠지’, 아니면 ‘웬’이에요."], "ex": ["(웬) 떡이냐? → 어찌 된 떡이냐", "(왠지) 오늘은 기분이 좋다. → 왜인지 기분이 좋다", "이게 (웬)일이야? → 어찌 된 일이야"], "bad": ["‘왠 일이야’로 씀 (웬일)", "‘웬지’로 씀 (왜인지 → 왠지)"]}, "안 / 않": {"short": "‘안’은 용언 앞(안 간다), ‘않’은 ‘-지 않다’ 꼴(가지 않는다).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"안 / 않\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">안</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘아니’의 준말,</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">동사·형용사 앞</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 나는 학교에 안 간다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">않</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘아니하’의 준말,</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘-지 않다’ 꼴</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 나는 학교에 가지</text><text x=\"238\" y=\"119\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">않는다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">‘아니’로 바꿔 자연스러우면 안, ‘아니하’로 바꿔</text><text x=\"160\" y=\"168\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">자연스러우면 않</text></svg>", "steps": ["‘안’은 ‘아니’가 줄어든 말이에요. 동사나 형용사 바로 앞에 와요. 안 먹는다, 안 예쁘다.", "‘않’은 ‘아니하’가 줄어든 말이에요. ‘-지 않다’ 꼴로 뒤에 와요. 먹지 않는다, 예쁘지 않다.", "바꿔 보기: ‘아니’를 넣어 보고 자연스러우면 ‘안’, ‘아니하’를 넣어 보고 자연스러우면 ‘않’이에요."], "ex": ["밥을 (안) 먹었다. → 밥을 아니 먹었다", "밥을 먹지 (않)았다. → 밥을 먹지 아니하였다", "비가 오지 (않)는다."], "bad": ["‘먹지 안는다’로 씀 (먹지 않는다)", "‘않 먹는다’로 씀 (안 먹는다)"]}, "금세 / 금새": {"short": "‘지금 바로’의 뜻은 금세(금시에의 준말). 금새는 물건 값을 뜻하는 다른 말.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"금세 / 금새\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">금세</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘금시에’의 준말, 지금</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">바로</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 금세 나았다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">금새</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">물건의 비싸고 싼 정도</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 금새가 비싸다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">‘지금 바로, 곧’의 뜻으로 쓰이면 거의 항상 금세</text></svg>", "steps": ["‘금세’는 ‘금시에’가 줄어든 말이에요. ‘지금 바로’, ‘곧’이라는 뜻이에요.", "‘금새’는 물건의 값(비싸고 싼 정도)을 뜻하는 다른 말이에요. 요즘 쓸 일이 드물어요.", "그래서 ‘곧, 바로’의 뜻이면 ‘금세’로 쓰면 돼요."], "ex": ["약을 먹었더니 (금세) 나았다.", "눈이 (금세) 녹아 버렸다.", "이 가게는 (금새)가 싸다. → 물건 값이 싸다"], "bad": ["‘금새 나았다’로 씀 (금세)", "‘금새’가 ‘금세’의 다른 표기라고 생각함 (금새는 물건값)"]}, "결제 / 결재": {"short": "돈으로 거래를 끝내면 결제, 윗사람이 서류를 승인하면 결재.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"결제 / 결재\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">결제</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">돈을 치러 거래를 끝냄</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 카드로 결제하다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">결재</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">윗사람이 서류를 검토해</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">승인함</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 부장님께 결재를 받다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">돈 → 결제 / 도장·승인 → 결재</text></svg>", "steps": ["‘결제’는 값을 치러서 거래를 끝내는 거예요. 카드 결제, 대금 결제.", "‘결재’는 윗사람이 문서(안건)를 검토해 허락하는 거예요. 결재 서류, 결재를 올리다.", "돈이 오가면 결제, 도장이나 승인이면 결재로 기억해요."], "ex": ["물건 값을 카드로 (결제)했다.", "기획서를 팀장님께 (결재) 올렸다.", "결재가 나야 결제를 할 수 있다."], "bad": ["‘카드 결재’로 씀 (결제)", "‘결제를 올리다’로 씀 (결재)"]}, "어떡해 / 어떻게": {"short": "뒤에 말이 이어지면 어떻게, ‘어떻게 해’가 줄어 문장이 끝나면 어떡해.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"어떡해 / 어떻게\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">어떻게</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘어떠하게’의 준말,</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">뒤에 서술어가 이어짐</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 어떻게 해야 할까</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">어떡해</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘어떻게 해’의 준말,</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">보통 문장 끝</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 큰일 났네, 어떡해!</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">‘어떻게 해’로 풀어 써도 되면 어떡해</text></svg>", "steps": ["‘어떻게’는 ‘어떠하게’의 준말로, 방법을 묻거나 이어지는 말을 꾸며요. 어떻게 만들었어?", "‘어떡해’는 ‘어떻게 해’가 줄어든 말이에요. 그 자체가 서술어라서 뒤에 동사를 쓰지 않아요.", "‘어떻게 해’로 풀어 써도 말이 되면 ‘어떡해’, 뒤에 동사가 따로 나오면 ‘어떻게’예요."], "ex": ["이 문제를 (어떻게) 풀었니?", "열쇠를 잃어버렸어, (어떡해)! → 어떻게 해", "(어떻게) 해야 할지 모르겠어."], "bad": ["‘어떡게 풀었어’로 씀 (어떻게)", "‘어떻해’로 씀 (어떡해)"]}, "맞히다 / 맞추다": {"short": "정답을 골라내거나 목표에 닿게 하면 맞히다, 둘을 대어 보거나 꼭 맞게 하면 맞추다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"맞히다 / 맞추다\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">맞히다</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">정답을 고르다, 표적에</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">닿게 하다</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 퀴즈 정답을 맞히다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">맞추다</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">서로 대어 보거나 어긋남</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">없게 하다</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 퍼즐을 맞추다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">정답·명중 → 맞히다 / 대 보고 끼우기 → 맞추다</text></svg>", "steps": ["‘맞히다’는 정답을 골라내거나, 화살·공을 목표에 닿게 하는 거예요.", "‘맞추다’는 둘 이상을 서로 대어 보거나 어긋나지 않게 하는 거예요. 퍼즐, 시간, 간을 맞추다.", "답을 확인할 때는 ‘답을 맞추어 보다’라고 써요. (정답지와 대어 봄)"], "ex": ["문제의 정답을 (맞히)었다.", "친구와 시간을 (맞추)어 만났다.", "화살로 과녁을 (맞히)었다."], "bad": ["‘퍼즐을 맞히다’로 씀 (맞추다)", "‘정답을 맞추다’로 씀 (정답을 골라내는 건 맞히다)"]}, "부치다 / 붙이다": {"short": "보내면 부치다, 맞닿아 떨어지지 않게 하면 붙이다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"부치다 / 붙이다\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">부치다</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">편지·물건을 보내다</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(부침개도)</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 편지를 부치다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">붙이다</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">맞닿아 떨어지지 않게</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">하다</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 우표를 붙이다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">보내기 → 부치다 / 이어 붙이기 → 붙이다</text></svg>", "steps": ["‘부치다’는 편지나 물건을 보내는 거예요. 우체국에서 편지를 부치다.", "기름에 지져서 만드는 부침개도 ‘부치다’예요. 전을 부치다.", "‘붙이다’는 맞닿게 하여 떨어지지 않게 하는 거예요. 우표를 붙이다, 풀로 붙이다.", "편지 한 통에는 둘 다 나와요. 우표를 붙여서 편지를 부친다."], "ex": ["소포를 우체국에서 (부치)었다.", "봉투에 우표를 (붙이)었다.", "명절에 전을 (부치)었다."], "bad": ["‘우표를 부치다’로 씀 (붙이다)", "‘편지를 붙이다’로 씀 (부치다)"]}, "-대 / -데": {"short": "남에게 들은 말은 -대(-다고 해), 내가 직접 겪은 일은 -데(-더라).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"-대 / -데\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">-대</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘-다고 해’의 준말,</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">들은 말을 전함</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 철수가 간대</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">-데</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘-더라’, 내가 직접</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">보고 겪은 일</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 그 집 음식이 맛있데</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">들은 말이면 -대 / 내가 본 것이면 -데</text></svg>", "steps": ["‘-대’는 ‘-다고 해’가 줄어든 말이에요. 남에게 들은 말을 전할 때 써요.", "‘-데’는 ‘-더라’처럼 내가 직접 보고 겪은 것을 떠올려 말할 때 써요.", "바꿔 보기: ‘-다고 해’로 풀어 써지면 ‘-대’, ‘-더라’로 바꿔도 되면 ‘-데’예요."], "ex": ["철수가 내일 온(대). → 온다고 해", "어제 가 보니 사람이 많(데). → 많더라", "엄마가 오늘 늦는(대)."], "bad": ["내가 본 것에도 ‘-대’를 씀 (‘-데’)", "‘-다고 해’의 뜻인데 ‘-데’로 씀 (‘-대’)"]}, "낫다 / 낳다": {"short": "병이 없어지거나 더 좋으면 낫다, 아이·새끼·알을 내놓으면 낳다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"낫다 / 낳다\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">낫다</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">병이 없어지다 / 더</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">좋다</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 감기가 다 나았다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">낳다</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">아이·새끼·알을 낳다</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 닭이 알을 낳다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">병·비교 → 낫다 / 출산·알 → 낳다</text></svg>", "steps": ["‘낫다’는 병이나 상처가 없어지는 거예요. 감기가 낫다. 또 ‘더 좋다’는 뜻으로도 써요. 이게 더 낫다.", "‘낫다’는 ㅅ 불규칙이라 ‘낫- + -았-’이 ‘나았-’이 돼요.", "‘낳다’는 아이, 새끼, 알을 몸 밖으로 내놓는 거예요. 낳았다 (ㅎ 받침이 소리 나지 않아도 ‘낳’)."], "ex": ["감기가 (나)아서 학교에 갔다.", "고양이가 새끼를 (낳)았다.", "이 방법이 저 방법보다 (낫)다."], "bad": ["‘감기가 낳았다’로 씀 (나았다)", "‘알을 낫다’로 씀 (낳다)"]}, "으로서 / 으로써": {"short": "자격·지위는 으로서, 수단·도구·재료는 으로써.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"으로서 / 으로써\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">으로서</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">자격·지위·신분</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 학생으로서 최선을</text><text x=\"82\" y=\"119\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">다하다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">으로써</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">수단·도구·방법·재료</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 대화로써 문제를 풀다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">‘~의 자격으로’ → 서 / ‘~을 가지고’ → 써</text></svg>", "steps": ["‘으로서’는 어떤 지위나 자격을 나타내요. 선생님으로서, 학생으로서.", "‘으로써’는 무엇을 가지고 하는지, 수단이나 도구, 재료를 나타내요. 칼로써, 대화로써.", "바꿔 보기: ‘~의 자격으로’가 자연스러우면 ‘서’, ‘~을 가지고’가 자연스러우면 ‘써’예요."], "ex": ["나는 반장(으로서) 책임을 다했다.", "웃음(으로써) 분위기를 풀었다.", "친구(로서) 조언을 했다."], "bad": ["‘학생으로써’로 씀 (자격이라 으로서)", "‘대화로서 해결’로 씀 (수단이라 으로써)"]}, "반드시 / 반듯이": {"short": "틀림없이 꼭은 반드시, 비뚤어지지 않고 바르면 반듯이.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"반드시 / 반듯이\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">반드시</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">틀림없이 꼭 (부사)</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 내일 반드시 갈게</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">반듯이</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">비뚤어지지 않고 바르게</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 허리를 반듯이 펴다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">‘꼭’으로 바꾸면 반드시 / ‘바르게’로 바꾸면</text><text x=\"160\" y=\"168\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">반듯이</text></svg>", "steps": ["‘반드시’는 ‘틀림없이 꼭’이라는 뜻의 부사예요. 약속, 규칙을 말할 때 많이 써요.", "‘반듯이’는 ‘반듯하다(바르다)’에서 나온 말이에요. 비뚤어지지 않고 바르게라는 뜻이에요.", "‘꼭’으로 바꿔 자연스러우면 반드시, ‘바르게’로 바꿔 자연스러우면 반듯이예요."], "ex": ["내일 (반드시) 숙제를 내겠다. → 꼭", "의자에 (반듯이) 앉아라. → 바르게", "(반드시) 지켜야 하는 규칙"], "bad": ["‘반듯이 지켜야 한다’로 씀 (반드시)", "‘반드시 앉아라’로 씀 (바르게 앉으라는 뜻이면 반듯이)"]}, "-든지 / -던지": {"short": "고를 수 있으면 -든지(선택), 지난 일을 떠올리면 -던지(회상).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"-든지 / -던지\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">-든지</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">여럿 중 무엇을 골라도</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">됨 (선택)</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 가든지 말든지 마음대로</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">-던지</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">지난 일을 떠올림</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(회상)</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 얼마나 춥던지 떨었다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">고르기 → -든지 / 떠올리기 → -던지</text></svg>", "steps": ["‘-든지’는 여럿 중에서 어느 것을 골라도 상관없다는 뜻이에요. 사과든지 배든지.", "‘-던지’는 지난 일을 떠올려 말할 때 써요. 얼마나 춥던지 손이 곱았다.", "‘-든지’는 ‘-거나’로 바꿀 수 있어요. 가든지 말든지 → 가거나 말거나."], "ex": ["먹고 싶은 걸 (먹든지) 말든지 마음대로 해.", "그날 얼마나 (춥던지) 손이 떨렸다.", "물을 (마시든지) 주스를 (마시든지) 골라."], "bad": ["회상인데 ‘-든지’로 씀 (얼마나 춥든지 ✗)", "선택인데 ‘-던지’로 씀 (가던지 말던지 ✗)"]}, "이따가 / 있다가": {"short": "조금 뒤는 이따가, 어디에 머물다가는 있다가.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"이따가 / 있다가\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">이따가</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">조금 지난 뒤에 (시간)</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 이따가 만나자</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">있다가</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">머물다가 (‘있다’ +</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘-다가’)</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 집에 있다가 나갔다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">‘조금 뒤에’ → 이따가 / ‘있었다가’로 통하면</text><text x=\"160\" y=\"168\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">있다가</text></svg>", "steps": ["‘이따가’는 ‘조금 지나서’라는 시간의 뜻이에요. 이따가 전화할게.", "‘있다가’는 ‘있다’에 ‘-다가’가 붙은 말이에요. 어디에 머물렀다가 다른 일을 한다는 뜻이에요.", "‘있다가’는 ‘있었다가’로 바꿔도 말이 되고, ‘이따가’는 안 돼요.", "‘조금 있다가’처럼 ‘시간이 지나서’라는 뜻의 ‘있다가’도 맞아요. 앞에 ‘조금·잠깐’ 없이 혼자 쓰이면 ‘이따가’예요."], "ex": ["(이따가) 학교 앞에서 만나자.", "집에 (있다가) 친구 전화를 받고 나갔다.", "(이따가) 다시 올게."], "bad": ["‘있다가 만나자’로 씀 (시간이 지난 뒤라 이따가)", "‘이따가 비가 와서’로 씀 (머무는 동작이라 있다가)"]}, "다르다 / 틀리다": {"short": "서로 같지 않으면 다르다, 셈이나 사실이 맞지 않으면 틀리다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"다르다 / 틀리다\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">다르다</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">서로 같지 않다</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 나와 동생은 성격이</text><text x=\"82\" y=\"119\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">다르다</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">틀리다</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">셈·사실이 옳지 않다</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 답이 틀렸다</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">같지 않음 → 다르다 / 옳지 않음 → 틀리다</text></svg>", "steps": ["‘다르다’는 둘이 같지 않다는 뜻이에요. 정답이 있는 게 아니라 서로 다른 거예요.", "‘틀리다’는 정답, 셈, 사실이 옳지 않다는 뜻이에요. 문제를 틀렸다.", "‘같다’의 반대는 ‘다르다’, ‘맞다’의 반대는 ‘틀리다’예요."], "ex": ["내 의견은 친구와 (다르)다.", "이 문제의 답이 (틀리)었다.", "쌍둥이도 성격은 (다르)다."], "bad": ["‘나는 너와 틀려’로 씀 (달라)", "‘답이 달라’를 오답이라는 뜻으로 씀 (틀려)"]}, "-ㄹ게 / -ㄹ께": {"short": "약속·의지는 [께]로 소리 나도 -ㄹ게. 물음을 나타내는 -ㄹ까·-ㄹ꼬·-ㅂ니까 등은 된소리로 적는다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"-ㄹ게 / -ㄹ께\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">-ㄹ게</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">약속·의지 (소리는</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">[께])</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 내일 갈게</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">-ㄹ까</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">묻는 말 (된소리로</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">적음)</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 내일 갈까?</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">약속 → -ㄹ게 / 물음 → -ㄹ까 · -ㄹ꼬</text></svg>", "steps": ["약속이나 의지를 나타내는 어미는 [께]로 소리 나도 ‘-ㄹ게’로 적어요.", "의문을 나타내는 ‘-ㄹ까, -ㄹ꼬’ 같은 어미는 된소리로 적어요.", "그래서 ‘갈게’(약속)와 ‘갈까’(물음)를 구별해요. ‘갈께’는 틀린 표기예요."], "ex": ["내일 (갈게). 기다려.", "우리 같이 (갈까)?", "내가 먼저 (할게)."], "bad": ["‘할께’로 씀 (할게)", "물음에 ‘갈께?’로 씀 (갈까?)"]}, "며칠": {"short": "날짜를 묻는 말은 ‘며칠’ 하나의 낱말. ‘몇 일’로 쪼개 쓰지 않는다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"며칠\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">며칠</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">날짜 또는 몇 날 (한</text><text x=\"82\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">낱말)</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 오늘이 며칠이야?</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">몇 월 · 몇 년</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘몇’ 뒤에 단위를 띄어</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">씀</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 몇 년 몇 월에</text><text x=\"238\" y=\"119\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">태어났니?</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">날짜 → 며칠 (한 낱말) / 월·년·시는 몇 +</text><text x=\"160\" y=\"168\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">단위</text></svg>", "steps": ["‘며칠’은 ‘몇 + 일’이 아니라 하나로 굳은 낱말이에요. 날짜를 묻거나 며칠 동안이라는 뜻이에요.", "‘몇 월, 몇 년, 몇 시’는 ‘몇’ 뒤에 단위가 와서 띄어 써요.", "‘몇일’은 표준어가 아니에요. 항상 ‘며칠’로 써요."], "ex": ["오늘이 (며칠)이니?", "여행은 (며칠) 동안 갈 거야?", "내 생일은 몇 월 (며칠)이야."], "bad": ["‘몇 일’로 씀 (며칠)", "‘몇월’, ‘몇년’으로 붙여 씀 (몇 월, 몇 년)"]}, "과거형 받침 ‘ㅆ’": {"short": "지난 일은 ‘-았-/-었-/-였-’을 붙이고, 합치면 받침 ‘ㅆ’이 된다 (갔다, 했다).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"과거형 받침 ‘ㅆ’\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">어간 + 과거 어미 → 합치면 받침 ㅆ</text><rect x=\"24\" y=\"28\" width=\"60\" height=\"32\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"54\" y=\"50\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">가</text><text x=\"98\" y=\"50\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">+</text><rect x=\"112\" y=\"28\" width=\"60\" height=\"32\" rx=\"5\" fill=\"#fde8e8\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"142\" y=\"50\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">-았-</text><line x1=\"178\" y1=\"44\" x2=\"206\" y2=\"44\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M199.7,47.0 L206,44 L199.7,41.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"212\" y=\"28\" width=\"84\" height=\"32\" rx=\"5\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.8\"/><text x=\"254\" y=\"50\" font-size=\"17\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">갔다</text><rect x=\"24\" y=\"72\" width=\"60\" height=\"32\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"54\" y=\"94\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">먹</text><text x=\"98\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">+</text><rect x=\"112\" y=\"72\" width=\"60\" height=\"32\" rx=\"5\" fill=\"#fde8e8\" stroke=\"#2e7d32\" stroke-width=\"1.8\"/><text x=\"142\" y=\"94\" font-size=\"16\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">-었-</text><line x1=\"178\" y1=\"88\" x2=\"206\" y2=\"88\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M199.7,91.0 L206,88 L199.7,85.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"212\" y=\"72\" width=\"84\" height=\"32\" rx=\"5\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.8\"/><text x=\"254\" y=\"94\" font-size=\"17\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">먹었다</text><rect x=\"24\" y=\"116\" width=\"60\" height=\"32\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"54\" y=\"138\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">하</text><text x=\"98\" y=\"138\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">+</text><rect x=\"112\" y=\"116\" width=\"60\" height=\"32\" rx=\"5\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"142\" y=\"138\" font-size=\"16\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">-였-</text><line x1=\"178\" y1=\"132\" x2=\"206\" y2=\"132\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M199.7,135.0 L206,132 L199.7,129.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"212\" y=\"116\" width=\"84\" height=\"32\" rx=\"5\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.8\"/><text x=\"254\" y=\"138\" font-size=\"17\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">했다</text><text x=\"160\" y=\"172\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">소리가 [갇따]처럼 나도 글자는 ‘갔다’로 적어요</text></svg>", "steps": ["지난 일을 말할 때는 어간 뒤에 과거를 나타내는 ‘-았-, -었-, -였-’을 붙여요.", "어간의 끝 모음이 ㅏ, ㅗ이면 ‘-았-’, 그 밖이면 ‘-었-’, ‘하-’ 뒤에는 ‘-였-’이 와요(하 + 였 → 했).", "합치면 모음이 줄거나 합쳐지고 받침 ‘ㅆ’이 생겨요. 가 + 았다 → 갔다.", "소리는 [갇따]처럼 나도 글자는 원래 형태대로 ‘ㅆ’을 적어요. 받침이 ㅆ인 ‘있다’도 과거형은 ‘있었다’예요."], "ex": ["가 + 았다 → 갔다", "먹 + 었다 → 먹었다", "하 + 였다 → 했다"], "bad": ["‘갓다’, ‘먹엇다’처럼 ㅅ만 씀 (ㅆ)", "소리 나는 대로 ‘갇따’로 씀 (갔다)"]}, "반의어": {"short": "한 가지 기준에서 뜻이 반대이고, 나머지는 같은 범주의 말이다 (덥다 ↔ 춥다).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"반의어\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">한 가지 기준만 반대, 나머지는 같은 범주</text><rect x=\"30\" y=\"28\" width=\"76\" height=\"30\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"68\" y=\"49\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">크다</text><text x=\"160\" y=\"49\" font-size=\"20\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">↔</text><rect x=\"214\" y=\"28\" width=\"76\" height=\"30\" rx=\"5\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"252\" y=\"49\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">작다</text><text x=\"160\" y=\"36\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">크기</text><rect x=\"30\" y=\"68\" width=\"76\" height=\"30\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"68\" y=\"89\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">열다</text><text x=\"160\" y=\"89\" font-size=\"20\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">↔</text><rect x=\"214\" y=\"68\" width=\"76\" height=\"30\" rx=\"5\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"252\" y=\"89\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">닫다</text><text x=\"160\" y=\"76\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">여닫는 동작</text><rect x=\"30\" y=\"108\" width=\"76\" height=\"30\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"68\" y=\"129\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">덥다</text><text x=\"160\" y=\"129\" font-size=\"20\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">↔</text><rect x=\"214\" y=\"108\" width=\"76\" height=\"30\" rx=\"5\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"252\" y=\"129\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">춥다</text><text x=\"160\" y=\"116\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">기온</text><rect x=\"24\" y=\"148\" width=\"272\" height=\"26\" rx=\"5\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"166\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">덥다 ↔ 시원하다? 시원하다는 ‘기분’이라 엄밀히는 달라요</text></svg>", "steps": ["반의어는 뜻이 서로 맞서는 낱말이에요. 크다 ↔ 작다, 열다 ↔ 닫다.", "아무 말이나 반대가 되는 건 아니에요. 같은 범주(크기, 기온, 방향 …) 안에서 한 가지 기준만 반대여야 해요.", "덥다의 반의어는 춥다(둘 다 기온)예요. 시원하다는 기준이 달라서 반의어가 아니에요.", "문제에서는 ‘어떤 기준으로 반대인지’를 먼저 찾으면 쉬워요."], "ex": ["크다 ↔ 작다 (크기)", "열다 ↔ 닫다 (여닫는 동작)", "오르다 ↔ 내리다 (위아래 방향)"], "bad": ["뜻이 다르기만 하면 반의어라고 함 (사과 ↔ 배는 같은 범주지만 맞서는 기준이 하나로 정해지지 않아 반의어가 아님)", "두껍다 ↔ 가늘다로 짝지음 (두껍다 ↔ 얇다, 굵다 ↔ 가늘다)"]}, "흉내 내는 말·감각 표현": {"short": "소리를 흉내 내면 의성어, 모양을 흉내 내면 의태어.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"흉내 내는 말·감각 표현\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"8\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"82\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">의성어</text><text x=\"82\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">소리를 흉내 낸 말</text><rect x=\"14\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"82\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 멍멍 · 꽥꽥 · 쿵쿵</text><rect x=\"164\" y=\"10\" width=\"148\" height=\"122\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"164\" y=\"10\" width=\"148\" height=\"32\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"238\" y=\"33\" font-size=\"17\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">의태어</text><text x=\"238\" y=\"58\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">모양·움직임을 흉내 낸</text><text x=\"238\" y=\"72\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">말</text><rect x=\"170\" y=\"92\" width=\"136\" height=\"34\" rx=\"4\" fill=\"#fff4cc\" stroke=\"none\" stroke-width=\"0\"/><text x=\"238\" y=\"106\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) 반짝반짝 · 엉금엉금</text><rect x=\"8\" y=\"140\" width=\"304\" height=\"34\" rx=\"6\" fill=\"#f1f3f6\" stroke=\"#9aa0a8\" stroke-width=\"1.2\"/><text x=\"160\" y=\"154\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">귀로 들리면 의성어 / 눈으로 보이면 의태어</text></svg>", "steps": ["흉내 내는 말은 소리나 모양을 그대로 따라 한 낱말이에요. 말의 느낌을 생생하게 해 줘요.", "소리를 흉내 내면 의성어예요. 멍멍(개), 꽥꽥(오리), 쾅쾅(문).", "모양이나 움직임을 흉내 내면 의태어예요. 반짝반짝(빛), 엉금엉금(느린 걸음), 아장아장(아기 걸음).", "소리를 흉내 냈는지, 모양을 흉내 냈는지 먼저 보세요."], "ex": ["멍멍 → 개 짖는 소리 (의성어)", "반짝반짝 → 별빛이 빛나는 모양 (의태어)", "엉금엉금 → 거북이 기는 모양 (의태어)"], "bad": ["의태어를 소리를 흉내 낸 말이라고 함 (‘반짝반짝’은 모양)", "‘펑펑 눈이 내린다’의 ‘펑펑’을 소리라고만 봄 (눈 오는 모양을 나타내는 의태어)"]}, "음운 변동": {"short": "글자와 소리가 달라지는 규칙. 소리가 바뀌면 교체, 없어지면 탈락, 생기면 첨가, 합쳐지면 축약.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"음운 변동\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"40\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"28.0\" y=\"26.32\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">갈래</text><rect x=\"48\" y=\"10\" width=\"126\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"111.0\" y=\"26.32\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">대표 변동</text><rect x=\"174\" y=\"10\" width=\"138\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"243.0\" y=\"26.32\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">보기</text><rect x=\"8\" y=\"34\" width=\"40\" height=\"35.0\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"28.0\" y=\"50.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">교체</text><rect x=\"48\" y=\"34\" width=\"126\" height=\"35.0\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"111.0\" y=\"50.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">비음화·유음화·구개음화·</text><text x=\"111.0\" y=\"64.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">된소리되기</text><rect x=\"174\" y=\"34\" width=\"138\" height=\"35.0\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"243.0\" y=\"50.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">국물→[궁물]</text><text x=\"243.0\" y=\"64.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">굳이→[구지]</text><rect x=\"8\" y=\"69.0\" width=\"40\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"28.0\" y=\"85.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">탈락</text><rect x=\"48\" y=\"69.0\" width=\"126\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"111.0\" y=\"85.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">자음군 단순화</text><rect x=\"174\" y=\"69.0\" width=\"138\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"243.0\" y=\"85.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">닭→[닥] 값→[갑]</text><rect x=\"8\" y=\"90.5\" width=\"40\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"28.0\" y=\"107.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">첨가</text><rect x=\"48\" y=\"90.5\" width=\"126\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"111.0\" y=\"107.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">ㄴ 첨가</text><rect x=\"174\" y=\"90.5\" width=\"138\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"243.0\" y=\"107.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">솜이불→[솜니불]</text><rect x=\"8\" y=\"112.0\" width=\"40\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"28.0\" y=\"128.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">축약</text><rect x=\"48\" y=\"112.0\" width=\"126\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"111.0\" y=\"128.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">거센소리되기</text><rect x=\"174\" y=\"112.0\" width=\"138\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"243.0\" y=\"128.8\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">좋고→[조코]</text></svg>", "steps": ["글자 그대로 읽지 않고 소리가 달라지는 것이 음운 변동이에요. 먼저 ‘글자’와 ‘소리’를 나란히 써 봐요.", "소리가 다른 소리로 바뀌면 교체예요. 국물 → [궁물](비음화), 신라 → [실라](유음화), 굳이 → [구지](구개음화).", "소리 하나가 사라지면 탈락(닭 → [닥]), 없던 소리가 생기면 첨가(솜이불 → [솜니불]), 두 소리가 하나로 합쳐지면 축약(좋고 → [조코])이에요.", "어떤 소리가 무엇으로 바뀌었는지 비교하면 이름이 나와요."], "ex": ["국물 → [궁물]: ㅁ 앞에서 ㄱ이 ㅇ으로 바뀜 → 교체(비음화)", "닭 → [닥]: 겹받침 ㄹㄱ 중 ㄹ이 사라짐 → 탈락", "좋고 → [조코]: ㅎ + ㄱ → ㅋ 하나로 합쳐짐 → 축약"], "bad": ["‘굳이’를 [구디]로 읽음 (구개음화로 [구지])", "‘솜이불’을 [소미불]로 읽음 (ㄴ 첨가로 [솜니불])"]}, "한글의 짜임": {"short": "글자는 첫소리(자음) + 가운뎃소리(모음) + 받침(자음)으로 만든다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"한글의 짜임\" class=\"nsvg\"><rect x=\"24\" y=\"18\" width=\"96\" height=\"96\" rx=\"0\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"24\" y1=\"66\" x2=\"120\" y2=\"66\" stroke=\"#333\" stroke-width=\"1.2\" stroke-dasharray=\"3\"/><line x1=\"72\" y1=\"18\" x2=\"72\" y2=\"66\" stroke=\"#333\" stroke-width=\"1.2\" stroke-dasharray=\"3\"/><text x=\"48\" y=\"52\" font-size=\"26\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">ㅂ</text><text x=\"96\" y=\"52\" font-size=\"26\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">ㅏ</text><text x=\"72\" y=\"100\" font-size=\"26\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">ㅁ</text><text x=\"72\" y=\"134\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">밤 = ㅂ + ㅏ + ㅁ</text><text x=\"140\" y=\"40\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">첫소리 (자음)</text><text x=\"140\" y=\"62\" font-size=\"12\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">가운뎃소리 (모음)</text><text x=\"140\" y=\"84\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">받침 (맨 아래 자음)</text><text x=\"140\" y=\"104\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">자음 14개</text><text x=\"140\" y=\"118\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ</text><text x=\"140\" y=\"136\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">받침이 없으면 ‘가’처럼 두 조각</text><text x=\"160\" y=\"166\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">모음 순서: ㅏ ㅑ ㅓ ㅕ ㅗ ㅛ ㅜ ㅠ ㅡ ㅣ</text></svg>", "steps": ["한글 글자 하나는 소리 조각을 모아 만들어요. 자음(ㄱ, ㄴ …)과 모음(ㅏ, ㅑ …)이 기본이에요.", "첫소리는 자음, 가운뎃소리는 모음이에요. ‘가’ = ㄱ + ㅏ.", "글자 맨 아래에 자음이 하나 더 붙으면 그게 받침이에요. ‘밤’ = ㅂ + ㅏ + ㅁ(받침).", "발음하는 동안 입 모양이 바뀌는 ㅑ, ㅘ 같은 모음은 이중 모음이에요."], "ex": ["‘밤’ = ㅂ(첫소리) + ㅏ(가운뎃소리) + ㅁ(받침)", "‘가’ = ㄱ + ㅏ (받침 없음)", "‘공’ = ㄱ + ㅗ + ㅇ(받침)"], "bad": ["받침을 첫소리로 읽음", "‘ㅑ’를 자음이라고 함 (모음)"]}, "낱말의 묶음 (상위어·하위어)": {"short": "넓은 말(상위어) 아래에 구체적인 말(하위어)이 들어간다 (과일 ⊃ 사과).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"낱말의 묶음 (상위어·하위어)\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">묶음 이름(위) ⊃ 포함되는 낱말(아래)</text><rect x=\"42\" y=\"26\" width=\"70\" height=\"28\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"77\" y=\"46\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">과일</t -anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">‘이름이 아닌 것’을 찾을 땐 어느 묶음인지 먼저 정해요</text></svg>", "steps": ["낱말은 크기가 달라요. ‘과일’처럼 여러 말을 묶는 넓은 말이 상위어예요.", "‘사과, 배, 포도’처럼 그 안에 들어가는 구체적인 말이 하위어예요.", "문제가 ‘하나만 다른 것’을 고르라고 하면, 낱말들이 어느 묶음에 드는지 따져서 다른 묶음의 말을 찾아요.", "묶음 이름을 먼저 정하면 쉬워요. 사과, 배, 당근, 포도 → 당근만 채소."], "ex": ["과일: 사과, 배, 포도 / 채소: 당근, 오이", "동물(상위어) ⊃ 강아지(하위어)", "학용품: 연필, 지우개, 자"], "bad": ["상위어와 하위어를 거꾸로 말함 (사과가 상위어 ✗)", "묶음을 정하지 않고 모양이 비슷한 말끼리 묶음"]}, "세는 말 (단위)": {"short": "물건 종류마다 세는 말이 정해져 있다 (연필 자루, 신발 켤레, 책 권, 나무 그루).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"세는 말 (단위)\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">물건마다 세는 말이 달라요</text><rect x=\"10\" y=\"28\" width=\"70\" height=\"60\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><text x=\"45\" y=\"52\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">연필</text><text x=\"45\" y=\"76\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">한 자루</text><rect x=\"87\" y=\"28\" width=\"70\" height=\"60\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.6\"/><text x=\"122\" y=\"52\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">신발·양말</text><text x=\"122\" y=\"76\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">한 켤레</text><rect x=\"164\" y=\"28\" width=\"70\" height=\"60\" rx=\"6\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><text x=\"199\" y=\"52\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">책</text><text x=\"199\" y=\"76\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">한 권</text><rect x=\"241\" y=\"28\" width=\"70\" height=\"60\" rx=\"6\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.6\"/><text x=\"276\" y=\"52\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"nor " stroke-width=\"1\"/><text x=\"36.0\" y=\"107.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">상대 높임</text><rect x=\"64\" y=\"90.5\" width=\"70\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"99.0\" y=\"107.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">듣는 사람</text><rect x=\"134\" y=\"90.5\" width=\"82\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"175.0\" y=\"107.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">-습니다, -요</text><rect x=\"216\" y=\"90.5\" width=\"96\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"264.0\" y=\"107.3\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">밥 먹었어요</text><text x=\"160\" y=\"134.0\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">특수 어휘: 밥→진지, 집→댁, 나이→연세, 있다→계시다</text></svg>", "steps": ["높임법은 누구를 높이느냐에 따라 세 가지예요.", "주체 높임은 문장의 주어를 높여요. ‘-시-’나 ‘께서’를 써요. 할머니께서 오신다.", "객체 높임은 행동을 받는 사람을 높여요. ‘께’, ‘드리다, 여쭙다, 모시다’를 써요. 할머니께 선물을 드렸다.", "상대 높임은 듣는 사람을 높여요. ‘-습니다, -요’를 써요. 높일 때는 ‘밥 → 진지, 집 → 댁’처럼 특수한 말을 쓰기도 해요."], "ex": ["할머니께서 진지를 드신다. → 주체 높임 + 특수 어휘", "나는 할머니께 책을 드렸다. → 객체 높임", "선생님, 다녀왔습니다. → 상대 높임"], "bad": ["자기 자신을 높임 (나는 밥을 먹으셨다)", "주어와 받는 사람을 헷갈림 (누구를 높이는지 먼저 확인)"]}, "소리와 다른 표기": {"short": "소리 나는 대로가 아니라 뜻을 알아보기 쉽게 원래 형태를 살려 적는다 (꽃이).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"소리와 다른 표기\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"64\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"40.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">소리</text><rect x=\"72\" y=\"10\" width=\"84\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"114.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"
