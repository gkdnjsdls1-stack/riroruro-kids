36\" rx=\"8\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"2.2\"/><text x=\"160\" y=\"43\" font-size=\"20\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">배</text><line x1=\"160\" y1=\"54\" x2=\"56\" y2=\"86\" stroke=\"#c62828\" stroke-width=\"1.8\"/><rect x=\"8\" y=\"86\" width=\"96\" height=\"66\" rx=\"6\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"56\" y=\"106\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">몸</text><text x=\"56\" y=\"126\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">배가 아프다</text><line x1=\"160\" y1=\"54\" x2=\"160\" y2=\"86\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><rect x=\"112\" y=\"86\" width=\"96\" height=\"66\" rx=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"106\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">탈것</text><text x=\"160\" y=\"126\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">배를 탔다</text><line x1=\"160\" y1=\"54\" x2=\"264\" y2=\"86\" stroke=\"#2e7d32\" stroke-width=\"1.8\"/><rect x=\"216\" y=\"86\" width=\"96\" height=\"66\" rx=\"6\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"264\" y=\"106\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">과일</text><text x=\"264\" y=\"126\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">배를 먹었다</text><text x=\"160\" y=\"172\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">소리는 같고 뜻이 달라요. 앞뒤 말을 보고 뜻을 골라요</text></svg>", "steps": ["소리와 글자가 같은데 뜻이 서로 다른 낱말이 동음이의어예요.", "‘배’는 몸의 배, 타는 배, 먹는 배처럼 뜻이 여러 개예요. 뜻이 서로 이어져 있지 않아요.", "문장 속의 앞뒤 말을 보면 뜻이 정해져요. ‘배가 아프다’의 ‘배’는 몸이에요.", "국어사전에는 동음이의어가 각각 다른 낱말로 올라 있어요."], "ex": ["배가 아프다 → 몸", "배를 타고 섬에 갔다 → 탈것", "배를 깎아 먹었다 → 과일"], "bad": ["‘눈이 아프다’와 ‘눈이 온다’를 같은 뜻으로 봄", "한 낱말의 여러 뜻(다의어)과 구별하지 못함"]}, "기본형과 국어사전": {"short": "모양이 바뀌는 말은 어간에 ‘-다’를 붙인 기본형으로 사전에서 찾는다.", "s oke-width=\"1.2\"/><text x=\"160\" y=\"138\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">사전 순서: 첫 자음 → 모음 → 받침</text><text x=\"160\" y=\"158\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">ㄱ ㄴ ㄷ … / ㅏ ㅐ ㅑ … / 받침 없음 → 있음</text></svg>", "steps": ["동사와 형용사는 먹고, 먹으니, 먹었다처럼 끝이 바뀌어요.", "사전에는 바뀌기 전의 대표 모양이 올라 있어요. 어간 ‘먹-’에 ‘-다’를 붙인 ‘먹다’(기본형)예요.", "그래서 먹었다, 먹고, 먹으니 → ‘먹다’로 찾아요.", "사전 순서는 첫 자음 → 모음 → 받침 순서예요. 받침이 없는 글자가 먼저 나와요."], "ex": ["공원까지 걸어서 갔다 → 걷다 (ㄷ 불규칙: 걷- → 걸-)", "‘고래’와 ‘기차’ 중 사전에 먼저 → 첫 자음이 같으니 모음 ㅗ가 ㅣ보다 앞 → 고래", "예뻤다 → 예쁘- + -었다 → 기본형 예쁘다"], "bad": ["활용한 모양 그대로 사전에서 찾음", "‘-다’를 붙이지 않고 어간만 씀 (먹 ✗, 먹다 ✓)"]}, "속담과 관용 표현": {"short": "낱말 뜻을 그대로 더한 게 아니라 굳어진 ‘비유적인 뜻’으로 쓰이는 말이다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"속담과 관용 표현\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"110\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"63.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">표현</text><rect x=\"118\" y=\"10\" width=\"134\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"185.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">숨은 뜻</text><rect x=\"252\" y=\"10\" width=\"60\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"282.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">갈래</text><rect x=\"8\" y=\"34\" width=\"110\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"63.0\" y=\"50.8\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">입이 무겁다</text><rect x=\"118\" y=\"34\" width=\"134\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"185.0\" y=\"50.8\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" fon 으면 안 돼요. 굳어진 비유적인 뜻이 따로 있어요.", "관용어는 낱말 둘 이상이 굳어 새 뜻을 가진 말이에요. ‘입이 무겁다’는 입의 무게가 아니라 ‘비밀을 잘 지킨다’예요.", "속담은 오래 전해 오는 교훈이나 지혜를 담은 짧은 말이에요. ‘가는 말이 고와야 오는 말이 곱다’.", "어떤 상황에서 쓰는 말인지 떠올려 뜻을 고르면 돼요."], "ex": ["발이 넓다 → 아는 사람이 많다", "가는 말이 고와야 오는 말이 곱다 → 내가 남에게 잘해야 남도 나에게 잘한다", "세 살 버릇 여든까지 간다 → 어릴 때의 버릇은 늙어서도 고치기 어렵다"], "bad": ["발이 크다는 뜻으로 읽음 (낱말 뜻 그대로)", "속담의 일부 낱말만 보고 뜻을 정함"]}, "문장의 종류": {"short": "설명(평서문), 물음(의문문), 시킴(명령문), 함께 하자(청유문), 느낌(감탄문).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"문장의 종류\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"62\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"39.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">종류</text><rect x=\"70\" y=\"10\" width=\"128\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"134.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">뜻</text><rect x=\"198\" y=\"10\" width=\"114\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"255.0\" y=\"26.32\" font-size=\"11.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">예</text><rect x=\"8\" y=\"34\" width=\"62\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"39.0\" y=\"50.8\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">평서문</text><rect x=\"70\" y=\"34\" width=\"128\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"134.0\" y=\"50.8\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">사실을 설명함</text><rect x=\"198\" y=\"34\" width=\"114\" height=\"21.5\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"255.0\" y=\"50.8\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">비가 온다.</text><rect x=\"8\" y=\"55.5\" width=\"62\" height=\"21.5 지 확인하지 않고 모양만 보고 판단함"]}, "설명·논증 방법": {"short": "정의·분류·예시·비교·대조·분석은 설명 방법, 귀납(사례→결론)·연역(원리→결론)은 논증 방법.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"설명·논증 방법\" class=\"nsvg\"><rect x=\"8\" y=\"10\" width=\"50\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"33.0\" y=\"26.32\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">방법</text><rect x=\"58\" y=\"10\" width=\"100\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"108.0\" y=\"26.32\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">뜻</text><rect x=\"158\" y=\"10\" width=\"154\" height=\"24\" rx=\"0\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"235.0\" y=\"26.32\" font-size=\"10.0\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">예</text><rect x=\"8\" y=\"34\" width=\"50\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"33.0\" y=\"49.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">정의</text><rect x=\"58\" y=\"34\" width=\"100\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"108.0\" y=\"49.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">A는 B이다</text><rect x=\"158\" y=\"34\" width=\"154\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"235.0\" y=\"49.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">시는 정서를 표현한 글이다</text><rect x=\"8\" y=\"54\" width=\"50\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"33.0\" y=\"69.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">분류</text><rect x=\"58\" y=\"54\" width=\"100\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"108.0\" y=\"69.6\" font-size=\"9.5\" tex \" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"108.0\" y=\"129.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">사례 → 일반 결론</text><rect x=\"158\" y=\"114\" width=\"154\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"235.0\" y=\"129.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">까마귀 셋이 검다→모두 검다</text><rect x=\"8\" y=\"134\" width=\"50\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"33.0\" y=\"149.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">연역</text><rect x=\"58\" y=\"134\" width=\"100\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"108.0\" y=\"149.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">원리 → 구체 결론</text><rect x=\"158\" y=\"134\" width=\"154\" height=\"20\" rx=\"0\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"235.0\" y=\"149.6\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">사람은 죽는다→그도 죽는다</text></svg>", "steps": ["설명 방법은 대상을 쉽게 알려 주는 방법이에요. 정의(A는 B이다), 분류(기준에 따라 묶음), 예시(예를 듦), 비교·대조(같은 점·다른 점), 분석(부분으로 나눔)이 있어요.", "논증 방법은 주장이 옳다는 걸 보이는 방법이에요.", "귀납은 여러 사례에서 일반적인 결론을 이끌어 내요. 까마귀 몇 마리가 검다 → 까마귀는 검다.", "연역은 일반 원리에서 구체적인 결론을 이끌어 내요. 사람은 죽는다, 소크라테스는 사람이다 → 소크라테스는 죽는다."], "ex": ["‘개, 고양이는 포유류다’ → 분류", "‘시는 정서를 표현한 글이다’ → 정의", "사과도 익으면 떨어지고, 감도 익으면 떨어진다 → 열매는 익으면 떨어진다 (귀납)"], "bad": ["귀납과 연역을 거꾸로 설명함", "비교와 대조를 같은 말로 씀 (비교는 같은 점, 대조는 다른 점)"]}, "소설의 구성 단계": {"short": "발단(시작) → 전개(갈등 시작) → 위기(갈등 커짐) → 절정(갈등 최고) → 결말(해결).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"소설의 구성 단계\" class=\"nsvg\"><line x1=\"14\" y1=\"146\" x2=\"306\" y2=\"146\" stroke=\"#333\" stroke-width=\"1.2\"/><path d=\"M34,128 L98,108 L164,72 L226,26 L288,110\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"3\" stroke-linejoin=\"round\"/><circle cx=\"34\" cy=\"128\" r=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2.2\"/><text x=\"34\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">발단</text><text x=\"34\" y=\"174\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">소개</text><circle cx=\"98\" cy=\"108\" r=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2.2\"/><text x=\"98\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">전개</text><text x=\"98\" y=\"174\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">갈등 시작</text><circle cx=\"164\" cy=\"72\" r=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2.2\"/><text x=\"164\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">위기</text><text x=\"164\" y=\"174\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">갈등 커짐</text><circle cx=\"226\" cy=\"26\" r=\"6\" fill=\"#c62828\" stroke=\"#c62828\" stroke-width=\"2.2\"/><text x=\"226\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">절정</text><text x=\"226\" y=\"174\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">갈등 최고</text><circle cx=\"288\" cy=\"110\" r=\"6\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2.2\"/><text x=\"288\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">결말</text><text x=\"288\" y=\"174\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">해결</text><text x=\"160\" y=\"12\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">갈등의 높이</text></svg>", "steps": ["소설은 사건이 갈등을 따라 올라갔다 내려가는 흐름으로 짜여 있어요. 모두 다섯 단계예요.", "발단은 인물·배경을 소개하고 사건이 시작돼요. 전개는 갈등이 생기고 깊어져요.", "위기는 갈등이 높아지고 반전의 조짐이 보여요. 절정은 갈등이 가장 높고 긴장이 최고인 곳이에요.", "결말은 갈등이 풀리고 이야기가 마무리돼요."], "ex": ["주인공과 배경을 소개하는 장면 → 발단", "갈등이 가장 팽팽한 장면 → 절정", "갈등이 풀리고 끝나는 장면 → 결말"], "bad": ["위기와 절정을 바 let NOTESEL=null;

function noteHtml(name){
  const n=NOTES[name]; if(!n) return "";
  return `<div class="nbook"><div class="n-sum"><b>${esc(name)}</b><span>${esc(n.short)}</span></div>
  <div class="n-fig">${n.svg}</div>
  <h4>단계별로 이해하기</h4><ol class="n-steps">${n.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
  ${(n.figs||[]).map(f=>`<p class="n-cap">${esc(f.cap)}</p><div class="n-fig">${f.svg}</div>`).join("")}
  <h4>예제 풀이</h4><div class="n-ex">${n.ex.map(s=>`<p>${esc(s)}</p>`).join("")}</div>
  <h4>자주 하는 실수</h4><ul class="n-bad">${n.bad.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`;
}

function qKey(q){ return q.p+"|"+(q.t==="choice"?q.c[q.a]:q.t==="text"?q.a[0]:String(q.a)); }
function isSaved(q){ return (S.saved||[]).some(s=>s.key===qKey(q)); }

  return `<button type="button" class="qsave ${on?"on":""}" data-save="${doc.id}:${i}" aria-pressed="${on}" aria-label="문제 저장">${on?"★ 저장됨":"☆ 저장"}</button>`; }
document.addEventListener("click",e=>{
  const u=e.target.closest&&e.target.closest("[data-unsave]");

let S=load();
function prune(){
  const ids=Object.keys(S.gen||{}); if(ids.length<=CONFIG.keepDocs) return;
  const keep=new Set([...Object.values(S.cur||{}), S.free, S.viewSheet, ...Object.values(S.exams||{}),
    ...Object.values(S.wb||{}).flatMap(w=>w.sheets||[]), ...S.wrongLog.filter(w=>!isResolved(w)).map(w=>w.docId)].filter(Boolean));
  const old=ids.filter(id=>!keep.has(id) && S.docs[id]?.completedAt).sort((a,b)=>(S.docs[a].completedAt||0)-(S.docs[b].completedAt||0));
  const drop=new Set(old.slice(0, ids.length-CONFIG.keepDocs));
  drop.forEach(id=>{ delete S.gen[id]; delete S.docs[id]; });
  S.wrongLog=S.wrongLog.filter(w=>!drop.has(w.docId));
  S.appeals=(S.appeals||[]).slice(-200); S.examLog=(S.examLog||[]).slice(-100); S.ledger=S.ledger||[];
}

}

/* 생성 문서: 수학은 생성기, 국어는 문항 은행에서 */
function bankPick(subj,L,r,picked,usedC){
  const used=S.usedBank, BK=bankOf(subj), inDoc=(lv,k)=>picked.some(p=>p&&p[0]===lv&&p[1]===k);
  /* 그 수준 문항을 한 바퀴 다 풀었으면 그 수준만 다시 섞어 처음부터 (다른 수준으로 새지 않게) */
  let free_=BK[L].map((_,k)=>k).filter(k=>!used[bkey(subj,L,k)] && !inDoc(L,k));
  if(!free_.length){ BK[L].forEach((_,k)=>{ delete used[bkey(subj,L,k)]; }); free_=BK[L].map((_,k)=>k).filter(k=>!inDoc(L,k)); }
  let got = free_.length ? [L, pickByPrio(free_, k=>korConceptName(L,k,subj), subj, usedC, r, true)] : null; if(got) usedC.add("c:"+korConceptName(L,got[1],subj));
  for(let d=1; !got && d<=MAXL; d++){ for(const lv of [L-d,L+d]){ if(got||lv<0||lv>MAXL) continue;
    const f2=BK[lv].map((_,k)=>k).filter(k=>!inDoc(lv,k)); if(f2.length) got=[lv,f2[Math.floor(r()*f2.length)]]; } }
  return got;
}
function genDoc(subj,g,step,free){

    for(let i=0;i<N_;i++){ const q=mathItemLearn(contentLv(g,step,r),r,kinds[i]||0,used,subj); q.gl=gl; qs.push(q); }
  } else {
    const picked=[], usedC=new Set(), used=new Set(), calc=[];
    if(subj==="과학"){ const kinds=[1,2,2,3], nCalc=CONFIG.sciCalc[step]||2;
      for(let i=0;i<nCalc;i++){ const L=contentLv(g,step,r); if(!SCI_GEN[L].think.length) continue; const q=mathItemLearn(L,r,kinds[i]||2,used,subj); q.gl=gl; calc.push(q); } }
    for(let i=0;i<N_-calc.length;i++) picked.push(bankPick(subj,contentLv(g,step,r),r,picked,usedC));
    qs=picked.filter(Boolean).map(([lv,k])=>{ const q=korItem(lv,k,r,subj); q.gl=gl; return q; }).concat(calc);

    file:`${D.name}_점검대장_${String(S.seq).padStart(4,"0")}.ksht`,
    title: G.lv.length===1 ? `${D.titles[G.lv[0]]} 점검` : `${G.school} 종합 점검`, level:`${gl} · ${G.school}`, qs};

/* =========================================================
   적성 배치 검사 — 문항반응이론(Rasch형) 적응형
   ========================================================= */
const GRID=[]; for(let t=-1; t<=MAXL+1.001; t+=0.1) GRID.push(+t.toFixed(1));
/* 4모수형: 찍어서 맞힐 확률(객관식 c)과 아는데 실수할 확률(1-d)을 반영 → 한 번 틀려도 크게 깎이지 않음 */
function pCorrect(theta,lv,t){ const c = t==="choice" ? CONFIG.irtGuess : 0, d = CONFIG.irtCeil;
  return c + (d-c) / (1+Math.exp(-CONFIG.irtA*(theta-(lv-0.25)))); }
function eap(items,answers){
  const w=GRID.map(t=>{ let v=Math.exp(-0.5*((t-CONFIG.placeStart)/CONFIG.placePriorSd)**2);
    items.forEach((it,i)=>{ const a=answers[i]; if(!a) return; const p=pCorrect(t,it.lv,it.t); v*= a.correct? p : (1-p); }); return v; });
  const z=w.reduce((x,y)=>x+y,0)||1; const m=GRID.reduce((acc,t,i)=>acc+t*w[i],0)/z;
  const sd=Math.sqrt(GRID.reduce((acc,t,i)=>acc+(t-m)**2*w[i],0)/z); return {m,sd};
}
function plItem(subj,L,usedIdx){
  const r=rng((Date.now()^Math.floor(Math.random()*1e9))>>>0);
  /* 영역이 한쪽으로 쏠리지 않게: 지금까지 가장 덜 물어본 영역의 문항부터 */
  const items=(S.pl[subj]||{}).items||[], cnt={}; items.forEach(z=>{ const d=domainOf(z,subj); cnt[d]=(cnt[d]||0)+1; });
  const least=(cands,domOf)=>{ let best=Infinity,pool=[]; cands.forEach(c=>{ const n=cnt[domOf(c)]||0; if(n<best){ best=n; pool=[c]; } else if(n===best) pool.push(c); }); return pool[Math.floor(r()*pool.length)]; };
  if(subj==="수학"){ const used=new Set(items.map(z=>z.gk).filter(Boolean)), list=MATH_GEN[L].norm;
    let idx=list.map((_,i)=>i).filter(i=>!used.has("n"+L+":"+i)); if(!idx.length) idx=list.map((_,i)=>i);
    const i=least(idx,i=>genDomain(L,0,i,subj)); const q=makeGenItem(subj,L,0,i,r); q.k="검사 항목"; return q; }
  const BK=bankOf(subj);
  for(let d=0; d<=MAXL; d++){ for(const lv of (d?[L-d,L+d]:[L])){ if(lv<0||lv>MAXL) continue;
    const free=BK[lv].map((_,i)=>i).filter(i=>!usedIdx.includes(bkey(subj,lv,i)));
    if(free.length){ const k=least(free,k=>domainOf({p:BK[lv][k].p,cn:BK[lv][k].cn},subj)); const q=korItem(lv,k,r,subj); q.lv=lv; q.k="검사 항목"; return q; } } }
}
/* 배치고사에서 틀린 문항을 오답노트로 (검사는 다시 볼 수 있으니 틀린 문항만 따로 보관) */
function archivePlacementWrong(subj){
  const pl=S.pl[subj], ds=S.docs["PL-"+subj]; if(!pl||!pl.done||pl.archived||!ds) return;
  const wrong=pl.items.map((q,i)=>[q,i]).filter(([q,i])=>ds.answers[i] && !ds.answers[i].correct);
  pl.archived=true; if(!wrong.length) return;
  S.seq=(S.seq||0)+1; const id="P"+S.seq;
  const qs=wrong.map(([q])=>{ const c=JSON.parse(JSON.stringify(q)); c.k="배치고사"; delete c.bank; return c; });
  S.gen[id]={id, subject:subj, view:DEPTS[subj].view, archived:true, no:"배치-"+String(S.seq).padStart(4,"0"), title:"적성 배치 검사 오답", level:"배치고사", qs};
  S.docs[id]={answers:Object.fromEntries(wrong.map(([q,i],k)=>[k,{...ds.answers[i]}])), draft:{}, startedAt:pl.startedAt||Date.now(), completedAt:Date.now(), scrollY:null};
  wrong.forEach(([q,i],k)=>S.wrongLog.push({docId:id, qi:k, resp:ds.answers[i].resp, at:Date.now(), from:"placement"}));
}
function plStart(subj){
  S.pl[subj]={items:[], done:false, startedAt:Date.now()}; delete S.docs["PL-"+subj];
  S.pl[subj].items.push(plItem(subj, Math.round(CONFIG.placeStart), [])); save();
}
function plAfterAnswer(subj){
  const pl=S.pl[subj], ds=docState("PL-"+subj), n=pl.items.length;
  const {m,sd}=eap(pl.items, ds.answers);
  pl.theta=m; pl.sd=sd;
  const top = m>MAXL-0.2 && sd<0.8, bottom = m<0.2 && sd<0.8;
  if((n>=CONFIG.placeMin && (sd<CONFIG.placeStopSd || top || bottom)) || n>=CONFIG.placeMax){
    pl.done=true; pl.est=Math.max(0,Math.min(MAXL,Math.floor(m+0.25))); pl.n=n; archivePlacementWrong(subj);
    pl.ok=pl.items.filter((_,i)=>ds.answers[i]?.correct).length; save(); render(false); showPlacementResult(subj); return;
  }
  const next=Math.max(0,Math.min(MAXL,Math.round(m)));
  pl.items.push(plItem(subj,next,pl.items.map(q=>q.bank).filter(Boolean))); save();
}

document.addEventListener("input",e=>{

  docState(activeDocId).draft[i]=e.target.value; save();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.dataset.input!=null){ e.preventDefault(); submit(Number(e.target.dataset.input)); }
});
function rerenderKeep(){ const y=window.scrollY; render(false); window.scrollTo(0,y); }
function submit(i){
  const doc=getDoc(activeDocId), ds=docState(activeDocId), q=doc.qs[i];
  if(isLocked(doc,ds.answers[i],q)) return;
  let resp = ds.draft[i] ?? ds.answers[i]?.resp;
  if(q.t!=="choice"){ const el=document.getElementById(`in-${doc.id}-${i}`); resp=el?el.value:resp; }
  if(resp==null || String(resp).trim()===""){ toast("회신란이 비어 있습니다."); return; }
  if(q.t==="num" && parseNumberAnswer(resp)===null && !/^(모름|몰라|모르겠음|\?)$/.test(String(resp).trim())){ toast("숫자로 입력해 주세요. 모르면 ‘모름’이라고 써도 됩니다."); return; }
  const ok=grade(q,resp), prev=ds.answers[i];
  const now_=Date.now(), ms = prev ? prev.ms : Math.min(Math.max(0,now_-(ds.tick||ds.startedAt||now_)), 600000); ds.tick=now_;   /* 첫 회신까지 걸린 시간(10분 상한) */
  ds.answers[i]={resp, correct:ok, ms, hint:prev?.hint, attempts:(prev?.attempts||0)+1, firstCorrect: prev?prev.firstCorrect:ok,
                 firstResp: prev?prev.firstResp:resp, at:Date.now(), hist:[...(prev?.hist||[]),{resp,ok,at:Date.now()}]};
  delete ds.draft[i];
  if(!prev) noteLearn(doc.subject,q,ok);
  if(!prev && !ok && !doc.placement && !doc.review && !doc.exam) S.wrongLog.push({docId:doc.id, qi:i, resp, at:Date.now()});
  if(doc.review && ok){ const r=q.ref; S.wrongLog.forEach(w=>{ if(w.docId===r.docId && w.qi===r.qi) w.resolved=true; }); }
  if(doc.qs[i].bank) S.usedBank[doc.qs[i].bank]=1;
  const regular=!doc.placement && !doc.free && !doc.review && !doc.exam && !S.free;
  if(regular && !prev){ const sj=doc.subject; S.stats[sj]=S.stats[sj]||{ok:0,total:0}; S.stats[sj].total++; if(ok) S.stats[sj].ok++; }
  save(); say(doc.placement||doc.exam?`${i+1}번 접수`:`${i+1}번 ${ok?"적정":"재검토"}`);
  if(doc.placement){ plAfterAnswer(doc.subject); if(S.pl[doc.subject].done) return; const y=window.scrollY; render(false); window.scrollTo(0,y); focusNext(doc.id, i); return; }
  rerenderKeep();
  focusNext(doc.id, i);
}
/* 회신 직후 다음 문제 입력칸으로 커서 이동 (키보드 유지: 같은 동작 안에서 바로 focus) */
function focusNext(docId, i){
  const doc=getDoc(docId), ds=docState(docId);
  let k=i+1; while(k<doc.qs.length && ds.answers[k]) k++;          // 다음 미회신 행
  if(k>=doc.qs.length){ k=doc.qs.findIndex((_,j)=>ds.answers[j]&&!ds.answers[j].correct&&!isLocked(doc,ds.answers[j],doc.qs[j])); }  // 남은 재검토 행
  if(k<0||k===undefined) { const r=document.querySelector(".report,[data-act=report],[data-act=exam-grade]"); r&&r.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"}); return; }
  const inp=document.getElementById(`in-${docId}-${k}`);
  const row=document.getElementById("row-"+k);
  if(inp && !inp.disabled){ try{ inp.focus({preventScroll:true}); inp.select&&inp.select(); }catch(e){} }
  const target=row||inp; if(!target) return;
  requestAnimationFrame(()=>{ const rc=target.getBoundingClientRect(); if(rc.top<70 || rc.bottom>window.innerHeight*0.6) target.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"}); });
}

    if(ds.draft[i]===v){ submit(i); return; }
    ds.draft[i]=v; save(); rerenderKeep(); return; }

  if(b.dataset.sec){ const sj=S.subject; saveScroll(); setSec(sj,b.dataset.sec); S.free=null; S.viewSheet=null; save(); render(true); return; }
  if(b.dataset.view){ const sj=b.dataset.viewsj||S.subject; S.subject=sj; S.screen="floor"; setSec(sj,"main"); S.free=null; S.viewSheet=(b.dataset.view===S.cur[sj])?null:b.dataset.view; save(); render(true); return; }
  if(b.dataset.gowrong){ const sj=b.dataset.gowrong; ride(DEPTS[sj].floor,()=>{ S.screen="floor"; S.subject=sj; S.free=null; newWorkbook(sj); setSec(sj,"wrong"); save(); render(true); }); return; }
  if(b.dataset.sheet){ const sj=S.subject, id=b.dataset.sheet; S.viewSheet = (id===S.cur[sj]) ? null : id; save(); render(true); return; }
  if(b.dataset.choice!=null){ const ds=docState(activeDocId); ds.draft[b.dataset.choice]=Number(b.dataset.val); save(); rerenderKeep(); return; }
  if(b.dataset.hint!=null){ const i=Number(b.dataset.hint), doc=getDoc(activeDocId), ds=docState(activeDocId), a=ds.answers[i]; if(!a) return;
    ds.hint=ds.hint||{}; const n=hintSteps(doc.qs[i],doc.subject).length; ds.hint[i]=Math.min((ds.hint[i]||0)+1,n+1); a.hint=ds.hint[i]; if(ds.hint[i]>n) a.gaveUp=true; save(); rerenderKeep(); return; }
  if(b.dataset.sol!=null){ const ds=docState(activeDocId); ds.sol={...(ds.sol||{}),[b.dataset.sol]:true}; save(); rerenderKeep(); return; }
  if(b.dataset.open!=null){ const ds=docState(activeDocId); ds.open={...(ds.open||{}),[b.dataset.open]:true}; save(); rerenderKeep(); return; }
  if(b.dataset.appeal!=null){ const i=Number(b.dataset.appeal), a=docState(activeDocId).answers[i]; S.appeals.push({docId:activeDocId,qi:i,resp:a.resp,at:Date.now()}); save(); toast("정답 인정 요청을 기록했습니다. 검수 때 반영됩니다."); return; }
  if(b.dataset.free){ saveScroll(); S.screen="floor"; S.free=b.dataset.free; const ds=docState(S.free); if(ds.completedAt) resetDocState(ds); save(); render(true); return; }
  if(b.dataset.replace){ const sj=b.dataset.replace; delete S.placed[sj]; delete S.pl[sj]; delete S.docs["PL-"+sj];
    save(); ride(DEPTS[sj].floor,()=>{ S.screen="floor"; S.subject=sj; S.free=null; save(); render(true); }); return; }
  if(b.dataset.pick!=null){ pickLevel(S.subject, Number(b.dataset.pick), Number(b.dataset.step||1)); return; }

function genExam(subj){

  for(let i=0;i<CONFIG.examSize;i++){ const L=G.lv[i%G.lv.length]; let q;
    if(subj==="수학") q=mathItemLearn(L,r,(i%5<3)?2:3,used,subj);                       /* 결합 문제 6 + 도전 과제 4 */
    else if(subj==="과학" && i>=CONFIG.examSize-4 && SCI_GEN[L].think.length) q=mathItemLearn(L,r,i%2?2:3,used,subj);
    else { const BK=bankOf(subj), free_=BK[L].map((_,k)=>k).filter(k=>!qs.some(z=>z.bank===bkey(subj,L,k)));
      const k=pickByPrio(free_.length?free_:BK[L].map((_,k)=>k), k=>korConceptName(L,k,subj), subj, usedC, r, true); usedC.add("c:"+korConceptName(L,k,subj)); q=korItem(L,k,r,subj); }

  save(); return id;

    const tone=(f,t0,dur)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=ding?"sine":"square"; o.frequency.value=f; g.gain.value=ding?0.08:0.05; o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t0); o.stop(ctx.currentTime+t0+dur); };
    if(ding){ tone(1318,0,.18); tone(1046,.16,.3); } else tone(1760,0,.09); }catch(e){}
  try{ !ding && navigator.vibrate && navigator.vibrate(40); }catch(e){}
}
function tagIn(){
  const now=new Date();
  const first = !(S.clock && S.clock.date===ymd(now));
  if(first){ S.clock={date:ymd(now), time:hhmm(now)}; S.clockLog=(S.clockLog||[]).concat([S.clock]).slice(-60); }
  S.screen="lift"; S.atFloor="1F"; save();
  beep(false);
  $("#idcard").classList.add("tagged"); $("#reader").classList.add("ok");
  $("#gmsg").innerHTML=`<b>${first?"출근 처리되었습니다":"입장합니다"} · ${S.clock.time}</b><div class="sub">엘리베이터 홀로 이동합니다</div>`;
  render(true);
  const g=$("#gate"); let done=false;
  const finish=()=>{ if(done) return; done=true; g.classList.add("out"); setTimeout(()=>{ g.hidden=true; g.innerHTML=""; },reduce?0:450); };
  setTimeout(()=>g.addEventListener("click",finish),0);
  setTimeout(finish, reduce?400:1100);
}
