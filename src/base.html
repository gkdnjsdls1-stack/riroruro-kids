/* ===== 학습 지도: 등산로 ===== */
let MAPSEL=null;
const LVCON={};
function levelConcepts(subj,L){
  const key=subj+L; if(LVCON[key]) return LVCON[key];
  const out=DOMAINS[subj].map(()=>new Map());
  const add=(q)=>{ try{ const c=conceptOf(q,subj), d=domainOf(q,subj); if(out[d]&&!out[d].has(c.name)) out[d].set(c.name,c); }catch(e){} };
  if(subj!=="수학") (bankOf(subj)[L]||[]).forEach(it=>add({p:it.p,k:"",cn:it.cn,d:it.d}));
  if(subj!=="국어") KINDS.forEach((kn,kd)=>(gensOf(subj)[L][kn]||[]).forEach((f,i)=>{ try{ add(genSample(L,kd,i,subj)); }catch(e){} }));
  return LVCON[key]=out.map(m=>[...m.values()]);
}
const TR_LAB={done:"익힘",weak:"막힘",doing:"확인 중",none:"미출제"};
function trailHtml(subj){
  const D=DOMAINS[subj], x=gradeOf(subj), curL=GRADES[x.g].lv[0], dm=(S.dmap||{})[subj]||{};
  const rows=[];
  for(let L=MAXL;L>=0;L--){
    const sts=D.map((_,d)=>cellState(dm[L+"|"+d]));
    const agg = sts.includes("weak")?"weak" : sts.filter(s=>s==="done").length*2>=D.length?"done" : sts.some(s=>s!=="none")?"doing":"none";
    const chips=D.map((nm,d)=>{ const c=dm[L+"|"+d], st=sts[d], sel=MAPSEL===L+"|"+d;
      return `<button type="button" class="tr-chip ${st} ${sel?"sel":""}" data-mapsel="${L}|${d}" aria-pressed="${sel}">${CELL_LAB[st][0]} ${esc(nm)}${c&&c.n?` <small>${c.ok}/${c.n}</small>`:""}</button>`; }).join("");
    let detail="";
    if(sel_in(L)){
      const d=Number(MAPSEL.split("|")[1]), c=dm[L+"|"+d], st=sts[d], cons=levelConcepts(subj,L)[d]||[];
      const g=GRADES.findIndex(G=>G.lv.includes(L));
      detail=`<div class="tr-detail"><b>${esc(LEVELS[L].grade)} · ${esc(D[d])}</b> <span class="tr-st ${st}">${TR_LAB[st]}</span>
        <p>첫 회신 정답률 ${c&&c.n?`${c.ok}/${c.n} (${Math.round(c.ok/c.n*100)}%)`:"아직 기록 없음"}</p>
        ${cons.length?`<ul>${cons.map(k=>{ const s=learnState(subj,k.name); return `<li><span class="tr-dot ${s==="done"?"done":s==="doing"?"doing":"none"}"></span>${esc(k.name)}<small>${s==="done"?"익힘":s==="doing"?"학습 중":"미출제"}</small></li>`; }).join("")}</ul>`:'<p class="tr-none">이 칸에 해당하는 개념이 아직 없습니다.</p>'}
        ${g>=0?`<button class="btn primary" data-freelv="${g}">${esc(LEVELS[L].grade)} 수준 문서 풀기 (특근)</button>`:""}</div>`;
    }
    rows.push(`<div class="tr-row ${agg} ${L===curL?"cur":""}"><span class="tr-node" aria-hidden="true">${L===curL?"🚩":L===MAXL?"⛰":""}</span>
      <div class="tr-card"><div class="tr-h"><b>${esc(LEVELS[L].grade)}</b><small>${esc(LEVELS[L].rank)}${L===curL?" · 현재 위치":""}</small></div><div class="tr-chips">${chips}</div>${detail}</div></div>`);
  }
  return `<div class="trail"><p class="tr-sum">${esc(stopLine(subj))}</p>${rows.join("")}<div class="tr-base">▲ 출발점 (초1)</div></div>`;
}
function sel_in(L){ return MAPSEL && Number(MAPSEL.split("|")[0])===L; }
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-mapsel]"); if(!b) return;
  MAPSEL = MAPSEL===b.dataset.mapsel ? null : b.dataset.mapsel; rerenderKeep();
});

12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">제2사분면</text><text x=\"98\" y=\"84\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">(−, +)</text><text x=\"98\" y=\"118\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">제3사분면</text><text x=\"98\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">(−, −)</text><text x=\"222\" y=\"118\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">제4사분면</text><text x=\"222\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">(+, −)</text><line x1=\"244\" y1=\"92\" x2=\"244\" y2=\"36\" stroke=\"#c62828\" stroke-width=\"1.2\" stroke-dasharray=\"4\"/><line x1=\"160\" y1=\"36\" x2=\"244\" y2=\"36\" stroke=\"#c62828\" stroke-width=\"1.2\" stroke-dasharray=\"4\"/><circle cx=\"244\" cy=\"36\" r=\"4.5\" fill=\"#c62828\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"252\" y=\"28\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">(3, 2)</text></svg>", "steps": ["가로축이 x, 세로축이 y예요. 점은 (x, y) 순서로 써요.", "x가 +면 오른쪽, −면 왼쪽. y가 +면 위, −면 아래.", "오른쪽 위가 제1사분면이고, 시계 반대 방향으로 2, 3, 4사분면이에요.", "x나 y가 0이면 축 위의 점이라서 어느 사분면에도 속하지 않아요.", "💡 왜 이런 순서일까요? x축은 오른쪽이 +, y축은 위쪽이 +예요. 그래서 오른쪽·위가 (+,+)이고, 반시계 방향으로 돌며 x가 먼저 −가 되고(제2), y도 −가 되고(제3), x가 다시 +가 돼요(제4)."], "ex": ["(3, 2) → 오른쪽 3, 위로 2 → 제1사분면", "(−1, −4) → 왼쪽, 아래 → 제3사분면", "(0, 5) → y축 위 → 사분면 없음"], "bad": ["(x, y) 순서를 바꿔서 y를 먼저 읽음", "제2사분면과 제4사분면을 헷갈림 — 반시계 방향 번호를 기억해요"]}, "정비례 y = ax": {"short": "y = ax: x가 2배, 3배가 되면 y도 2배, 3배. y ÷ x 가 항상 a. 그래프는 원점을 지나는 직선.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"y=2x의 그래프. 원점을 지나는 직선\" class=\"nsvg\"><line x1=\"36\" y1=\"150\" x2=\"208.0\" y2=\"150\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"36\" y1=\"150\" x2=\"36\" y2=\"3.8000000000000114\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"216.0\" y=\"164\" font-size=\"1 #e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><text x=\"91\" y=\"66\" font-size=\"18\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2</text><rect x=\"118\" y=\"40\" width=\"38\" height=\"38\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.5\"/><text x=\"137\" y=\"66\" font-size=\"18\" text-anchor=\"middle\" fill=\"#777\" font-weight=\"normal\">3</text><rect x=\"164\" y=\"40\" width=\"38\" height=\"38\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><text x=\"183\" y=\"66\" font-size=\"18\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">4</text><rect x=\"210\" y=\"40\" width=\"38\" height=\"38\" fill=\"#fff\" stroke=\"#999\" stroke-width=\"1.5\"/><text x=\"229\" y=\"66\" font-size=\"18\" text-anchor=\"middle\" fill=\"#777\" font-weight=\"normal\">5</text><rect x=\"256\" y=\"40\" width=\"38\" height=\"38\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><text x=\"275\" y=\"66\" font-size=\"18\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">6</text><text x=\"160\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">주사위 눈이 짝수 → 2, 4, 6 (파란 칸)</text><text x=\"160\" y=\"130\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">확률 = 일어나는 경우의 수 / 모든 경우의 수</text><text x=\"160\" y=\"156\" font-size=\"16\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">= 3 / 6 = 1/2</text></svg>", "steps": ["모든 경우의 수를 세요. 주사위는 1~6이라서 6가지.", "내가 원하는 경우가 몇 가지인지 세요. 짝수는 2, 4, 6이라서 3가지.", "(원하는 경우) ÷ (전체 경우) 를 계산해요. 3/6 = 1/2", "‘안 일어날 확률’은 1에서 빼면 돼요. 홀수가 나올 확률 = 1 − 1/2 = 1/2", "💡 왜 1 − (안 일어날 확률)일까요? 일어나는 경우와 안 일어나는 경우를 합치면 모든 경우이고, 그 확률의 합이 1이에요. ‘적어도 하나’ 문제는 이 여사건으로 풀면 쉬워요."], "ex": ["동전 2개를 던질 때 앞면이 둘 다 나올 확률: 전체 4가지(앞앞, 앞뒤, 뒤앞, 뒤뒤) 중 1가지 → 1/4", "1~10 카드 중 3의 배수 (3, 6, 9) → 3/10"], "bad": ["전체 경우를 잘못 셈 — 동전 2개는 3가지가 아니라 4가지 (앞뒤와 뒤앞이 달라요)", "확률이 1보다 크게 나옴 — 분자가 분모보다 클 수 없어요"]}, "닮은 도형의 넓이의 비": {"short": "닮음비가 m : n 이면 넓이의 비는 m² : n², 부피의 비는 m³ : n³.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"한 변이 1인 정사각형과 한 변이 2인 정사각형. 넓이는 1칸과 4칸\" class=\"nsvg\"><rect x=\"30\" y=\"40\" width=\"80\" height=\"80\" fill=\"#e8f0fb\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"70\" y1=\"40\" x2=\"70\" y2=\"120\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"30\" y1=\"80\" x2=\"110\" y2=\"80\" stroke=\"#d5d9de\" stroke-width=\"1\"/><rect x=\"30\" y=\"80\" width=\"40\" height=\"40\" fill=\"#cfe0f5\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><text x=\"50\" y=\"104\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">1</text><text x=\"50\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">한 변 1</text><text x=\"70\" y=\"32\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">한 변 2</text><text x=\"222\" y=\"56\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">닮음비  1 : 2</text><text x=\"222\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">넓이의 비</text><text x=\"222\" y=\"108\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">1² : 2² = 1 : 4</text><text x=\"222\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">(부피의 비는 1³ : 2³ = 1 : 8)</text></svg>", "steps": ["닮은 도형은 모양이 같고 크기만 달라요. 길이의 비가 닮음비예요.", "한 변이 2배면 가로·세로가 모두 2배라서 넓이는 2 × 2 = 4배가 돼요.", "그래서 닮음비 m : n 이면 넓이의 비는 m² : n² 이에요.", "부피는 가로·세로·높이 세 방향이 늘어나니까 m³ : n³ 이에요.", "💡 왜 제곱일까요? 가로·세로가 모두 m배가 되면 넓이는 (가로 m배) × (세로 m배) = m² 배예요. 부피는 가로·세로·높이 세 방향이라 m³ 배예요."], "ex": ["닮음비 2 : 3 → 넓이의 비 4 : 9", "작은 삼각형의 넓이가 12 cm², 닮음비 2 : 3 → 큰 삼각형 넓이 = 12 × 9/4 = 27 cm²"], "bad": ["넓이의 비를 닮음비와 똑같이 둠 (제곱을 해야 해요)", "넓이의 비 4 : 9 에서 길이를 구할 때 제곱근을 안 씀"]}, "제곱근 √": {"short": "양수 a의 제곱근은 ±√a 두 개, 0의 제곱근은 0 하나예요. 음수의 제곱근은 실수 범위에서 없어요. √(a²) = a (a ≥ 0)", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"모눈 위에 넓이가 5인 기울어진 정사각형. 한 변의 길이가 √5\" class=\"nsvg\"><line x1=\"40\" y1=\"16\" x2=\"40\" y2=\"136\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"40\" y1=\"16\" x2=\"160\" y2=\"16\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"80\" y1=\"16\" x2=\"80\" y2=\"136\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"40\" y1=\"56\" x2=\"160\" y2=\"56\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"120\" y1=\"16\" x2=\"120\" y2=\"136\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"40\" y1=\"96\" x2=\"160\" y2=\"96\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"160\" y1=\"16\" x2=\"160\" y2=\"136\" stroke=\"#d5d9de\" stroke-width=\"1\"/><line x1=\"40\" y1=\"136\" x2=\"160\" y2=\"136\" stroke=\"#d5d9de\" stroke-width=\"1\"/><path d=\"M80.0,16.0 L160.0,56.0 L120.0,136.0 L40.0,96.0 Z\" fill=\"#cfe0f5\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><text x=\"100.0\" y=\"82.0\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">넓이 5</text><text x=\"150.0\" y=\"28.0\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">한 변 = √5</text><text x=\"230\" y=\"50\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">제곱해서 5가 되는 수</text><text x=\"230\" y=\"72\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">→ √5 와 −√5</text><text x=\"230\" y=\"108\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">√9 = 3  (√ 는 양수만)</text><text x=\"230\" y=\"130\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">x² = 9 → x = ±3</text></svg>", "steps": ["제곱해서 9가 되는 수는 3과 −3 두 개예요. 이걸 9의 제곱근이라고 해요.", "그중 양수만 √ 기호로 써요. √9 = 3", "넓이가 5인 정사각형의 한 변은 제곱해서 5가 되는 수니까 √5예요. (왼쪽 그림)", "그래서 x² = 5 를 풀면 x = ±√5 (플러스와 마이너스 둘 다).", "💡 왜 ±√a 두 개일까요? (+3)² = 9 이고 (−3)² = 9 라서 제곱해 9가 되는 수는 3과 −3 둘이에요. 음수의 제곱근이 없는 이유는 어떤 실수를 제곱해도 0 이상이기 때문이에요. √(a²) = |a| 인 것도 √ 는 항상 0 이상 값만 나타내서예요."], "ex": ["x² = 16 → x = ±4", "√25 = 5 (√25 = ±5 라고 쓰면 틀려요)", "√((−3)²) = √9 = 3"], "bad": ["√9 = ±3 으로 씀 (기호 √ 는 양수 하나만)", "x² = 16 에서 x = 4 만 답으로 씀"]}, "이차방정식 (인수분해)": {"short": "(x − p)(x − q) = 0 이면 x = p 또는 x = q. (곱해서 0이면 적어도 하나는 0)", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"y=x²−5x+6 포물선이 x축과 x=2, x=3에서 만나는 그림\" class=\"nsvg\"><line x1=\"48\" y1=\"150\" x2=\"260.0\" y2=\"150\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"48\" y1=\"164.4\" x2=\"48\" y2=\"27.60000000000001\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"268.0\" y=\"164\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"58\" y=\"25.60000000000001\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><line x1=\"88\" y1=\"147\" x2=\"88\" y2=\"153\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"88\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"128\" y1=\"147\" x2=\"128\" y2=\"153\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"128\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"168\" y1=\"147\" x2=\"168\" y2=\"153\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"168\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"208\" y1=\"147\" x2=\"208\" y2=\"153\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"208\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">4</text><line x1=\"248\" y1=\"147\" x2=\"248\" y2=\"153\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"248\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">5</text><path d=\"M48.0,42.0 L51.4,49.4 L54.7,56.6 L58.1,63.6 L61.5,70.3 L64.8,76.7 L68.2,82.9 L71.6,88.8 L74.9,94.4 L78.3,99.8 L81.7,105.0 L85.0,109.9 L88.4,114.5 L91.8,118.9 L95.1,123.1 L98.5,126.9 L101.9,130.6 L105.2,133.9 L108.6,137.0 L112.0,139.9 L115.3,142.5 L118.7,144.8 L122.1,146.9 L125.4,148.8 는 3", "x² = 3x → x² − 3x = 0 → x(x − 3) = 0 → x = 0 또는 3"], "bad": ["x² = 3x 에서 양변을 x로 나눠서 x = 3 만 구함 (x = 0 을 잃어요)", "(x − 2)(x − 3) = 0 에서 x = −2, −3 으로 부호를 그대로 씀"], "figs": [{"cap": "왜 ‘x = 2 또는 x = 3’ 일까? — 곱이 0이 되는 건 적어도 하나가 0일 때뿐이에요", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"곱이 0이 되려면 둘 중 하나는 0\" class=\"nsvg\"><text x=\"160\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">두 수를 곱해서 0 이 되려면?</text><rect x=\"8\" y=\"36\" width=\"96\" height=\"34\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"56\" y=\"58\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">0 × 5 = 0</text><text x=\"56\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">○ 가능</text><rect x=\"112\" y=\"36\" width=\"96\" height=\"34\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"58\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">7 × 0 = 0</text><text x=\"160\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">○ 가능</text><rect x=\"216\" y=\"36\" width=\"96\" height=\"34\" fill=\"#fdecea\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"264\" y=\"58\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">2 × 3 = 6</text><text x=\"264\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">✕ 불가능</text><text x=\"160\" y=\"106\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">둘 다 0이 아니면 곱도 0이 아니에요.</text><text x=\"160\" y=\"122\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">→ 곱이 0이면 적어도 하나는 0</text><text x=\"160\" y=\"142\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">(x − 2)(x − 3) = 0</text><text x=\"160\" y=\"164\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">x − 2 = 0  또는  x − 3 = 0   →   x = 2 또는 3</text></svg>"}]}, "피타고라스 정리": {"short": "직각삼각형에서 (짧은 두 변)² 의 합 = (가장 긴 변, 빗변)². a² + b² = c²", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"직각삼각형 세 변 위의 정사각형. 넓이 9+16=25\" class=\"nsvg\"><rect x=\"58\" y=\"68\" width=\"42\" height=\"42\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"100\" y=\"110\" width=\"56\" height=\"56\" fill=\"#fff4cc\" stroke=\"#b8860b\" stroke-width=\"1.5\"/><path d=\"M100.0,68.0 L156.0,110.0 L198.0,54.0 L142.0,12.0 Z\" fill=\"#fde3e1\" stroke=\"#c62828\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M100.0,68.0 L100.0,110.0 L156.0,110.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"M100.0,110.0 L100.0,102.0 L108.0,102.0 L108.0,110.0 Z\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><text x=\"79\" y=\"93\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">9</text><text x=\"128\" y=\"142\" font-size=\"14\" text-anchor=\"middle\" fill=\"#8a5a00\" font-weight=\"bold\">16</text><text x=\"149\" y=\"66\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">25</text><text x=\"86\" y=\"91\" font-size=\"1\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\"></text><text x=\"90\" y=\"92\" font-size=\"1\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\"></text><text x=\"264\" y=\"60\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">직각삼각형에서</text><text x=\"264\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">짧은 두 변의 정사각형</text><text x=\"264\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">넓이를 더하면</text><text x=\"264\" y=\"122\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">9 + 16 = 25</text><text x=\"264\" y=\"148\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">a² + b² = c²</text></svg>", "steps": ["직각삼각형의 세 변마다 정사각형을 그려 보세요.", "세 변이 3, 4, 5이면 정사각형의 넓이는 9, 16, 25예요.", "작은 두 정사각형의 넓이를 더하면 (9 + 16) 가장 큰 정사각형(25)과 같아요.", "그래서 직각을 낀 두 변을 a, b, 빗변(가장 긴 변)을 c 라고 하면 a² + b² = c²."], "ex": ["두 변이 6, 8 → c² = 36 + 64 = 100 → c = 10", "빗변 13, 한 변 5 → b² = 169 − 25 = 144 → b = 12"], "bad": ["빗변이 아닌 변을 c 에 넣음 — 가장 긴 변이 c", "c² = 25 에서 c = 25 라고 씀 (제곱근을 취해서 c = 5)"], "figs": [{"cap": "왜 a² + b² = c² 일까? — 같은 정사각형을 두 가지로 세어 봐요", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"한 변이 a+b인 정사각형 안에 직각삼각형 4개와 c² 정사각형\" class=\"nsvg\"><rect x=\"20\" y=\"26\" width=\"126\" height=\"126\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"2\"/><path d=\"M74.0,26.0 L146.0,80.0 L92.0,152.0 L20.0,98.0 Z\" fill=\"#fde3e1\" stroke=\"#c62828\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M20.0,26.0 L74.0,26.0 L20.0,98.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M146.0,26.0 L146.0,80.0 L74.0,26.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M146.0,152.0 L92.0,152.0 L146.0,80.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><path d=\"M20.0,152.0 L20.0,98.0 L92.0,152.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"83.0\" y=\"94.0\" font-size=\"16\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">c²</text><text x=\"47.0\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">a</text><text x=\"110.0\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">b</text><text x=\"172\" y=\"40\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">큰 정사각형 한 변 = a + b</text><text x=\"172\" y=\"66\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">(a + b)²</text><text x=\"172\" y=\"84\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">= c² + 삼각형 4개(2ab)</text><text x=\"172\" y=\"110\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">a² + 2ab + b² = c² + 2ab</text><text x=\"172\" y=\"134\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">양쪽에서 2ab 를 빼면</text><text x=\"172\" y=\"156\" font-size=\"15\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">a² + b² = c²</text></svg>"}]}, "다항식의 전개": {"short": "(a + b)(c + d) = ac + ad + bc + bd (분배법칙). (x + p)(x + q) = x² + (p + q)x + pq.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"가로 x+3, 세로 x+2인 직사각형을 네 칸으로 나눈 그림\" class=\"nsvg\"><rect x=\"24\" y=\"22\" width=\"100\" height=\"70\" fill=\"#e8f0fb\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"74.0\" y=\"62.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">x²</text><rect x=\"124\" y=\"22\" width=\"45\" height=\"70\" fill=\"#e6f4ea\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"146.5\" y=\"62.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3x</text><rect x=\"24\" y=\"92\" width=\"100\" height=\"30\" fill=\"#e6f4ea\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"74.0\" y=\"112.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2x</text><rect x=\"124\" y=\"92\" width=\"45\" height=\"30\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"146.5\" y=\"112.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">6</text><text x=\"74.0\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"146.5\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><text x=\"14\" y=\"61.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"14\" y=\"111.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><text x=\"190\" y=\"52\" font-size=\"14\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">(x + 2)(x + 3)</text><text x=\"190\" y=\"76\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">= x² + 3x + 2x + 6</text><text x=\"190\" y=\"100\" font-size=\"14\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">= x² + 5x + 6</text><text x=\"190\" y=\"134\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">네 칸의 넓이를 모두 더해요</text></svg>", "steps": ["(x + 2)(x + 3) 을 가로 x + 3, 세로 x + 2 인 직사각형의 넓이로 생각해요.", "네 칸으로 나누면 x², 3x, 2x, 6 이에요.", "모두 더하면 x² + 3x + 2x + 6, 같은 항끼리 모으면 x² + 5x + 6", "공식으로는 (x + p)(x + q) = x² + (p + q)x + pq. p + q = 5, pq = 6 이에요.", "💡 왜 분배법칙일까요? (a+b)(c+d) 는 가로 a+b, 세로 c+d 인 직사각형의 넓이예요. 이를 네 조각(ac, ad, bc, bd)으로 나눠 더한 것이 전개예요."], "ex": ["(x + 4)(x − 1) = x² + 4x − x − 4 = x² + 3x − 4", "(x + 3)² = (x + 3)(x + 3) = x² + 6x + 9"], "bad": ["(x + 3)² = x² + 9 로 가운데 항을 빼먹음 (6x 가 있어야 해요)", "−를 곱할 때 부호 실수 — (x − 1) 안의 −1 을 곱하는 걸 조심해요"]}, "인수분해 (곱셈 공식 거꾸로)": {"short": "전개의 거꾸로. x² + □x + △ → 합이 □, 곱이 △인 두 수 p, q를 찾아 (x + p)(x + q).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"x²+5x+6을 가로 x+3, 세로 x+2인 직사각형으로 모은 그림\" class=\"nsvg\"><rect x=\"24\" y=\"22\" width=\"100\" height=\"70\" fill=\"#e8f0fb\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"74.0\" y=\"62.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">x²</text><rect x=\"124\" y=\"22\" width=\"45\" height=\"70\" fill=\"#e6f4ea\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"146.5\" y=\"62.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3x</text><rect x=\"24\" y=\"92\" width=\"100\" height=\"30\" fill=\"#e6f4ea\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"74.0\" y=\"112.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2x</text><rect x=\"124\" y=\"92\" width=\"45\" height=\"30\" fill=\"#fff4cc\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"146.5\" y=\"112.0\" font-size=\"15\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">6</text><text x=\"74.0\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"146.5\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><text x=\"14\" y=\"61.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"14\" y=\"111.0\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><text x=\"190\" y=\"52\" font-size=\"14\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">x² + 5x + 6</text><text x=\"190\" y=\"76\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">더해서 5, 곱해서 6</text><text x=\"190\" y=\"96\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">→ 2 와 3</text><text x=\"190\" y=\"122\" font-size=\"14\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">= (x + 2)(x + 3)</text><text x=\"190\" y=\"146\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">네 칸을 직사각형으로 모아요</text></svg>", "steps": ["x² + 5x + 6 은 넓이가 x², 5x, 6 인 조각들이에요. 이걸 하나의 직사각형으로 모으는 거예요.", "가로·세로에 붙는 수 두 개를 찾아야 해요. 더해서 5, 곱해서 6 이어야 해요.", "곱해서 6인 쌍을 적어 봐요. (1, 6), (2, 3) → 합이 5 인 건 (2, 3)", "그래서 (x + 2)(x + 3). 전개해서 맞는지 확인해요.", "💡 왜 합과 곱을 찾을까요? (x+p)(x+q) = x² + (p+q)x + pq 로 전개되기 때문이에요. 그래서 일차항 계수가 p+q, 상수항이 pq 가 되는 두 수를 찾으면 돼요."], "ex": ["x² + 7x + 12 → 합 7, 곱 12 → 3과 4 → (x + 3)(x + 4)", "x² − 5x + 6 → 합 −5, 곱 6 → −2와 −3 → (x − 2)(x − 3)"], "bad": ["합과 곱을 바꿔서 생각함 (합은 x 의 계수, 곱은 상수항)", "상수항이 +인데 두 수의 부호를 다르게 잡음 — 곱이 +이면 두 수는 부호가 같아요"], "figs": [{"cap": "두 수는 어떻게 찾을까? — 곱부터 적어서 합을 확인해요", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"곱이 6인 쌍 중 합이 5인 2와 3을 찾는 표\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">x² + 5x + 6 → 곱이 6 인 두 수를 모두 적고, 합을 확인해요</text><rect x=\"10\" y=\"36\" width=\"68\" height=\"64\" fill=\"#fff\" stroke=\"#aaa\" stroke-width=\"1\"/><text x=\"44\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1 × 6</text><text x=\"44\" y=\"76\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">합 7</text><text x=\"44\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">✕</text><rect x=\"86\" y=\"36\" width=\"68\" height=\"64\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><text x=\"120\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2 × 3</text><text x=\"120\" y=\"76\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">합 5</text><text x=\"120\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">◎ 5!</text><rect x=\"162\" y=\"36\" width=\"68\" height=\"64\" fill=\"#fff\" stroke=\"#aaa\" stroke-width=\"1\"/><text x=\"196\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">−1 × −6</text><text x=\"196\" y=\"76\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">합 −7</text><text x=\"196\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">✕</text><rect x=\"238\" y=\"36\" width=\"68\" height=\"64\" fill=\"#fff\" stroke=\"#aaa\" stroke-width=\"1\"/><text x=\"272\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">−2 × −3</text><text x=\"272\" y=\"76\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">합 −5</text><text x=\"272\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">✕</text><text x=\"160\" y=\"128\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">합이 5 인 건 2 와 3</text><text x=\"160\" y=\"152\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">x² + 5x + 6 = (x + 2)(x + 3)</text><text x=\"160\" y=\"172\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">전개하면 x² + 3x + 2x + 6 = x² + 5x + 6 ✓</text></svg>"}]}, "삼각비": {"short": "각 θ에서 sin = 높이/빗변, cos = 밑변/빗변, tan = 높이/밑변. 30°, 45°, 60°의 값은 외운다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"각 θ를 낀 직각삼각형의 높이, 밑변, 빗변\" class=\"nsvg\"><path d=\"M26.0,138.0 L150.0,138.0 L150.0,48.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><path d=\"M150.0,138.0 L150.0,128.0 L140.0,128.0 L140.0,138.0 Z\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.2\" stroke-linejoin=\"round\"/><text x=\"48\" y=\"132\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">θ</text><text x=\"160\" y=\"96\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">높이</text><text x=\"88\" y=\"156\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">밑변</text><text x=\"70\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">빗변</text><text x=\"250\" y=\"46\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">sin θ = 높이 / 빗변</text><text x=\"250\" y=\"70\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">cos θ = 밑변 / 빗변</text><text x=\"250\" y=\"94\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">tan θ = 높이 / 밑변</text><text x=\"250\" y=\"124\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">30°  45°  60°</text><text x=\"250\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">sin: 1/2  √2/2  √3/2</text><text x=\"250\" y=\"160\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">(cos 은 반대로)</text></svg>", "steps": ["직각삼각형에서 각 θ를 정하고, 변 이름을 붙여요. θ 맞은편이 높이, θ 옆이 밑변, 가장 긴 변이 빗변.", "sin = 높이/빗변, cos = 밑변/빗변, tan = 높이/밑변.", "높이·밑변은 θ를 어디로 잡느냐에 따라 바뀌어요.", "특수각은 외워요: sin 30° = 1/2, sin 45° = √2/2, sin 60° = √3/2 (cos 은 이 순서가 반대). tan 30° = √3/3, tan 45° = 1, tan 60° = √3", "왜 sin 30° 가 1/2 인지는 그림으로 알 수 있어요. 정삼각형을 높이로 반으로 자르면 변이 1 : √3 : 2 인 삼각형이 돼요. 30°의 맞은편은 1, 빗변은 2 → 1/2", "💡 왜 각만 정해지면 값이 같을까요? 각이 같은 직각삼각형은 모두 닮음이고, 닮음이면 변의 비가 같아요. 그래서 삼각형이 커져도 높이/빗변 같은 비는 각에만 따라 정해져요."], "ex": ["밑변 4, 높이 3, 빗변 5 → sin θ = 3/5, cos θ = 4/5, tan θ = 3/4", "sin 60° = √3/2, cos 60° = 1/2 (같은 1 : √3 : 2 삼각형에서)"], "bad": ["θ가 아닌 다른 각을 기준으로 높이·밑변을 잡음", "sin 과 cos 을 바꿔서 외움"], "figs": [{"cap": "왜 sin 30° = 1/2 일까? — 도형을 반으로 잘라 보면 알 수 있어요", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"정삼각형을 반으로 자른 30-60-90 삼각형과 직각이등변삼각형\" class=\"nsvg\"><text x=\"80\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">정삼각형을 반으로</text><path d=\"M36.0,150.0 L124.0,150.0 L80.0,73.8 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"150\" x2=\"80\" y2=\"73.8\" stroke=\"#c62828\" stroke-width=\"2\" stroke-dasharray=\"4\"/><text x=\"80\" y=\"166\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1 + 1 = 2</text><text x=\"52\" y=\"104\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2</text><text x=\"112\" y=\"104\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2</text><text x=\"86\" y=\"112\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">√3</text><text x=\"58\" y=\"144\" font-size=\"10\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">60°</text><text x=\"80\" y=\"98\" font-size=\"10\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">30°</text><text x=\"236\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">직각이등변삼각형</text><path d=\"M196.0,150.0 L276.0,150.0 L196.0,70.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\" s =\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">y = (x − 1)² + 2</text><text x=\"268\" y=\"66\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">y = a(x − p)² + q</text><text x=\"268\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">→ 꼭짓점 (p, q)</text><text x=\"268\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">x − 1 이므로 p = +1</text><text x=\"268\" y=\"132\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">(괄호 안 부호 반대)</text></svg>", "steps": ["y = x² 의 꼭짓점은 (0, 0) 이에요. 이 그림이 기본이에요.", "x 자리에 (x − p)를 넣으면 그래프가 x축 방향으로 p만큼 평행이동해요. (괄호 안 부호와 반대 방향) 그림 ①", "뒤에 + q 를 하면 위로 q 만큼 움직여요. 그래서 꼭짓점이 (0, 0) → (p, q).", "a > 0이면 (x − p)²는 항상 0 이상이고, x = p일 때만 0이에요. 그때 y = q로 가장 작아요. 그림 ②", "일반형 y = x² + 2x − 1 처럼 주어지면 먼저 ‘완전제곱식으로 고치기’ 노트처럼 (x − p)² + q 꼴로 바꿔요.", "a 의 부호에 따라 최대·최솟값이 달라지는 건 ‘이차함수의 최대·최솟값’ 노트에서 다뤄요."], "ex": ["y = (x + 3)² − 4 → p = −3, q = −4 → 꼭짓점 (−3, −4)", "y = −(x − 2)² + 5 → 꼭짓점 (2, 5)"], "bad": ["y = (x − 1)² + 2 의 꼭짓점을 (−1, 2) 로 씀 (괄호 안은 부호 반대)", "y = x² + 2x − 1 에서 −1 을 바로 꼭짓점의 y좌표로 씀 — 먼저 완전제곱식으로 고쳐야 해요"], "figs": [{"cap": "① 왜 꼭짓점이 (p, q) 일까? — y = x² 을 옮긴 거예요", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"y=x²를 오른쪽 1, 위로 2 옮겨 y=(x−1)²+2가 되고 꼭짓점이 (1,2)\" class=\"nsvg\"><line x1=\"44.0\" y1=\"150\" x2=\"224.0\" y2=\"150\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"110\" y1=\"150\" x2=\"110\" y2=\"10.600000000000023\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"232.0\" y=\"164\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"120\" y=\"8.600000000000023\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><line x1=\"80\" y1=\"147\" x2=\"80\" y2=\"153\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"80\" y=\"165\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\"> chor=\"middle\" fill=\"#333\" font-weight=\"normal\">옮기면</text><text x=\"258\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">y = (x − 1)² + 2</text></svg>"}, {"cap": "② 값을 직접 넣어 보면", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"x=−1~3에서 (x−1)² 값 표. x=1에서 0으로 가장 작음\" class=\"nsvg\"><text x=\"160\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(x − 1)² 의 값을 x마다 계산해 보면</text><rect x=\"24\" y=\"34\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"48\" y=\"53\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x = −1</text><rect x=\"24\" y=\"62\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"48\" y=\"81\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(−2)² = 4</text><rect x=\"80\" y=\"34\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"104\" y=\"53\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x = 0</text><rect x=\"80\" y=\"62\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"104\" y=\"81\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(−1)² = 1</text><rect x=\"136\" y=\"34\" width=\"48\" height=\"28\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"160\" y=\"53\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">x = 1</text><rect x=\"136\" y=\"62\" width=\"48\" height=\"28\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"160\" y=\"81\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">(0)² = 0</text><rect x=\"192\" y=\"34\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"216\" y=\"53\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x = 2</text><rect x=\"192\" y=\"62\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"216\" y=\"81\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(1)² = 1</text><rect x=\"248\" y=\"34\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"272\" y=\"53\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x = 3</text><rect x=\"248\" y=\"62\" width=\"48\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1\"/><text x=\"272\" y=\"81\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(2)² = 4</text><text x=\"160\" y=\"118\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">제곱은 항상 0 이상이고, 0이 되는 건 x = 1 일 때뿐이에요.</text><text x=\"160\" y=\"140\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">그래서 x = 1 에서 (x − 1)² + 2 가 가장 작아요 → 값 2</text><text x=\"160\" y=\"164\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">가장 낮은 점 = 꼭짓점 (1, 2)  :  x = p 일 때 y = q</text></svg>"}]}, "완전제곱식으로 고치기": {"short": "x² + bx + c = (x + b/2)² − (b/2)² + c. 그러면 꼭짓점은 (−b/2, c − (b/2)²).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"x²+2x에 1을 더해 한 변이 x+1인 정사각형을 완성하는 그림\" class=\"nsvg\"><rect x=\"34\" y=\"26\" width=\"90\" height=\"90\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"124\" y=\"26\" width=\"30\" height=\"90\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"34\" y=\"116\" width=\"90\" height=\"30\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"124\" y=\"116\" width=\"30\" height=\"30\" fill=\"#fff4cc\" stroke=\"#b8860b\" stroke-width=\"2\"/><text x=\"79\" y=\"76\" font-size=\"18\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">x²</text><text x=\"139\" y=\"76\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"79\" y=\"135\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"139\" y=\"136\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><text x=\"79\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"139\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><text x=\"24\" y=\"74\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"24\" y=\"132\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><text x=\"172\" y=\"44\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">x² + 2x 는 정사각형에서</text><text x=\"172\" y=\"62\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">노란 칸 1 이 빠진 모양</text><text x=\"172\" y=\"92\" font-size=\"13\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">x² + 2x + 1 = (x + 1)²</text><text x=\"172\" y=\"114\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">그래서</text><text x=\"172\" y=\"134\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">x² + 2x = (x + 1)² − 1</text></svg>", "steps": ["목표는 y = x² + 2x − 1 을 y = (x − p)² + q 모양으로 바꾸는 거예요. 그러면 꼭짓점이 바로 (p, q) 로 읽혀요.", "x² + 2x 를 정사각형 모양으로 만들려면 1 이 필요해요. (x + 1)² = x² + 2x + 1 이니까요. (위 그림)", "그래서 x² + 2x = (x + 1)² − 1 로 쓸 수 있어요. 더해 준 1 은 다시 빼야 값이 그대로예요.", "원래 식 뒤의 −1 도 그대로 가져와요. x² + 2x − 1 = (x + 1)² − 1 − 1 = (x + 1)² − 2", "(x − p)² + q 와 비교하면 p = −1, q = −2. 꼭짓점은 (−1, −2) 이고, 꼭짓점의 y좌표는 −2 예요.", "어떤 수를 더할지는 x 계수의 절반의 제곱이에요. x² + 6x → (6÷2)² = 9", "x² 앞에 수가 있으면 먼저 그 수로 묶어요. 2x² + 4x + 1 = 2(x² + 2x) + 1 = 2{(x + 1)² − 1} + 1 = 2(x + 1)² − 1", "💡 왜 (b/2)² 를 더하고 뺄까요? (x + b/2)² = x² + bx + (b/2)² 이라서 x² + bx 에 (b/2)² 를 더하면 딱 완전제곱식이 돼요. 값을 바꾸지 않으려고 같은 수를 다시 빼는 거예요."], "figs": [{"cap": "결과: 꼭짓점 (−1, −2)", "svg": "<svg viewBox=\"0 0 320 180\" \" stroke-width=\"1.5\"/><text x=\"174\" y=\"124\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">(3, 2)</text><circle cx=\"136\" cy=\"148\" r=\"5\" fill=\"#1a56a0\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"126\" y=\"139\" font-size=\"11\" text-anchor=\"end\" fill=\"#1a56a0\" font-weight=\"bold\">(2, 1)</text><text x=\"264\" y=\"40\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">y = (x − 2)² + 1</text><text x=\"264\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">범위 −1 ≤ x ≤ 3</text><text x=\"264\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">최솟값: 꼭짓점이</text><text x=\"264\" y=\"108\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">범위 안 → 1</text><text x=\"264\" y=\"132\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">최댓값: 양 끝 중</text><text x=\"264\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">큰 쪽 → 10</text></svg>"}], "ex": ["y = (x − 1)² + 2 → a = 1 > 0 → 최솟값 2 (x = 1 일 때)", "y = −(x − 2)² + 5 → a < 0 → 최댓값 5 (x = 2 일 때)", "−1 ≤ x ≤ 3 에서 y = (x − 2)² + 1 → 꼭짓점 x = 2 는 범위 안 → 최솟값 1, 양 끝 f(−1)=10, f(3)=2 → 최댓값 10"], "bad": ["범위가 있는데 양 끝 값을 안 보고 꼭짓점 값만 답으로 씀", "꼭짓점의 x좌표가 범위 밖인데 꼭짓점 값을 최솟값으로 씀"]}, "분산": {"short": "분산 = (편차)²의 평균. 편차 = 값 − 평균.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"자료 2,4,6과 평균 4, 편차 −2,0,+2\" class=\"nsvg\"><line x1=\"32\" y1=\"70\" x2=\"288\" y2=\"70\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"40\" y1=\"66\" x2=\"40\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"40\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">0</text><line x1=\"70\" y1=\"66\" x2=\"70\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"70\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"100\" y1=\"66\" x2=\"100\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"100\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"130\" y1=\"66\" x2=\"130\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"130\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"160\" y1=\"66\" x2=\"160\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"160\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">4</text><line x1=\"190\" y1=\"66\" x2=\"190\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"190\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">5</text><line x1=\"220\" y1=\"66\" x2=\"220\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"220\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">6</text><line x1=\"250\" y1=\"66\" x2=\"250\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"250\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">7</text><line x1=\"280\" y1=\"66\" x2=\"280\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"280\" y=\"88\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">8</text><line x1=\"160\" y1=\"30\" x2=\"160\" y2=\"76\" stroke=\"#2e7d32\" stroke-width=\"2\" stroke-dasharray=\"4\"/><text x=\"160\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">평균 4</text><circle cx=\"100\" cy=\"70\" r=\"6\" fill=\"#c62828\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"160\" cy=\"70\" r=\"6\" fill=\"#c62828\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"220\" cy=\"70\" r=\"6\" fill=\"#c62828\" stroke=\"#c62828\" stroke-width=\"1.5\"/><path d=\"M104,58 L156,58\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"130\" y=\"52\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">−2</text><path d=\"M164,58 L216,58\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"190\" y=\"52\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">+2</text><text x=\"160\" y=\"104\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">자료 2, 4, 6 : 평균에서 떨어진 정도 = 편차</text><text x=\"160\" y=\"128\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">편차   −2   0   +2   (그냥 더하면 0 → 제곱해요)</text><text x=\"160\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">제곱   4   0   4   → 합 8</text><text x=\"160\" y=\"170\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">분산 = 8 ÷ 3 = 8/3</text></svg>", "steps": ["평균을 구해요. (2 + 4 + 6) ÷ 3 = 4", "각 값에서 평균을 빼요 (편차). −2, 0, +2", "편차를 그냥 더하면 항상 0 이 돼서 흩어진 정도를 알 수 없어요. 그래서 제곱해요. 4, 0, 4", "제곱한 값들의 평균이 분산이에요. (4 + 0 + 4) ÷ 3 = 8/3", "분산이 클수록 자료가 평균에서 더 멀리 흩어져 있어요.", "💡 왜 편차를 제곱할까요? 편차의 합은 항상 0 이라 그냥 평균 내면 흩어진 정도를 알 수 없어요. 제곱하면 부호가 사라지고 멀리 떨어진 값이 더 크게 반영돼요."], "ex": ["2, 4, 6 → 평균 4, 편차 −2, 0, 2 → 제곱의 합 8 → 분산 8/3", "1, 3, 5, 7 → 평균 4, 편차 −3, −1, 1, 3 → 제곱 9, 1, 1, 9 → 합 20 ÷ 4 = 분산 5"], "bad": ["편차를 제곱하지 않고 평균을 냄 (항상 0)", "제곱의 합을 개수로 나누지 않고 합만 답으로 씀", "평균을 잘못 구한 채로 편차를 계산함 — 평균부터 다시 확인"]}, "근과 계수의 관계": {"short": "ax² + bx + c = 0 의 두 근 α, β → α + β = −b/a, αβ = c/a.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"(x−α)(x−β) 전개와 계수 비교로 α+β=−b, αβ=c\" class=\"nsvg\"><text x=\"160\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">(x − α)(x − β) 를 전개하면</text><text x=\"160\" y=\"50\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">x² − (α + β)x + αβ</text><text x=\"160\" y=\"80\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x² +   b   x +  c   와 같은 식이니까</text><rect x=\"46\" y=\"92\" width=\"100\" height=\"34\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"96\" y=\"114\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">α + β = −b</text><rect x=\"174\" y=\"92\" width=\"100\" height=\"34\" fill=\"#fff4cc\" stroke=\"#b8860b\" stroke-width=\"2\"/><text x=\"224\" y=\"114\" font-size=\"14\" text-anchor=\"middle\" fill=\"#8a5a00\" font-weight=\"bold\">αβ = c</text><text x=\"160\" y=\"150\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">예) x² − 5x + 6 = 0  →  합 5, 곱 6  →  두 근 2, 3</text><text x=\"160\" y=\"170\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(a ≠ 1 이면 a로 나눠서: 합 −b/a, 곱 c/a)</text></svg>", "steps": ["이차방정식의 두 근이 α, β 이면 식은 (x − α)(x − β) = 0 과 같아요.", "전개하면 x² − (α + β)x + αβ = 0.", "x² + bx + c = 0 과 비교하면 b = −(α + β), c = αβ.", "그래서 두 근의 합은 −b, 두 근의 곱은 c. (합에 마이너스가 붙어요)", "x² 앞에 a 가 있으면 먼저 a 로 나눠요: 합 −b/a, 곱 c/a.", "💡 왜 −b/a, c/a 일까요? 두 근이 α, β 이면 a(x − α)(x − β) = a(x² − (α+β)x + αβ) 로 쓸 수 있어요. ax² + bx + c 와 비교하면 −a(α+β) = b, aαβ = c 이므로 α+β = −b/a, αβ = c/a 예요."], "ex": ["x² − 5x + 6 = 0 → 합 −(−5) = 5, 곱 6 → 두 근 2, 3", "x² + 3x − 10 = 0 → 합 −3, 곱 −10 → 두 근 2, −5", "한 근이 2 인 x² − 7x + k = 0 → 합 7 이므로 다른 근 5 → k = 곱 = 10"], "bad": ["두 근의 합을 b 로 씀 (합은 −b)", "a ≠ 1 인데 a 로 나누지 않음", "곱을 c 대신 −c 로 씀"]}, "나머지정리": {"short": "f(x)를 (x − a)로 나눈 나머지 = f(a).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"f(x)=(x−a)Q(x)+R에 x=a를 넣어 R=f(a)\" class=\"nsvg\"><text x=\"160\" y=\"24\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">f(x) 를 (x − a) 로 나누면</text><text x=\"160\" y=\"54\" font-size=\"16\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">f(x) = (x − a)·Q(x) + R</text><text x=\"160\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">양쪽에 x = a 를 넣으면</text><text x=\"160\" y=\"108\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">f(a) = (a − a)·Q(a) + R = 0 + R</text><text x=\"160\" y=\"132\" font-size=\"15\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">→ 나머지 R = f(a)</text><text x=\"160\" y=\"158\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">예) f(x) = x² + 1을 x − 3으로 나누면 → 나머지 f(3) = 10</text><text x=\"160\" y=\"174\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">직접 나눠도 x² + 1 = (x − 3)(x + 3) + 10 ✓</text></svg>", "steps": ["나눗셈은 ‘나누어지는 수 = 나누는 수 × 몫 + 나머지’ 였죠. 식으로 f(x) = (x − a)Q(x) + R. 일차식으로 나누면 나머지는 상수예요. 그래서 R 하나로 써요.", "양쪽에 x = a 를 넣어요. (x − a) 가 0 이 되어서 몫 부분이 통째로 사라져요.", "남는 건 f(a) = R. 그래서 나머지는 f(a) 예요. 직접 나누지 않아도 돼요.", "(x + 2) 로 나눌 땐 x − (−2) 이므로 a = −2 를 넣어요.", "💡 왜 f(a)일까요? 나눗셈 식 f(x) = (x − a)Q(x) + R 에서 x = a 를 넣으면 (x − a) 부분이 0 이 되어 f(a) = R 만 남아요."], "ex": ["f(x) = x² + 1 을 x − 3 으로 나눈 나머지 → f(3) = 9 + 1 = 10", "f(x) = x³ − 2x + 1 을 x + 1 로 나눈 나머지 → f(−1) = −1 + 2 + 1 = 2"], "bad": ["(x + 2) 로 나눌 때 f(2) 를 넣음 (a = −2 예요)", "나머지가 아니라 몫을 구하려고 함"]}, "판별식 D = b² − 4ac": {"short": "D = b² − 4ac 의 부호로 근의 개수를 안다. D > 0 서로 다른 두 실근, D = 0 중근(두 근이 하나로 겹침), D < 0 허근.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"D의 부호에 따라 포물선이 x축과 두 점에서 만나거나 접하거나 만나지 않음\" class=\"nsvg\"><line x1=\"9\" y1=\"118\" x2=\"101\" y2=\"118\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"107\" y=\"122\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><path d=\"M10.8,93.4 L13.0,97.1 L15.2,100.6 L17.4,103.9 L19.6,107.0 L21.9,109.9 L24.1,112.6 L26.3,115.1 L28.5,117.5 L30.7,119.6 L32.9,121.6 L35.1,123.4 L37.3,125.0 L39.5,126.4 L41.7,127.6 L44.0,128.7 L46.2,129.5 L48.4,130.2 L50.6,130.6 L52.8,130.9 L55.0,131.0 L57.2,130.9 L59.4,130.6 L61.6,130.2 L63.8,129.5 L66.0,128.7 L68.3,127.6 L70.5,126.4 L72.7,125.0 L74.9,123.4 L77.1,121.6 L79.3,119.6 L81.5,117.5 L83.7,115.1 L85.9,112.6 L88.2,109.9 L90.4,107.0 L92.6,103.9 L94.8,100.6 L97.0,97.1 L99.2,93.4\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"114\" y1=\"118\" x2=\"206\" y2=\"118\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"212\" y=\"122\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><path d=\"M115.8,80.4 L118.0,84.1 L120.2,87.6 L122.4,90.9 L124.6,94.0 L126.8,96.9 L129.1,99.6 L131.3,102.1 L133.5,104.5 L135.7,106.6 L137.9,108.6 L140.1,110.4 L142.3,112.0 L144.5,113.4 L146.7,114.6 L148.9,115.7 L151.2,116.5 L153.4,117.2 L155.6,117.6 L157.8,117.9 L160.0,118.0 L162.2,117.9 L164.4,117.6 L166.6,117.2 L168.8,116.5 L171.1,115.7 L173.3,114.6 L175.5,113.4 L177.7,112.0 L179.9,110.4 L182.1,108.6 L184.3,106.6 L186.5,104.5 L188.7,102.1 L190.9,99.6 L193.2,96.9 L195.4,94.0 L197.6,90.9 L199.8,87.6 L202.0,84.1 L204.2,80.4\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"219\" y1=\"118\" x2=\"311\" y2=\"118\" stroke=\"#333\" stroke-width=\"1.2\"/><text x=\"317\" y=\"122\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><path d=\"M220.8,67.4 L223.0,71.1 L225.2,74.6 L227.4,77.9 L229.6,81.0 L231.8,83.9 L234.1,86.6 L236.3,89.1 L238.5,91.5 L240.7,93.6 L242.9,95.6 L245.1,97.4 L247.3,99.0 L249.5,100.4 L251.7,101.6 L253.9,102.7 L256.2,103.5 L258.4,104.2 L260.6,104.6 L262.8,104.9 L265.0,105.0 L267.2,104.9 L269.4,104.6 L271.6,104.2 L273.8,103.5 L276.1,102.7 L278.3,101.6 L280.5,100.4 L282.7,99.0 L284.9,97.4 L287.1,95.6 L289.3,93.6 L291.5,91.5 L293.7,89.1 L295.9,86.6 L298.1,83.9 L300.4,81.0 L302.6,77.9 L304.8,74.6 L307.0,71.1 L309.2,67.4\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><circle cx=\"29\" cy=\"118\" r=\"4.5\" fill=\"#1a56a0\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"81\" cy=\"118\" r=\"4.5\" fill=\"#1a56a0\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"160\" cy=\"118\" r=\"4.5\" fill=\"#2e7d32\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><text x=\"55\" y=\"28\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">D > 0</text><text x=\"55\" y=\"46\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">x축과 두 점</text><text x=\"55\" y=\"62\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">→ 서로 다른 두 근</text><text x=\"160\" y=\"28\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">D = 0</text><text x=\"160\" y=\"46\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">x축에 닿기만</text><text x=\"160\" y=\"62\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">→ 중근(근 1개)</text><text x=\"265\" y=\"28\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">D < 0</text><text x=\"265\" y=\"46\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">x축과 안 만남</text><text x=\"265\" y=\"62\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">→ 실근 없음</text><text x=\"160\" y=\"148\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">근의 공식  x = (−b ± √D) / 2a</text><text x=\"160\" y=\"168\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">√D 가 ± 두 개 → 근 2개 / D=0 이면 하나 / D<0 이면 실수가 아님</text></svg>", "steps": ["먼저 근의 공식이 어디서 나오는지 봐요. ax² + bx + c = 0 의 양변을 a로 나누면 x² + (b/a)x + c/a = 0 이에요.", "x의 항을 완전제곱식으로 만들어요. 일차항 계수의 절반 b/2a 를 제곱해 양변에 더하면 (x + b/2a)² = b²/4a² − c/a = (b² − 4ac)/4a² 가 돼요.", "양변에 제곱근을 씌우면 x + b/2a = ± √(b² − 4ac) / 2a, 따라서 x = (−b ± √(b² − 4ac)) / 2a. 이게 근의 공식이에요.", "두 근은 x = −b/2a + √D/2a 와 x = −b/2a − √D/2a 예요. 즉 가운데 −b/2a 에서 좌우로 √D/2a 만큼 벌어진 두 점이에요. 이 √ 안의 b² − 4ac 가 판별식 D예요.", "D > 0 이면 √D 가 양수라서 좌우로 벌어진 서로 다른 두 실근이 나와요. 그래프가 x축과 두 점에서 만나요.", "D = 0 이면 √D = 0 이라 벌어지는 폭이 0이에요. 두 근이 −b/2a 한 점으로 겹쳐요 → 중근. 식도 a(x + b/2a)² = 0 인 완전제곱식이라 그래프가 x축에 닿기만 해요.", "D < 0이면 √ 안이 음수라서 실근은 없고 서로 다른 두 허근을 가져요. 그래프는 x축과 만나지 않아요.", "‘중근을 가질 조건’ 문제는 D = 0 으로 식을 세워요. x² + kx + 9 = 0 이 중근이면 k² − 36 = 0 → k = ±6 이에요.", "근을 직접 구하지 않아도 ‘몇 개인지’를 D 하나로 알 수 있어요."], "ex": ["x² + 4x + 4 = 0 → D = 16 − 16 = 0 → 중근 (x = −2, 식은 (x + 2)² = 0)", "x² − 2x − 3 = 0 → D = 4 + 12 = 16 > 0 → 서로 다른 두 근", "x² + x + 1 = 0 → D = 1 − 4 = −3 < 0 → 실근 없음", "x² + kx + 9 = 0 이 중근 → D = k² − 36 = 0 → k = 6 또는 −6"], "bad": ["c 가 음수일 때 −4ac 의 부호를 틀림 (−4 × 1 × (−3) = +12)", "b 가 음수일 때 b² 을 음수로 계산함 ((−2)² = 4)", "중근 조건에서 k = 6 하나만 쓰고 −6 을 빠뜨림 (k² = 36 이면 ±6)"]}, "순열 (nPr)": {"short": "n개 중 r개를 줄 세우기. nPr = n × (n−1) × … (r개를 곱함).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"5명 중 1등 5가지, 2등 4가지\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">5명 중 2명을 뽑아 1등·2등으로 세우기</text><circle cx=\"52\" cy=\"52\" r=\"16\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"52\" y=\"57\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">A</text><circle cx=\"106\" cy=\"52\" r=\"16\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"106\" y=\"57\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">B</text><circle cx=\"160\" cy=\"52\" r=\"16\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"57\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">C</text><circle cx=\"214\" cy=\"52\" r=\"16\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"214\" y=\"57\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">D</text><circle cx=\"268\" cy=\"52\" r=\"16\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"268\" y=\"57\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">E</text><text x=\"10\" y=\"56\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">1등</text><text x=\"160\" y=\"92\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">A가 1등이면 2등 후보는 남은 4명</text><circle cx=\"70\" cy=\"118\" r=\"14\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"70\" y=\"123\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">B</text><circle cx=\"124\" cy=\"118\" r=\"14\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"124\" y=\"123\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">C</text><circle cx=\"178\" cy=\"118\" r=\"14\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"178\" y=\"123\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">D</text><circle cx=\"232\" cy=\"118\" r=\"14\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"232\" y=\"123\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">E</text><text x=\"10\" y=\"122\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">2등</text><text x=\"160\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1등 5가지 × (그때마다) 2등 4가지</text><text x=\"160\" y=\"174\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5P2 = 5 × 4 = 20</text></svg>", "steps": ["순열은 ‘뽑아서 순서대로 줄 세우는’ 경우의 수예요. 순서가 다르면 다른 경우예요.", "1등 자리에는 5명 모두 올 수 있어요 → 5가지.", "1등을 정하면 2등 자리에는 남은 4명 → 4가지.", "각 경우에 다음 자리가 이어지니까 곱해요. 5 × 4 = 20.", "그래서 nPr = n × (n − 1) × … 처럼 r개를 곱해요. (n개 전부 곱하는 게 아니에요)", "💡 왜 곱할까요? 첫 자리에 n가지, 그 각각에 대해 둘째 자리에 (n−1)가지… 처럼 자리마다 경우가 이어지므로 곱의 법칙으로 n × (n−1) × … 를 r개 곱해요."], "ex": ["5P2 = 5 × 4 = 20", "3P3 = 3 × 2 × 1 = 6 (3명을 한 줄로 세우는 방법)", "4명 중 회장·부회장 뽑기 → 4P2 = 4 × 3 = 12"], "bad": ["5P2 를 5 × 4 × 3 × 2 × 1 로 계산함 (r = 2 개만 곱해요)", "순서가 중요하지 않은 상황에 순열을 씀 → 조합이에요"]}, "조합 (nCr)": {"short": "n개 중 r개를 순서 없이 고르기. nCr = nPr ÷ r!.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"5명 중 2명을 순서 없이 고르는 10가지\" class=\"nsvg\"><text x=\"160\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">5명 중 2명 고르기 (순서 없음)</text><rect x=\"10\" y=\"33\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"34\" y=\"51\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">AB</text><rect x=\"70\" y=\"33\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"94\" y=\"51\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">AC</text><rect x=\"130\" y=\"33\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"154\" y=\"51\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">AD</text><rect x=\"190\" y=\"33\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"214\" y=\"51\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">AE</text><rect x=\"250\" y=\"33\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"274\" y=\"51\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">BC</text><rect x=\"10\" y=\"67\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"34\" y=\"85\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">BD</text><rect x=\"70\" y=\"67\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"94\" y=\"85\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">BE</text><rect x=\"130\" y=\"67\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"154\" y=\"85\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">CD</text><rect x=\"190\" y=\"67\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"214\" y=\"85\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">CE</text><rect x=\"250\" y=\"67\" width=\"48\" height=\"26\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.6\"/><text x=\"274\" y=\"85\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">DE</text><text x=\"160\" y=\"122\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">순서를 따지면 AB 와 BA 가 달라서 5P2 = 20</text><text x=\"160\" y=\"142\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">순서를 안 따지면 AB = BA → 2개씩 겹침 (2! = 2)</text><text x=\"160\" y=\"166\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5C2 = 20 ÷ 2 = 10</text></svg>", "steps": ["조합은 ‘그냥 고르기’예요. 순서가 달라도 같은 경우예요. (AB 와 BA 는 같은 팀)", "먼저 순서를 따지고 세어요. 5P2 = 20", "같은 팀이 순서만 바뀐 채로 2번씩(2! = 2) 세어졌어요.", "그래서 2 로 나눠요. 5C2 = 20 ÷ 2 = 10", "r개를 고르면 r! 번씩 겹쳐요: nCr = nPr ÷ r!", "💡 왜 r! 로 나눌까요? 순서를 따지면 nPr 인데, 같은 r개를 뽑아도 배열 순서만 다른 것이 r! 가지씩 중복돼요. 순서를 무시하려면 그만큼 나눠요."], "ex": ["5C2 = (5 × 4) ÷ (2 × 1) = 10", "5C3 = (5 × 4 × 3) ÷ (3 × 2 × 1) = 10", "8명 중 대표 3명 뽑기(역할 구분 없음) → 8C3 = 56"], "bad": ["순서가 있는 상황(회장·부회장)에 조합을 씀", "nPr 을 구하고 r! 로 나누는 걸 빼먹음"]}, "로그 logₐ b": {"short": "logₐ b = x ⇔ aˣ = b. (a를 몇 제곱하면 b가 되나)", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2를 세 번 곱하면 8이므로 log₂8=3\" class=\"nsvg\"><text x=\"160\" y=\"22\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2 를 몇 번 곱하면 8 이 될까?</text><circle cx=\"40\" cy=\"70\" r=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"40\" y=\"75\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2⁰=1</text><circle cx=\"120\" cy=\"70\" r=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"120\" y=\"75\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2¹=2</text><circle cx=\"200\" cy=\"70\" r=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"200\" y=\"75\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2²=4</text><circle cx=\"280\" cy=\"70\" r=\"22\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"280\" y=\"75\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2³=8</text><line x1=\"63\" y1=\"70\" x2=\"97\" y2=\"70\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"80.0\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×2</text><line x1=\"143\" y1=\"70\" x2=\"177\" y2=\"70\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160.0\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×2</text><line x1=\"223\" y1=\"70\" x2=\"257\" y2=\"70\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"240.0\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×2</text><text x=\"160\" y=\"112\" font-size=\"16\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">곱한 횟수 = 3  →  log₂ 8 = 3</text><rect x=\"70\" y=\"128\" width=\"180\" height=\"34\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"150\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2³ = 8  ⇔  log₂ 8 = 3</text></svg>", "steps": ["logₐ b는 'a를 몇 제곱하면 b가 되나'예요. 그래서 0, 음수, 분수도 나와요. (2⁻¹ = 1/2 → log₂(1/2) = −1)", "2 × 2 × 2 = 8 이므로 2 를 3번 곱하면 8. 그래서 log₂ 8 = 3.", "2³ = 8 과 log₂ 8 = 3 은 같은 말이에요. aˣ = b ⇔ x = logₐ b", "a 는 밑(곱하는 수), b 는 진수(만들려는 수). 밑이 없으면 10 이에요. log 100 = 2", "밑은 양수이면서 1이 아니어야 하고, 진수는 양수여야 해요.", "💡 왜 지수를 묻는 말일까요? 2³ = 8 에서 ‘2를 몇 제곱하면 8?’의 답 3 을 log₂ 8 = 3 으로 써요. 로그는 지수를 구하기 위해 만든 기호예요."], "ex": ["log₃ 9 = 2 (3² = 9)", "log₅ 1 = 0 (5⁰ = 1)", "log₂ (1/2) = −1 (2⁻¹ = 1/2)"], "bad": ["밑과 진수를 거꾸로 읽음 (log₂ 8 은 ‘2를 몇 번 곱해 8?’)", "log₂ 8 = 2 × 8 처럼 곱셈으로 착각함"]}, "등차수열의 합": {"short": "Sₙ = n(첫째항 + 끝항) ÷ 2.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"1부터 10까지를 거꾸로 써서 위아래 합이 11로 같음\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1 + 2 + … + 10 을 거꾸로도 써서 더해 봐요</text><rect x=\ xt-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">8</text><rect x=\"206\" y=\"56\" width=\"24\" height=\"24\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.3\"/><text x=\"218\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><text x=\"218\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">11</text><rect x=\"234\" y=\"28\" width=\"24\" height=\"24\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.3\"/><text x=\"246\" y=\"45\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">9</text><rect x=\"234\" y=\"56\" width=\"24\" height=\"24\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.3\"/><text x=\"246\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><text x=\"246\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">11</text><rect x=\"262\" y=\"28\" width=\"24\" height=\"24\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.3\"/><text x=\"274\" y=\"45\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">10</text><rect x=\"262\" y=\"56\" width=\"24\" height=\"24\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"1.3\"/><text x=\"274\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><text x=\"274\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">11</text><text x=\"160\" y=\"120\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">위아래 짝의 합이 전부 11 (10 개)</text><text x=\"160\" y=\"142\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">두 번 더한 합 = 11 × 10 = 110</text><text x=\"160\" y=\"164\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">원래 합 = 110 ÷ 2 = 55   →   Sₙ = n(첫째항 + 끝항) ÷ 2</text></svg>", "steps": ["수열을 한 번 쓰고, 그 아래에 거꾸로 한 번 더 써요.", "위아래로 짝을 지어 더하면 모든 짝의 합이 똑같아요. (첫째항 + 끝항 = 11)", "짝이 n 개(여기선 10개)이므로 두 번 더한 합 = 11 × 10", "같은 수열을 두 번 더한 거라서 2 로 나눠요. 합 = 11 × 10 ÷ 2 = 55", "공식으로 Sₙ = n(첫째항 + 끝항) ÷ 2.", "💡 왜 (첫째+끝)×n÷2 일까요? 수열을 한 번은 앞에서, 한 번은 뒤에서 써서 더하면 위아래 짝의 합이 모두 (첫째+끝)으로 같고 n쌍이에요. 그건 합을 2번 센 것이라 2로 나눠요. (가우스의 1+2+…+100)"], "ex": ["1 + 2 + … + 100 = 100 × (1 + 100) ÷ 2 = 5050", "3 + 5 + 7 + 9 + 11 = 5 × (3 + 11) ÷ 2 = 35"], "bad": ["마지막에 ÷ 2 를 빼먹음", "항의 개수 n 을 잘못 셈 — (끝항 − 첫째항) ÷ 공차 + 1 개예요"]}, "등비수열의 합": {"short": "Sₙ = a(rⁿ − 1)/(r − 1)  (r ≠ 1).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"S와 2S를 빼서 가운데 항이 지워지는 과정\" class=\"nsvg\"><text x=\"30\" y=\"30\" font-size=\"15\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">S</text><text x=\"60\" y=\"30\" font-size=\"15\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">=  1 + 2 + 4 + 8</text><text x=\"22\" y=\"62\" font-size=\"15\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">2S</text><text x=\"60\" y=\"62\" font-size=\"15\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"normal\">=       2 + 4 + 8 + 16</text><line x1=\"20\" y1=\"74\" x2=\"300\" y2=\"74\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"14\" y=\"100\" font-size=\"14\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">2S − S</text><text x=\"94\" y=\"100\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">= 16 − 1  (가운데가 모두 지워져요)</text><text x=\"160\" y=\"132\" font-size=\"16\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">S = 15</text><text x=\"160\" y=\"158\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">일반: rS − S = a·rⁿ − a  →  S = a(rⁿ − 1) / (r − 1)</text></svg>", "steps": ["합을 S = 1 + 2 + 4 + 8 이라고 해요. (공비 2)", "S 의 양쪽에 공비 2 를 곱해요. 2S = 2 + 4 + 8 + 16 (한 칸씩 밀려요)", "2S 에서 S 를 빼면 가운데 항 2, 4, 8 이 모두 지워지고 16 − 1 만 남아요. S = 15", "일반적으로 첫째항 a, 공비 r, n개이면 (r − 1)S = a(rⁿ − 1). 그래서 S = a(rⁿ − 1) / (r − 1)", "공비가 1 이면 이 식의 분모가 0 이라서 쓰지 않고, 그냥 a × n 이에요.", "💡 harray=\"4\"/><text x=\"130.0\" y=\"136\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">넓이</text><text x=\"70.0\" y=\"57.599999999999994\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">y = 2x</text><text x=\"250\" y=\"36\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">① 도형으로</text><text x=\"250\" y=\"54\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2 × 4 ÷ 2 = 4</text><text x=\"250\" y=\"84\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">② 정적분으로</text><text x=\"250\" y=\"102\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">∫₀² 2x dx</text><text x=\"250\" y=\"120\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">= [x²]₀² = 4 − 0</text><text x=\"250\" y=\"142\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">= 4  (같아요!)</text></svg>", "steps": ["f(x) ≥ 0이면 ∫ₐᵇ f(x)dx는 x = a부터 b까지 그래프와 x축 사이의 넓이예요. 그래프가 x축 아래에 있으면 값이 음수가 돼요.", "먼저 미분하면 f(x) 가 되는 식 F(x) 를 찾아요. (xⁿ → xⁿ⁺¹ ÷ (n + 1))", "F(b) − F(a) 를 계산해요. 위(b)에서 아래(a)를 빼요.", "검산: y = 2x 를 0 부터 2 까지 보면 밑변 2, 높이 4 인 삼각형이라 넓이 4. 정적분 값 4 와 같아요.", "💡 왜 F(b) − F(a) 일까요? F′ = f 이면 F 는 f 가 쌓인 양이에요. 0 부터 b 까지 쌓인 양에서 0 부터 a 까지 쌓인 양을 빼면 a 에서 b 까지 쌓인 양, 즉 넓이가 남아요. xⁿ 의 적분이 xⁿ⁺¹/(n+1) 인 건 미분해서 xⁿ 이 되는 걸 거꾸로 찾은 거예요."], "ex": ["∫₀² 2x dx → F = x² → 4 − 0 = 4", "∫₀³ x² dx → F = x³/3 → 27/3 − 0 = 9", "∫₁² 3 dx → F = 3x → 6 − 3 = 3"], "bad": ["F(a) − F(b) 로 순서를 바꿈", "xⁿ → xⁿ⁺¹ 로만 하고 (n + 1) 로 나누지 않음"]}, "이차부등식과 그래프": {"short": "α < β 일 때 (x − α)(x − β) < 0 → α < x < β, (x − α)(x − β) > 0 → x < α 또는 x > β.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"y=(x−1)(x−4)의 그래프. 1과 4 사이는 x축 아래\" class=\"nsvg\"><line x1=\"9.600000000000001\" y1=\"76\" x2=\"227.2\" y2=\"76\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"30\" y1=\"112\" x2=\"30\" y2=\"16\" stroke=\"#333\" stroke-width=\ nchor=\"middle\" fill=\"#333\" font-weight=\"normal\">음수인 구간(아래)</text><text x=\"262\" y=\"70\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">= 두 근 사이</text><text x=\"270\" y=\"74\" font-size=\"1\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\"></text><text x=\"262\" y=\"102\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">> 0 이면 위쪽</text><text x=\"262\" y=\"120\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">= 두 근 바깥</text><text x=\"262\" y=\"138\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">x < 1 또는 x > 4</text></svg>", "steps": ["왼쪽을 인수분해해서 두 근 α, β 를 찾아요. (α < β) 여기선 1 과 4.", "y = (x − α)(x − β) 는 아래로 볼록한 포물선이고, x축과 α, β 에서 만나요.", "< 0 이면 ‘그래프가 x축 아래에 있는 구간’이에요 → 두 근 사이: α < x < β.", "> 0 이면 ‘그래프가 x축 위에 있는 구간’이에요 → 두 근 바깥: x < α 또는 x > β.", "≤, ≥ 이면 두 근(끝점)도 포함해요.", "💡 왜 이렇게 나뉠까요? a > 0 인 포물선은 두 근 사이에서 x축 아래(값 < 0), 바깥에서 x축 위(값 > 0)에 있어요. 그래서 < 0 이면 두 근 사이, > 0 이면 두 근 바깥이에요."], "ex": ["(x − 1)(x − 4) < 0 → 1 < x < 4", "x² − 5x + 6 > 0 → (x − 2)(x − 3) > 0 → x < 2 또는 x > 3", "x² − 4 ≤ 0 → (x + 2)(x − 2) ≤ 0 → −2 ≤ x ≤ 2"], "bad": ["< 0 인데 두 근 바깥으로 답함 (또는 반대)", "≤ 인데 끝점을 빼 버림", "x² 의 계수가 음수인데 그대로 풂 — 양변에 −1 을 곱하고 부등호 방향을 바꿔요"]}, "미분계수 f′(a)": {"short": "f′(a) = x = a 에서의 기울기. xⁿ → n·xⁿ⁻¹, 상수 → 0.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"y=x²의 (1,1)에서의 접선. 기울기 2\" class=\"nsvg\"><line x1=\"28.0\" y1=\"140\" x2=\"160.0\" y2=\"140\" stroke=\"#333\" stroke-width=\"1.5\"/><line x1=\"60\" y1=\"140\" x2=\"60\" y2=\"10\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"168.0\" y=\"154\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">x</text><text x=\"70\" y=\"8\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">y</text><line x1=\"100\" y1=\"137\" x2=\"100\" y2=\"143\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"100\" y=\"155\" font-size=\"11\" text
