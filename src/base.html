e x1=\"84\" y1=\"92\" x2=\"109.11407148351577\" y2=\"85.27070482733446\" stroke=\"#c62828\" stroke-width=\"4.5\"/><line x1=\"84\" y1=\"92\" x2=\"84.0\" y2=\"128.0\" stroke=\"#1a56a0\" stroke-width=\"3\"/><circle cx=\"84\" cy=\"92\" r=\"3.5\" fill=\"#333\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"170\" y=\"44\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">짧은바늘 = 시</text><text x=\"170\" y=\"64\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">2 와 3 사이 → 2시</text><text x=\"170\" y=\"94\" font-size=\"13\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">긴바늘 = 분</text><text x=\"170\" y=\"114\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">6 을 가리킴 → 5 × 6 = 30분</text><text x=\"170\" y=\"150\" font-size=\"16\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">2시 30분</text></svg>", "steps": ["짧은바늘은 ‘시’, 긴바늘은 ‘분’을 알려 줘요. 짧고 굵은 바늘부터 먼저 봐요.", "짧은바늘이 숫자 사이에 있으면 방금 지나온 숫자가 시예요. (2와 3 사이 → 2시, 12와 1 사이 → 12시)", "긴바늘은 숫자 한 칸이 5분이에요. 6 을 가리키면 5 × 6 = 30분이에요. 12 를 가리키면 0분(정각)이에요.", "시와 분을 이어서 읽어요 → 2시 30분."], "ex": ["짧은바늘 3, 긴바늘 12 → 3시 (정각)", "짧은바늘 4 와 5 사이, 긴바늘 3 → 4시 15분 (3 × 5)", "60분 = 1시간 → 80분 = 1시간 20분"], "bad": ["긴바늘이 가리키는 숫자를 그대로 분으로 읽음 (6 → 6분 ✗, 30분 ✓)", "시를 읽을 때 큰 쪽 숫자로 읽음 (2 와 3 사이인데 3시라고 함)"]}, "등식의 성질": {"short": "= 양쪽에 같은 수를 더하거나 빼거나 곱하거나 나눠도 성립 (0으로 나누기 제외).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"□+4=9에서 양쪽에서 4를 빼면 □=5\" class=\"nsvg\"><text x=\"160\" y=\"18\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">□ + 4 = 9</text><rect x=\"30\" y=\"32\" width=\"100\" height=\"32\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"80\" y=\"54\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">□ + 4</text><text x=\"160\" y=\"54\" font-size=\"18\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">=</text><rect x=\"190\" y=\"32\" width=\"100\" height=\"32\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"240\" y=\"54\" font-size=\"15\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">9</text><line x1=\"80\" y1=\"68\" x2=\"80\" y2=\"98\" stroke=\"#c62828\" stroke-width=\"2.5\"/><path d=\"M77.0,91.7 L80,98 L83.0,91.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.5\"/><line x1=\"240\" y1=\"68\" x2=\"240\" y2=\"98\" stroke=\"#c62828\" stroke-width=\"2.5\"/><path d=\"M237.0,91.7 L240,98 L243.0,91.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2.5\"/><text x=\"160\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">양쪽에서 4 빼기</text><rect x=\"30\" y=\"102\" width=\"100\" height=\"32\" fill=\"#fff4cc\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"80\" y=\"124\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">□</text><text x=\"160\" y=\"124\" font-size=\"18\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">=</text><rect x=\"190\" y=\"102\" width=\"100\" height=\"32\" fill=\"#fff4cc\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"240\" y=\"124\" font-size=\"15\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">5</text><text x=\"160\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">저울처럼 양쪽에 같은 일을 하면 계속 평형!</text></svg>", "steps": ["등호(=)는 양쪽이 같다는 뜻이에요. 양팔 저울이 수평인 모습과 같아요.", "한쪽에만 뭔가를 하면 저울이 기울어요. 양쪽에 똑같이 더하거나 빼거나 곱하거나 나누면 계속 같아요.", "□ 를 혼자 남기고 싶으면 □ 옆의 수를 지우는 반대 계산을 양쪽에 해요. + 4 를 지우려면 양쪽에서 4 를 빼요.", "(0 으로 나누는 것은 안 돼요.)", "💡 왜 같은 수를 해도 될까요? 양팔 저울이 평형일 때 양쪽에 같은 무게를 더하거나 덜어도 평형이에요. 0 으로 나누면 값이 정해지지 않아 안 돼요."], "ex": ["□ + 4 = 9 → 양쪽에서 4 빼기 → □ = 5", "□ − 3 = 8 → 양쪽에 3 더하기 → □ = 11", "□ × 2 = 14 → 양쪽을 2 로 나누기 → □ = 7"], "bad": ["왼쪽에서만 4를 뺌 (□ + 4 − 4 = 9 → □ = 9 ✗). 오른쪽에서도 빼야 □ = 5예요.", "반대 계산을 안 함 (□ + 4 = 9 에서 양쪽에 4 를 더함)"]}, "수의 규칙 찾기": {"short": "이웃한 수의 차(또는 몇 배)를 찾아 같은 규칙을 한 번 더 적용.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2,5,8,11은 3씩 커지고 3,6,12,24는 2배씩 커짐\" class=\"nsvg\"><text x=\"30\" y=\"22\" font-size=\"13\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">2, 5, 8, 11, ?</text><circle cx=\"34\" cy=\"58\" r=\"18\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"34\" y=\"63\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><text x=\"64\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+3</text><path d=\"M44,44 Q64,32 84,44\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><circle cx=\"94\" cy=\"58\" r=\"18\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"94\" y=\"63\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">5</text><text x=\"124\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+3</text><path d=\"M104,44 Q124,32 144,44\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><circle cx=\"154\" cy=\"58\" r=\"18\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"154\" y=\"63\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">8</text><text x=\"184\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+3</text><path d=\"M164,44 Q184,32 204,44\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><circle cx=\"214\" cy=\"58\" r=\"18\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"214\" y=\"63\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">11</text><text x=\"244\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">+3</text><path d=\"M224,44 Q244,32 264,44\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><circle cx=\"274\" cy=\"58\" r=\"18\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"274\" y=\"63\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">?</text><text x=\"160\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">이웃한 두 수의 차가 모두 3  →  다음은 11 + 3 = 14</text><circle cx=\"48\" cy=\"134\" r=\"17\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"48\" y=\"139\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">3</text><text x=\"83\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">×2</text><path d=\"M58,121 Q(83, 108) 108,121\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"118\" cy=\"134\" r=\"17\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"118\" y=\"139\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">6</text><text x=\"153\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">×2</text><path d=\"M128,121 Q(153, 108) 178,121\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"188\" cy=\"134\" r=\"17\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"188\" y=\"139\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">12</text><text x=\"223\" y=\"118\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">×2</text><path d=\"M198,121 Q(223, 108) 248,121\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"258\" cy=\"134\" r=\"17\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"258\" y=\"139\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">24</text><text x=\"160\" y=\"170\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">몇 배씩이면 곱하기 규칙 → 다음은 48</text></svg>", "steps": ["이웃한 두 수를 비교해서 어떻게 변하는지 찾아요. 먼저 뺄셈(차)을 해 봐요.", "차가 모두 같으면 그 수씩 더하는 규칙이에요. 2, 5, 8, 11 → 3씩 커져요.", "차가 다 다르면 몇 배인지 봐요. 3, 6, 12, 24 → 2배씩이에요.", "찾은 규칙을 마지막 수에 한 번 더 적용하면 다음 수가 나와요.", "💡 왜 차를 볼까요? 규칙이 있는 수열은 이웃한 항 사이의 변화(차 또는 배)가 일정하거나 규칙적이에요. 그 변화를 찾으면 다음 수를 예측할 수 있어요."], "ex": ["2, 4, 6, 8 → 2씩 커짐 → 다음은 10", "20, 17, 14, 11 → 3씩 작아짐 → 다음은 8", "3, 6, 12, 24 → 2배씩 → 다음은 48"], "bad": ["처음 두 수만 보고 규칙을 정함 (끝까지 맞는지 확인해야 해요)", "커지는 규칙인데 작아지는 규칙으로 계산함"]}, "문장을 식으로 세우기": {"short": "구하는 것을 x로 놓고, 문장을 그대로 식으로 옮긴다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"어떤 수에 3을 더하면 10을 x+3=10으로 옮김\" class=\"nsvg\"><text x=\"160\" y=\"18\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">어떤 수에 3 을 더하면 10</text><rect x=\"30\" y=\"32\" width=\"84\" height=\"30\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"72.0\" y=\"52\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">어떤 수</text><line x1=\"72.0\" y1=\"64\" x2=\"72.0\" y2=\"90\" stroke=\"#c62828\" stroke-width=\"2\"/><path d=\"M69.0,83.7 L72.0,90 L75.0,83.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"30\" y=\"92\" width=\"84\" height=\"30\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"72.0\" y=\"113\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">x</text><rect x=\"120\" y=\"32\" width=\"84\" height=\"30\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"162.0\" y=\"52\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">에 3 을 더하면</text><line x1=\"162.0\" y1=\"64\" x2=\"162.0\" y2=\"90\" stroke=\"#1a56a0\" stroke-width=\"2\"/><path d=\"M159.0,83.7 L162.0,90 L165.0,83.7\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"120\" y=\"92\" width=\"84\" height=\"30\" fill=\"#fff4cc\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"162.0\" y=\"113\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">+ 3</text><rect x=\"230\" y=\"32\" width=\"60\" height=\"30\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"1.8\"/><text x=\"260.0\" y=\"52\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">10</text><line x1=\"260.0\" y1=\"64\" x2=\"260.0\" y2=\"90\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M257.0,83.7 L260.0,90 L263.0,83.7\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"230\" y=\"92\" width=\"60\" height=\"30\" fill=\"#fff4cc\" stroke=\"#2e7d32\" stroke-width=\"1.8\"/><text x=\"260.0\" y=\"113\" font-size=\"15\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">= 10</text><text x=\"160\" y=\"148\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">x + 3 = 10  →  x = 10 − 3 = 7</text><text x=\"160\" y=\"170\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">검산: 7 + 3 = 10 ✓</text></svg>", "steps": ["모르는 것(구하는 것)을 문자 x(또는 □)로 정해요. ‘어떤 수’ 가 x 예요.", "문장을 앞에서부터 하나씩 식으로 옮겨요. ‘어떤 수에 3 을 더하면’ → x + 3, ‘10 이다’ → = 10.", "식을 풀어요. x + 3 = 10 에서 양쪽에서 3 을 빼면 x = 7.", "구한 값을 문장에 넣어서 맞는지 확인해요. 7 에 3 을 더하면 10 ✓", "💡 왜 x 로 놓을까요? 모르는 것을 문자로 두면 문장 속 관계(‘~보다 3 큰’, ‘~의 2배’)를 그대로 식으로 옮겨 방정식으로 풀 수 있어요."], "ex": ["어떤 수에 3 을 더하면 10 → x + 3 = 10 → x = 7", "어떤 수의 2배는 14 → 2x = 14 → x = 7", "사과 x개에서 3개를 먹었더니 5개 → x − 3 = 5 → x = 8"], "bad": ["‘더하면’ 인데 빼는 식을 세움", "x 가 무엇을 뜻하는지 정하지 않고 시작함 (먼저 ‘구하는 것 = x’ 로 정해요)"]}, "곱셈": {"short": "같은 수를 여러 번 더한 것. 두 자리 수는 십의 자리·일의 자리로 나눠 곱한 뒤 더함.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"23×3을 20×3과 3×3으로 나눠 60과 9를 더함\" class=\"nsvg\"><text x=\"160\" y=\"18\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">23 × 3 = (20 + 3) × 3</text><rect x=\"30\" y=\"34\" width=\"170\" height=\"72\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><rect x=\"200\" y=\"34\" width=\"34\" height=\"72\" fill=\"#e6f4ea\" stroke=\"#2e7d32\" stroke-width=\"2\"/><line x1=\"30\" y1=\"58\" x2=\"234\" y2=\"58\" stroke=\"#9aa0a8\" stroke-width=\"1\" stroke-dasharray=\"3\"/><line x1=\"30\" y1=\"82\" x2=\"234\" y2=\"82\" stroke=\"#9aa0a8\" stroke-width=\"1\" stroke-dasharray=\"3\"/><text x=\"115\" y=\"76\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">20 × 3 = 60</text><text x=\"217\" y=\"76\" font-size=\"14\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">9</text><text x=\"115\" y=\"126\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">20</text><text x=\"217\" y=\"126\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">3</text><text x=\"16\" y=\"76\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><text x=\"250\" y=\"50\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">3 × 3</text><text x=\"250\" y=\"66\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">= 9</text><text x=\"160\" y=\"152\" font-size=\"16\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">60 + 9 = 69</text></svg>", "steps": ["곱셈은 같은 수를 여러 번 더한 거예요. 23 × 3 = 23 + 23 + 23.", "두 자리 수는 십의 자리와 일의 자리로 나눠서 생각해요. 23 = 20 + 3.", "각각에 3 을 곱해요. 20 × 3 = 60, 3 × 3 = 9.", "두 값을 더해요. 60 + 9 = 69.", "💡 왜 나눠 곱할까요? 23 × 4 = (20 + 3) × 4 = 80 + 12 예요. 분배법칙으로 자리별로 곱해 더해도 값이 같아요."], "ex": ["23 × 3 = 20 × 3 + 3 × 3 = 60 + 9 = 69", "14 × 5 = 10 × 5 + 4 × 5 = 50 + 20 = 70", "6 × 7 = 42 (구구단은 소리 내어 외워 두면 편해요)"], "bad": ["일의 자리만 곱하고 십의 자리를 빼먹음 (23 × 3 = 9)", "세로셈에서 4 × 5 = 20의 2를 십의 자리로 올리지 않음 (14 × 5 = 50 ✗, 70 ✓)"]}, "뛰어 세기": {"short": "d씩 k번 뛰어 세면 처음 수 + d × k.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"10에서 5씩 3번 뛰어 세면 15, 20, 25\" class=\"nsvg\"><line x1=\"24\" y1=\"92\" x2=\"300\" y2=\"92\" stroke=\"#333\" stroke-width=\"1.8\"/><line x1=\"44\" y1=\"86\" x2=\"44\" y2=\"98\" stroke=\"#333\" stroke-width=\"1.5\"/><circle cx=\"44\" cy=\"92\" r=\"5.5\" fill=\"#1a56a0\" stroke=\"#333\" stroke-width=\"1.8\"/><text x=\"44\" y=\"116\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">10</text><path d=\"M47,86 Q84,44 121,86\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><text x=\"84\" y=\"58\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e7d32\"  d × k 일까요? d 씩 k 번 더하는 것이 곱셈의 뜻(같은 수를 여러 번 더함)이라 처음 수에 d × k 를 더해요."], "ex": ["10 에서 5씩 3번 → 15, 20, 25 → 25", "7 에서 2씩 4번 → 7 + 2 × 4 = 15", "30 에서 10씩 2번 거꾸로 → 30 − 20 = 10"], "bad": ["시작하는 수를 첫 번째로 세어서 한 번 덜 뜀 (10, 15, 20 → 20 ✗, 25 ✓)", "뛴 횟수를 하나 틀림 (3번인데 4번 더함)"]}, "단위 바꾸기": {"short": "1 m = 100 cm, 1 kg = 1000 g, 1시간 = 60분, 1분 = 60초.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"1m=100cm, 1kg=1000g, 1시간=60분, 1분=60초\" class=\"nsvg\"><text x=\"80\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">큰 단위</text><text x=\"240\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">작은 단위</text><rect x=\"30\" y=\"28\" width=\"100\" height=\"24\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"80\" y=\"45\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1 m</text><rect x=\"190\" y=\"28\" width=\"100\" height=\"24\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"240\" y=\"45\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">100 cm</text><line x1=\"132\" y1=\"40\" x2=\"188\" y2=\"40\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M181.7,43.0 L188,40 L181.7,37.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"36\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×100</text><rect x=\"30\" y=\"58\" width=\"100\" height=\"24\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"80\" y=\"75\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1 kg</text><rect x=\"190\" y=\"58\" width=\"100\" height=\"24\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"240\" y=\"75\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1000 g</text><line x1=\"132\" y1=\"70\" x2=\"188\" y2=\"70\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M181.7,73.0 L188,70 L181.7,67.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"66\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×1000</text><rect x=\"30\" y=\"88\" width=\"100\" height=\"24\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"80\" y=\"105\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1 시간</text><rect x=\"190\" y=\"88\" width=\"100\" height=\"24\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"240\" y=\"105\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">60 분</text><line x1=\"132\" y1=\"100\" x2=\"188\" y2=\"100\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M181.7,103.0 L188,100 L181.7,97.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"96\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×60</text><rect x=\"30\" y=\"118\" width=\"100\" height=\"24\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"80\" y=\"135\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1 분</text><rect x=\"190\" y=\"118\" width=\"100\" height=\"24\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><text x=\"240\" y=\"135\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">60 초</text><line x1=\"132\" y1=\"130\" x2=\"188\" y2=\"130\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M181.7,133.0 L188,130 L181.7,127.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"126\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">×60</text><text x=\"160\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">큰 → 작은: 곱하기   |   작은 → 큰: 나누기</text></svg>", "steps": ["같은 크기를 다른 단위로 말하는 거예요. 먼저 외워 둘 것: 1 m = 100 cm, 1 kg = 1000 g, 1시간 = 60분, 1분 = 60초.", "큰 단위를 작은 단위로 바꾸면 숫자는 커져요(곱하기). 2 m = 2 × 100 = 200 cm.", "작은 단위를 큰 단위로 바꾸면 숫자는 작아져요(나누기). 300 cm = 300 ÷ 100 = 3 m.", "‘2 m 5 cm’ 처럼 섞여 있으면 큰 단위만 먼저 바꾼 뒤 더해요. 200 + 5 = 205 cm."], "ex": ["2 m 5 cm = 200 + 5 = 205 cm", "3 kg 400 g = 3000 + 400 = 3400 g", "150분 = 120분 + 30분 = 2시간 30분"], "bad": ["단위가 바뀌는데 곱하기와 나누기를 거꾸로 함", "2 m 5 cm 를 2005 cm 로 씀 (1 m = 100 cm 라서 205 cm)"]}, "계산 순서": {"short": "괄호 → 곱셈·나눗셈 → 덧셈·뺄셈. 같은 단계는 왼쪽부터.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2+3×4에서 곱셈을 먼저 계산해 14\" class=\"nsvg\"><text x=\"160\" y=\"20\" font-size=\"20\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2 + 3 × 4</text><rect x=\"104\" y=\"34\" width=\"50\" height=\"26\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2.2\"/><text x=\"129\" y=\"52\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">① 3 × 4</text><text x=\"190\" y=\"52\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">② 2 + 12</text><text x=\"160\" y=\"92\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2 + 3 × 4 = 2 + 12 = 14</text><rect x=\"24\" y=\"106\" width=\"272\" height=\"50\" fill=\"#f6f7f9\" stroke=\"#9aa0a8\" stroke-width=\"1.3\"/><text x=\"160\" y=\"126\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">① 괄호 ( )   →   ② 곱셈 × · 나눗셈 ÷</text><text x=\"160\" y=\"146\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">→   ③ 덧셈 + · 뺄셈 −   (같은 단계는 왼쪽부터)</text></svg>", "steps": ["계산에는 순서가 있어요. ① 괄호 안, ② 곱셈과 나눗셈, ③ 덧셈과 뺄셈 순서예요.", "2 + 3 × 4 에서는 곱셈이 먼저예요. 3 × 4 = 12 → 2 + 12 = 14.", "(2 + 3) × 4 처럼 괄호가 있으면 괄호 안을 먼저 해요. 5 × 4 = 20.", "같은 단계의 계산(예: 곱셈과 나눗셈)이 섞이면 왼쪽부터 차례로 해요.", "💡 왜 곱셈이 먼저일까요? 곱셈은 같은 수의 반복된 덧셈이라 더 ‘강하게 묶인’ 계산으로 약속했어요. 괄호는 그 약속을 바꾸고 싶을 때 먼저 계산하라고 표시하는 거예요."], "ex": ["2 + 3 × 4 = 2 + 12 = 14", "(2 + 3) × 4 = 5 × 4 = 20", "20 − 12 ÷ 4 = 20 − 3 = 17"], "bad": ["왼쪽부터 무조건 계산함 (2 + 3 × 4 → 5 × 4 = 20)", "괄호가 있는데도 곱셈을 먼저 함"]}, "나눗셈": {"short": "곱셈의 거꾸로. 24 ÷ 6 = □ ⇔ 6 × □ = 24.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"24개를 6개씩 묶으면 4묶음, 24÷6=4\" class=\"nsvg\"><text x=\"160\" y=\"18\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">24 ÷ 6 = ?   (6개씩 묶으면 몇 묶음?)</text><rect x=\"26\" y=\"30\" width=\"66\" height=\"56\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><circle cx=\"38\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"54\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"70\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"38\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"54\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"70\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"100\" y=\"30\" width=\"66\" height=\"56\" fill=\"#fff\" stroke=\"#2e7d32\" stroke-width=\"2\"/><circle cx=\"112\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><circle cx=\"128\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><circle cx=\"144\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><circle cx=\"112\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><circle cx=\"128\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><circle cx=\"144\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#2e7d32\" stroke-width=\"1.5\"/><rect x=\"174\" y=\"30\" width=\"66\" height=\"56\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><circle cx=\"186\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"202\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"218\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"186\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"202\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"218\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"248\" y=\"30\" width=\"66\" height=\"56\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"276\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"292\" cy=\"44\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"260\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"276\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"292\" cy=\"60\" r=\"7\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"160\" y=\"106\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">4 묶음</text><text x=\"160\" y=\"132\" font-size=\"16\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">24 ÷ 6 = 4</text><text x=\"160\" y=\"154\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">⇔  6 × 4 = 24  (곱셈으로 확인)</text></svg>", "steps": ["나눗셈은 똑같이 나누거나, 몇 개씩 묶으면 몇 묶음인지 구하는 계산이에요. 곱셈의 거꾸로예요.", "24 ÷ 6 은 ‘6 에 무엇을 곱하면 24 가 되나?’ 와 같아요. 6 × 4 = 24 이니까 24 ÷ 6 = 4.", "그래서 구구단을 알면 나눗셈도 풀 수 있어요.", "곱셈으로 확인해요. 4 × 6 = 24 이면 맞아요.", "💡 왜 곱셈의 거꾸로일까요? 24 ÷ 6 은 ‘24 를 6 씩 묶으면 몇 묶음?’ 이고 6 × □ = 24 의 □ 와 같아요. 같은 관계를 반대쪽에서 본 거예요."], "ex": ["6 × 4 = 24 → 24 ÷ 6 = 4", "42 ÷ 7 → 7 × 6 = 42 → 6", "15 ÷ 3 = 5 (3 개씩 묶으면 5 묶음)"], "bad": ["나누는 수와 나누어지는 수를 바꿈 (6 ÷ 24)", "곱셈으로 확인하지 않고 끝냄"]}, "나머지가 있는 나눗셈": {"short": "(나누는 수) × 몫 + 나머지 = 나누어지는 수. 나머지는 나누는 수보다 작다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"17개를 5개씩 3묶음 묶으면 2개가 남음, 17÷5=3…2\" class=\"nsvg\"><text x=\"160\" y=\"18\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">17 ÷ 5</text><rect x=\"26\" y=\"32\" width=\"132\" height=\"24\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><circle cx=\"40\" cy=\"44\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"64\" cy=\"44\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"88\" cy=\"44\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"112\" cy=\"44\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"136\" cy=\"44\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"58\" width=\"132\" height=\"24\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><circle cx=\"40\" cy=\"70\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"64\" cy=\"70\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"88\" cy=\"70\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"112\" cy=\"70\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"136\" cy=\"70\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><rect x=\"26\" y=\"84\" width=\"132\" height=\"24\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><circle cx=\"40\" cy=\"96\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"64\" cy=\"96\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"88\" cy=\"96\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"112\" cy=\"96\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"136\" cy=\"96\" r=\"8\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"206\" cy=\"44\" r=\"8\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><circle cx=\"230\" cy=\"44\" r=\"8\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"186\" y=\"32\" width=\"64\" height=\"24\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"92\" y=\"124\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"normal\">5개씩 3묶음</text><text x=\"218\" y=\"76\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">나머지 2</text><text x=\"160\" y=\"142\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">17 ÷ 5 = 3 … 2</text><text x=\"160\" y=\"160\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">5 × 3 + 2 = 17   (나누는 수 × 몫 + 나머지)</text><text x=\"160\" y=\"176\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"normal\">나머지 2 는 나누는 수 5 보다 작아야 해요</text></svg>", "steps": ["똑같이 묶고 남는 게 있을 수 있어요. 17 개를 5 개씩 묶으면 3 묶음이고 2 개가 남아요.", "17 ÷ 5 = 3 … 2 로 쓰고, 3 을 몫, 2 를 나머지라고 해요.", "나머지는 항상 나누는 수보다 작아야 해요. 5 개 이상 남으면 한 묶음을 더 만들 수 있으니까요.", "확인: 5 × 3 + 2 = 17 이면 맞아요.", "💡 왜 나머지는 나누는 수보다 작을까요? 나누는 수만큼 남으면 한 묶음을 더 만들 수 있어서예요. 그래서 나머지는 0 부터 (나누는 수 − 1) 까지예요."], "ex": ["17 ÷ 5 = 3 … 2 (5 × 3 + 2 = 17)", "30 ÷ 7 = 4 … 2 (7 × 4 + 2 = 30)", "나머지가 0 이면 ‘나누어떨어진다’ 고 해요. 20 ÷ 5 = 4"], "bad": ["나머지가 나누는 수보다 크거나 같게 둠 (17 ÷ 5 = 2 … 7)", "확인할 때 나머지를 더하지 않음 (5 × 3 = 15 ≠ 17)"]}, "삼각형의 내각의 합": {"short": "세 각의 합 = 180°.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"삼각형의 세 각 50도, 60도, 70도를 모으면 일직선 180도\" class=\"nsvg\"><path d=\"M25.0,150.0 L145.0,150.0 L96.1,65.3 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><text x=\"52\" y=\"143\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">50°</text><text x=\"118\" y=\"143\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">60°</text><text x=\"96\" y=\"95\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">□</text><text x=\"196\" y=\"24\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">세 각을 한 점에 모으면</text><line x1=\"190\" y1=\"138\" x2=\"310\" y2=\"138\" stroke=\"#333\" stroke-width=\"2\"/><line x1=\"250\" y1=\"138\" x2=\"289.85283180056547\" y2=\"90.50524452662336\" stroke=\"#c62828\" stroke-width=\"2\"/><line x1=\"250\" y1=\"138\" x2=\"228.79475111380853\" y2=\"79.73905751127367\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"280.8144647592461\" y=\"127.63097910081622\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">50°</text><text x=\"255.90403804067563\" y=\"108.51653639758493\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">60°</text><text x=\"222.14883049417426\" y=\"122.49840116406443\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">70°</text><text x=\"250\" y=\"160\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">일직선 = 180°</text><text x=\"250\" y=\"44\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">50° + 60° + □ = 180°</text><text x=\"250\" y=\"60\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">□ = 70°</text></svg>", "steps": ["삼각형 안쪽의 세 각을 내각이라고 해요.", "세 각을 오려서 꼭짓점을 맞춰 붙이면 일직선(180°) 이 돼요. 어떤 삼각형이든 같아요.", "그래서 세 각의 합은 항상 180° 예요.", "두 각을 알면 나머지 각은 180° 에서 빼서 구해요. 180 − 50 − 60 = 70.", "💡 왜 180° 일까요? 삼각형의 한 꼭짓점을 지나고 반대 변과 평행한 선을 그으면 엇각이 생겨 세 각이 한 직선 위에 모여요. 일직선의 각이 180° 라서 세 각의 합도 180° 예요."], "ex": ["50° + 60° + □ = 180° → □ = 180 − 110 = 70°", "직각삼각형에서 한 각이 90° 이면 나머지 두 각의 합은 90°", "이등변삼각형의 꼭지각이 40° → 밑각 = (180 − 40) ÷ 2 = 70°"], "bad": ["합을 360° 로 계산함 (360° 는 사각형 네 각의 합)", "한 각만 빼고 끝냄 (180 − 50 = 130 이 답이 아니에요, 60 도 빼야 해요)"]}, "소수의 계산": {"short": "덧셈·뺄셈은 소수점을 맞춘다. 곱셈은 자연수처럼 곱한 뒤 소수점 아래 자릿수만큼 소수점을 찍는다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2.5+1.34는 소수점을 맞춰 3.84, 1.2×3은 12×3=36에서 3.6\" class=\"nsvg\"><text x=\"80\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">더하기: 소수점을 맞춰요</text><text x=\"70\" y=\"52\" font-size=\"18\" text-anchor=\"end\" fill=\"#333\" font-weight=\"bold\">2.50</text><text x=\"30\" y=\"80\" font-size=\"18\" text-anchor=\"end\" fill=\"#333\" font-weight=\"bold\">+</text><text x=\"70\" y=\"80\" font-size=\"18\" text-anchor=\"end\" fill=\"#333\" font-weight=\"bold\">1.34</text><line x1=\"26\" y1=\"90\" x2=\"78\" y2=\"90\" stroke=\"#333\" stroke-width=\"2\"/><text x=\"70\" y=\"114\" font-size=\"18\" text-anchor=\"end\" fill=\"#c62828\" font-weight=\"bold\">3.84</text><text x=\"160\" y=\"18\" font-size=\"1\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\"></text><line x1=\"164\" y1=\"26\" x2=\"164\" y2=\"150\" stroke=\"#c8c8c8\" stroke-width=\"1.2\"/><text x=\"240\" y=\"18\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">곱하기: 자연수처럼 곱해요</text><text x=\"240\" y=\"48\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1.2 × 3</text><text x=\"240\" y=\"72\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">12 × 3 = 36</text><text x=\"240\" y=\"94\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">1.2 → 소수 한 자리</text><text x=\"240\" y=\"112\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">소수점을 한 칸 찍어</text><text x=\"240\" y=\"134\" font-size=\"18\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3.6</text><text x=\"160\" y=\"166\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">세로로 쓸 때 소수점끼리 위아래를 맞춰요</text></svg>", "steps": ["덧셈·뺄셈은 소수점을 위아래로 맞춰 쓰고 자리끼리 계산해요. 비는 자리는 0 으로 채워요. 2.5 = 2.50", "소수점도 그대로 아래로 내려 찍어요. 2.50 + 1.34 = 3.84.", "곱셈은 소수점을 무시하고 자연수처럼 곱해요. 1.2 × 3 → 12 × 3 = 36.", "곱하는 수들의 소수점 아래 자릿수를 합한 만큼 소수점을 찍어요. 1.2 는 한 자리 → 3.6.", "💡 왜 소수점을 맞출까요? 같은 자리끼리만 더하고 뺄 수 있어서예요. 곱셈은 0.3 × 0.4 = 3/10 × 4/10 = 12/100 이라 소수점 아래 자릿수가 (1+1)=2 자리예요."], "ex": ["2.5 + 1.34 = 2.50 + 1.34 = 3.84", "5 − 1.7 = 5.0 − 1.7 = 3.3", "1.2 × 3 = 3.6, 0.4 × 0.3 = 0.12 (4 × 3 = 12, 소수 두 자리)"], "bad": ["소수점을 맞추지 않고 오른쪽 끝을 맞춤 (2.5 + 1.34 = 1.59 ✗)", "곱셈 뒤 소수점을 안 찍음 (1.2 × 3 = 36)"]}, "직사각형의 둘레": {"short": "(가로 + 세로) × 2.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"가로 5, 세로 3인 직사각형의 둘레 16\" class=\"nsvg\"><rect x=\"60\" y=\"34\" width=\"160\" height=\"96\" fill=\"#f3f8ff\" stroke=\"#1a56a0\" stroke-width=\"2.5\"/><line x1=\"92\" y1=\"34\" x2=\"92\" y2=\"130\" stroke=\"#c9d6e6\" stroke-width=\"1\"/><line x1=\"124\" y1=\"34\" x2=\"124\" y2=\"130\" stroke=\"#c9d6e6\" stroke-width=\"1\"/><line x1=\"156\" y1=\"34\" x2=\"156\" y2=\"130\" stroke=\"#c9d6e6\" stroke-width=\"1\"/><line x1=\"188\" y1=\"34\" x2=\"188\" y2=\"130\" stroke=\"#c9d6e6\" stroke-width=\"1\"/><line x1=\"60\" y1=\"66\" x2=\"220\" y2=\"66\" stroke=\"#c9d6e6\" stroke-width=\"1\"/><line x1=\"60\" y1=\"98\" x2=\"220\" y2=\"98\" stroke=\"#c9d6e6\" stroke-width=\"1\"/><text x=\"140.0\" y=\"28\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5 cm</text><text x=\"52\" y=\"88.4\" font-size=\"12\" text-anchor=\"end\" fill=\"#2e7d32\" font-weight=\"bold\">3</text><text x=\"228\" y=\"88.4\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">3 cm</text><text x=\"140.0\" y=\"146\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5 cm</text><text x=\"160\" y=\"164\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">둘레 = (가로 + 세로) × 2 = (5 + 3) × 2 = 16 cm</text></svg>", "steps": ["둘레는 도형 바깥 테두리의 길이예요. 한 바퀴 돌며 변의 길이를 모두 더해요.", "직사각형은 마주 보는 변의 길이가 같아요. 가로 5, 세로 3, 가로 5, 세로 3 이 있어요.", "그래서 5 + 3 + 5 + 3 = (5 + 3) × 2 = 16 이에요. (가로 + 세로) 를 2번 더하는 거예요.", "정사각형은 네 변이 모두 같아서 (한 변) × 4 예요.", "💡 왜 (가로+세로)×2 일까요? 둘레는 가로 2개, 세로 2개를 더한 길이라 가로+세로 한 쌍이 두 번 있어요."], "ex": ["가로 5, 세로 3 → (5 + 3) × 2 = 16 cm", "가로 8, 세로 2 → (8 + 2) × 2 = 20 cm", "한 변이 6 인 정사각형 → 6 × 4 = 24 cm"], "bad": ["가로와 세로를 한 번만 더하고 2 를 안 곱함 (5 + 3 = 8)", "넓이(가로 × 세로) 와 섞음"]}, "분수만큼 알아보기": {"short": "전체의 n/d = 전체 ÷ d × n.", "svg": "<svg viewBox=\"0 \"10\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><rect x=\"120\" y=\"114\" width=\"10\" height=\"10\" fill=\"#fff\" stroke=\"#b9c0c8\" stroke-width=\"1\"/><text x=\"80\" y=\"142\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">한 줄 = 10칸 = 10 %</text><text x=\"215\" y=\"40\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">200 의 10 %</text><text x=\"215\" y=\"62\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">= 200 × 10/100 = 20</text><line x1=\"160\" y1=\"76\" x2=\"300\" y2=\"76\" stroke=\"#c8c8c8\" stroke-width=\"1.2\"/><text x=\"215\" y=\"96\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">20 % 할인</text><text x=\"215\" y=\"116\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">= 80 % 만 내요</text><text x=\"215\" y=\"138\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1000원 → 1000 × 80/100</text><text x=\"215\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">= 800원</text></svg>", "steps": ["백분율(%)은 전체를 100 으로 봤을 때의 크기예요. 1 % = 100 칸 중 1 칸 = 1/100.", "a 의 p % 는 a × p/100 이에요. 200 의 10 % = 200 × 10/100 = 20.", "p % 할인은 (100 − p) % 만 내는 거예요. 20 % 할인 → 80 % 만 내요. 정가 × 80/100.", "거꾸로 비율을 구할 때는 (부분 ÷ 전체) × 100. 50 이 200 의 몇 % → 50/200 × 100 = 25 %.", "💡 왜 100 으로 나눌까요? %는 ‘100 중 몇’이라는 뜻이라 p% 는 p/100 이에요. 20% 할인이면 80% 만 내므로 정가 × 80/100 이에요."], "ex": ["200 의 10 % = 200 × 10/100 = 20", "1000원짜리 20 % 할인 = 1000 × 80/100 = 800원", "15 가 60 의 몇 % → 15/60 × 100 = 25 %"], "bad": ["20% 할인 가격을 정가의 20%로 계산함 (200원 ✗, 800원 ✓)", "퍼센트 기호를 보고 그대로 곱함 (200 × 10 = 2000)"]}, "평행사변형의 넓이": {"short": "밑변 × 높이.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"평행사변형의 한쪽 삼각형을 옮기면 직사각형이 되어 넓이는 밑변×높이\" class=\"nsvg\"><path d=\"M40.0,130.0 L190.0,130.0 L230.0,60.0 L80.0,60.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2.2\" stroke-linejoin=\"round\"/><path d=\"M40.0,130.0 L80.0,130.0 L80.0,60.0 Z\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"60\" x2=\"80\" y2=\"130\" stroke=\"#2e7d32\" stroke-width=\"2\" stroke-dasharray=\"4\"/><line x1=\"70\" y1=\"100\" x2=\"215\" y2=\"100\" stroke=\"#c62828\" stroke-width=\"2\"/><path d=\"M208.7,103.0 L215,100 L208.7,97.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"115\" y=\"152\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">밑변</text><text x=\"70\" y=\"100\" font-size=\"11\" text-anchor=\"end\" fill=\"#2e7d32\" font-weight=\"bold\">높이</text><text x=\"160\" y=\"22\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">노란 삼각형을 오른쪽으로 옮기면 직사각형!</text><text x=\"160\" y=\"172\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">넓이 = 밑변 × 높이   (비스듬한 변이 아니에요)</text></svg>", "steps": ["평행사변형의 한쪽 끝 삼각형을 잘라 반대쪽에 붙이면 직사각형이 돼요. 넓이는 변하지 않아요.", "그 직사각형의 가로는 밑변, 세로는 높이예요. 그래서 넓이 = 밑변 × 높이.", "높이는 밑변에서 맞은편 변까지 수직으로 잰 길이예요. 비스듬한 옆변의 길이가 아니에요.", "높이를 그으면 직각 표시(∟)가 있어야 해요.", "💡 왜 밑변×높이일까요? 한쪽 끝을 삼각형으로 잘라 반대쪽에 붙이면 밑변 × 높이인 직사각형이 돼요. 모양만 바뀌고 넓이는 그대로예요."], "ex": ["밑변 5, 높이 4 → 5 × 4 = 20", "밑변 8 cm, 높이 3 cm → 24 cm²", "넓이 30, 밑변 6 → 높이 = 30 ÷ 6 = 5"], "bad": ["옆변의 길이를 높이로 곱함", "직사각형처럼 두 변을 곱했는데, 그 변이 높이가 아님"]}, "평균": {"short": "평균 = 합 ÷ 개수, 합 = 평균 × 개수.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2, 4, 9를 고르게 맞추면 모두 5\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">자료 2, 4, 9  →  평균 5</text><rect x=\"50\" y=\"106\" width=\"40\" height=\"18\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"70\" y=\"140\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2</text><rect x=\"108\" y=\"88\" width=\"40\" height=\"36\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"128\" y=\"140\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">4</text><rect x=\"166\" y=\"43\" width=\"40\" height=\"81\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"186\" y=\"140\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">9</text><line x1=\"36\" y1=\"79\" x2=\"220\" y2=\"79\" stroke=\"#c62828\" stroke-width=\"2\" stroke-dasharray=\"5\"/><text x=\"228\" y=\"83\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">평균 5</text><text x=\"186\" y=\"37\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">9는 4 넘침</text><text x=\"70\" y=\"100\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">2는 3 모자람</text><text x=\"160\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">(2 + 4 + 9) ÷ 3 = 15 ÷ 3 = 5</text><text x=\"160\" y=\"174\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">합 = 평균 × 개수  =  5 × 3 = 15</text><text x=\"128\" y=\"70\" font-size=\"10.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"normal\">4는 1 모자람</text><text x=\"222\" y=\"44\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">모자람 합 3 + 1 = 4</text><text x=\"222\" y=\"58\" font-size=\"10.5\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"normal\">= 넘침 4 → 평균 5</text></svg>", "steps": ["평균은 자료를 고르게 맞췄을 때의 값이에요. 많은 쪽에서 덜어 모자란 쪽에 채운다고 생각해요.", "2, 4, 9 에서 9 는 5 보다 4 크고, 2 와 4 는 합해서 4 모자라요. 덜어서 채우면 모두 5 가 돼요.", "식으로는 평균 = (자료의 합) ÷ (자료의 개수).", "거꾸로 합 = 평균 × 개수. ‘평균이 5 인 3개의 합’ 이면 15.", "💡 왜 합 ÷ 개수일까요? 값들을 똑같이 나눠 가졌다고 생각했을 때 한 개당 몫이 평균이에요. 거꾸로 평균 × 개수는 원래의 합이에요."], "ex": ["2, 4, 9 → (2 + 4 + 9) ÷ 3 = 5", "평균이 6 인 4명의 점수 합 → 6 × 4 = 24", "점수 70, 80 에 한 번 더 봐서 평균 80 이 되려면 → 3회 합 240 − 150 = 90점"], "bad": ["개수로 나누지 않고 합만 구함", "개수를 잘못 셈 (자료가 3개인데 2 로 나눔)"]}, "비례배분": {"short": "전체를 p : q 로 나누면 전체 × p/(p+q), 전체 × q/(p+q).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"20을 2대3으로 나누면 5조각 중 2조각 8, 3조각 12\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">20 을 2 : 3 으로 나누기</text><rect x=\"30\" y=\"32\" width=\"52\" height=\"36\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"56\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">4</text><rect x=\"82\" y=\"32\" width=\"52\" height=\"36\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"108\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">4</text><rect x=\"134\" y=\"32\" width=\"52\" height=\"36\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"160\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">4</text><rect x=\"186\" y=\"32\" width=\"52\" height=\"36\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"212\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">4</text><rect x=\"238\" y=\"32\" width=\"52\" height=\"36\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"264\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">4</text><line x1=\"30\" y1=\"84\" x2=\"134\" y2=\"84\" stroke=\"#c62828\" stroke-width=\"3\"/><text x=\"82\" y=\"102\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">2 조각 = 8</text><line x1=\"134\" y1=\"84\" x2=\"290\" y2=\"84\" stroke=\"#1a56a0\" stroke-width=\"3\"/><text x=\"212\" y=\"102\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">3 조각 = 12</text><text x=\"160\" y=\"128\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">전체 조각 수 2 + 3 = 5   →   한 조각 = 20 ÷ 5 = 4</text><text x=\"160\" y=\"150\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">20 × 2/5 = 8     20 × 3/5 = 12</text><text x=\"160\" y=\"170\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">확인: 8 + 12 = 20 ✓</text></svg>", "steps": ["비가 2 : 3 이면 전체를 2 + 3 = 5 조각으로 나누어, 한쪽이 2 조각, 다른 쪽이 3 조각을 가져가요.", "한 조각의 크기는 전체 ÷ 5. 20 ÷ 5 = 4.", "각자의 몫: 2 조각 = 4 × 2 = 8, 3 조각 = 4 × 3 = 12. (또는 20 × 2/5, 20 × 3/5)", "두 몫을 더해서 전체가 되는지 확인해요.", "💡 왜 p/(p+q) 를 곱할까요? p : q 로 나누면 전체가 p+q 조각이고 그중 p 조각이 첫째 몫이에요. 전체의 p/(p+q) 가 첫째 몫이에요."], "ex": ["20 을 2 : 3 → 한 조각 4 → 8 과 12", "사탕 30개를 1 : 2 로 나눔 → 한 조각 10 → 10개와 20개", "4 : 5 로 나누면 전체는 9 조각 → 18 을 나누면 한 조각 2 → 8 과 10"], "bad": ["전체를 2 와 3 으로 곧바로 나눔 (20 ÷ 2, 20 ÷ 3)", "비의 순서를 바꿔서 나눔 (2 : 3인데 앞에 12, 뒤에 8을 줌)"]}, "직육면체의 부피": {"short": "가로 × 세로 × 높이.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"한 층에 6개씩 4층을 쌓으면 24개, 부피는 가로×세로×높이\" class=\"nsvg\"><text x=\"70\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">한 층</text><rect x=\"40\" y=\"26\" width=\"28\" height=\"28\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><rect x=\"68\" y=\"26\" width=\"28\" height=\"28\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><rect x=\"40\" y=\"54\" width=\"28\" height=\"28\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><rect x=\"68\" y=\"54\" width=\"28\" height=\"28\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><rect x=\"40\" y=\"82\" width=\"28\" height=\"28\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><rect x=\"68\" y=\"82\" width=\"28\" height=\"28\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.6\"/><text x=\"68\" y=\"124\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2 × 3 = 6 개</text><text x=\"70\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(가로 × 세로)</text><text x=\"230\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">4 층</text><rect x=\"180\" y=\"26\" width=\"100\" height=\"22\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"230\" y=\"42\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">6 개</text><rect x=\"180\" y=\"50\" width=\"100\" height=\"22\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"230\" y=\"66\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">6 개</text><rect x=\"180\" y=\"74\" width=\"100\" height=\"22\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"230\" y=\"90\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">6 개</text><rect x=\"180\" y=\"98\" width=\"100\" height=\"22\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"230\" y=\"114\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">6 개</text><line x1=\"150\" y1=\"70\" x2=\"172\" y2=\"70\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M165.7,73.0 L172,70 L165.7,67.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><text x=\"160\" y=\"154\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">부피 = 가로 × 세로 × 높이</text><text x=\"160\" y=\"172\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">2 × 3 × 4 = 24 cm³</text></svg>", "steps": ["부피는 한 변이 1 cm 인 쌓기나무(1 cm³)가 몇 개 들어가는지로 재요.", "바닥 한 층에는 가로 2 × 세로 3 = 6 개가 놓여요.", "이 층이 높이만큼 쌓여요. 높이가 4 면 6 개씩 4 층이라 6 × 4 = 24 개.", "그래서 부피 = 가로 × 세로 × 높이. 단위는 cm³ (세제곱센티미터).", "💡 왜 곱할까요? 가로×세로는 바닥 한 층의 단위 정육면체 개수이고, 층이 높이만큼 쌓여 있어서 가로×세로×높이예요."], "ex": ["2 × 3 × 4 = 24 cm³", "한 모서리가 5 cm 인 정육면체 → 5 × 5 × 5 = 125 cm³", "가로 4, 세로 5, 부피 60 → 높이 = 60 ÷ (4 × 5) = 3"], "bad": ["넓이 단위(cm²) 로 씀", "세 수를 더함 (2 + 3 + 4 = 9)"]}, "비와 비례식": {"short": "앞뒤 항에 같은 수를 곱하거나 나눠도 같은 비. a : b = c : d 이면 ad = bc.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2:3과 4:6은 같은 비, a:b=c:d이면 ad=bc\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">비의 성질</text><rect x=\"40\" y=\"28\" width=\"80\" height=\"32\" fill=\"#fff\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"80\" y=\"50\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2 : 3</text><line x1=\"124\" y1=\"44\" x2=\"196\" y2=\"44\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><path d=\"M189.7,47.0 L196,44 L189.7,41.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2.2\"/><text x=\"160\" y=\"36\" font-size=\"11\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">둘 다 ×2</text><rect x=\"200\" y=\"28\" width=\"80\" height=\"32\" fill=\"#fff\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"240\" y=\"50\" font-size=\"15\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">4 : 6</text><text x=\"160\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">앞뒤에 같은 수를 곱하거나 나눠도 같은 비</text><text x=\"160\" y=\"112\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">a : b = c : d   ⇒   a × d = b × c</text><text x=\"160\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">(바깥끼리의 곱 = 안쪽끼리의 곱)</text><text x=\"160\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">2 : 3 = 6 : x  →  2x = 18  →  x = 9</text></svg>", "steps": ["비 a : b 는 a 와 b 를 비교하는 거예요. 앞의 수를 비교하는 양, 뒤의 수를 기준으로 봐요.", "앞뒤 항에 0 이 아닌 같은 수를 곱하거나 나누어도 같은 비예요. 2 : 3 = 4 : 6 = 6 : 9.", "두 비가 같은 식을 비례식이라고 하고, a : b = c : d 이면 바깥쪽(a, d)의 곱과 안쪽(b, c)의 곱이 같아요. ad = bc.", "□ 를 구할 때 이 성질로 식을 세워요. 2 : 3 = 6 : x → 2x = 18 → x = 9.", "💡 왜 ad = bc 일까요? a/b = c/d 의 양변에 bd 를 곱하면 ad = bc 가 나와요. 바깥 항끼리의 곱과 안쪽 항끼리의 곱이 같아요."], "ex": ["2 : 3 = 4 : 6 (둘 다 2배)", "6 : 8 → 2 로 나누면 3 : 4 (가장 간단한 자연수의 비)", "3 : 5 = 12 : x → 3x = 60 → x = 20"], "bad": ["앞 항에만 곱함 (2 : 3 = 4 : 3 ✗)", "한 비 안의 두 수끼리 곱함 (2 : 3 = 6 : x에서 2 × 3 = 6 × x ✗ → 2 × x = 3 × 6 ✓)"]}, "속력": {"short": "속력 = 거리 ÷ 시간, 거리 = 속력 × 시간, 시간 = 거리 ÷ 속력.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"거리, 속력, 시간 삼각형\" class=\"nsvg\"><path d=\"M160.0,20.0 L100.0,130.0 L220.0,130.0 Z\" fill=\"#f6f7f9\" stroke=\"#333\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"82\" x2=\"220\" y2=\"82\" stroke=\"#333\" stroke-width=\"1.8\"/><line x1=\"160\" y1=\"82\" x2=\"160\" y2=\"130\" stroke=\"#333\" stroke-width=\"1.8\"/><text x=\"160\" y=\"66\" font-size=\"15\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">거리</text><text x=\"130\" y=\"112\" font-size=\"13\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">속력</text><text x=\"190\" y=\"112\" font-size=\"13\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">시간</text><text x=\"20\" y=\"50\" font-size=\"12\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">거리 = 속력 × 시간</text><text x=\"20\" y=\"76\" font-size=\"12\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">속력 = 거리 ÷ 시간</text><text x=\"20\" y=\"102\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">시간 = 거리 ÷ 속력</text><text x=\"240\" y=\"50\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">시속 60 km 로</text><text x=\"240\" y=\"66\" font-size=\"11\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">2시간 가면</text><text x=\"240\" y=\"84\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">60 × 2</text><text x=\"240\" y=\"102\" font-size=\"12\" text-anchor=\"start\" fill=\"#1a56a0\" font-weight=\"bold\">= 120 km</text><text x=\"160\" y=\"160\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">가리면 나머지 식이 보여요: 거리를 가리면 속력 × 시간</text></svg>", "steps": ["속력은 단위 시간(1시간, 1분, 1초) 동안 가는 거리예요. 시속 60 km 는 1시간에 60 km 를 간다는 뜻.", "속력 = 거리 ÷ 시간. 120 km 를 2 시간에 갔다면 120 ÷ 2 = 시속 60 km.", "거리 = 속력 × 시간. 시속 60 km 로 2 시간 가면 60 × 2 = 120 km.", "시간 = 거리 ÷ 속력. 단위(시간·분·초, km·m) 를 먼저 맞춰요.", "💡 왜 거리÷시간일까요? 속력은 ‘한 시간(또는 1초)에 가는 거리’예요. 거리를 시간으로 나누면 1 단위 시간당 이동 거리가 돼요. 나머지 두 공식은 같은 식을 변형한 거예요."], "ex": ["120 km 를 2 시간에 → 120 ÷ 2 = 시속 60 km", "초속 4 m 로 10초 → 4 × 10 = 40 m", "90 km 를 시속 30 km 로 가면 → 90 ÷ 30 = 3 시간"], "bad": ["분과 시간 단위를 섞어 씀 (30분 = 0.5시간으로 바꿔요)", "거리와 시간을 나누는 순서를 거꾸로 함 (시간 ÷ 거리)"]}, "거듭제곱": {"short": "aⁿ = a를 n번 곱함. 음수는 짝수 번 곱하면 +, 홀수 번이면 −.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2의 세제곱은 2를 3번 곱한 8\" class=\"nsvg\"><text x=\"60\" y=\"70\" font-size=\"44\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2</text><text x=\"96\" y=\"48\" font-size=\"24\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3</text><line x1=\"44\" y1=\"100\" x2=\"52\" y2=\"86\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><path d=\"M51.5,93.0 L52,86 L46.2,90.0\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"52\" y=\"118\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">밑</text><line x1=\"112\" y1=\"88\" x2=\"102\" y2=\"60\" stroke=\"#c62828\" stroke-width=\"1.8\"/><path d=\"M107.0,64.9 L102,60 L101.3,67.0\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.8\"/><text x=\"122\" y=\"104\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">지수</text><text x=\"160\" y=\"50\" font-size=\"14\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">= 2 × 2 × 2</text><text x=\"160\" y=\"76\" font-size=\"16\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">= 8</text><text x=\"160\" y=\"100\" font-size=\"11.5\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">밑을 지수만큼 곱해요 (3번)</text><text x=\"160\" y=\"130\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">(−2)³ = −8     (홀수 번 → 음수)</text><text x=\"160\" y=\"152\" font-size=\"12\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">(−2)² = 4     (짝수 번 → 양수)</text><text x=\"160\" y=\"172\" font-size=\"11\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">−2² = −(2 × 2) = −4  (괄호 없음)</text></svg>", "steps": ["같은 수를 여러 번 곱한 것을 거듭제곱이라고 해요. 곱하는 수가 밑, 곱한 횟수가 지수예요.", "2³ = 2 × 2 × 2 = 8. 지수 3 은 ‘3번 곱한다’ 는 뜻이지 ‘3을 곱한다’ 가 아니에요.", "음수를 괄호로 묶어 거듭제곱하면 (−2)³ = (−2) × (−2) × (−2) = −8, (−2)² = 4. 짝수 번 곱하면 +, 홀수 번이면 −.", "괄호가 없으면 −2² = −(2²) = −4 예요. 괄호가 있어야 음수 전체가 밑이에요.", "💡 왜 부호가 바뀔까요? 음수를 한 번 곱할 때마다 부호가 반대로 뒤집혀서 짝수 번이면 원래대로(+), 홀수 번이면 −가 돼요."], "ex": ["2³ = 8, 3² = 9", "(−2)³ = −8, (−2)² = 4", "−2² = −4 (괄호 없음)"], "bad": ["2³ 을 2 × 3 = 6 으로 계산함", "(−2)² 를 −4 로 계산함 ((−2) × (−2) = +4)"]}, "동류항 정리": {"short": "괄호를 풀고(앞이 −면 부호 반대) 같은 문자끼리 모은다.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2(x+1)−(x−3)을 풀어 x+5\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">2(x + 1) − (x − 3)</text><text x=\"105\" y=\"42\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">= 2x + 2 − x + 3</text><text x=\"200\" y=\"38\" font-size=\"11\" text-anchor=\"start\" fill=\"#2e7d32\" font-weight=\"bold\">← 괄호 풀기</text><text x=\"200\" y=\"52\" font-size=\"10\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"normal\">(− 앞은 부호 반대)</text><rect x=\"54\" y=\"76\" width=\"86\" height=\"30\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"97\" y=\"96\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">2x − x</text><text x=\"160\" y=\"96\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">+</text><rect x=\"180\" y=\"76\" width=\"86\" height=\"30\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"223\" y=\"96\" font-size=\"13.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">2 + 3</text><text x=\"160\" y=\"66\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">문자끼리, 숫자끼리 모아요</text><line x1=\"97\" y1=\"108\" x2=\"97\" y2=\"128\" stroke=\"#1a56a0\" stroke-width=\"2\"/><path d=\"M94.0,121.7 L97,128 L100.0,121.7\" fill=\"none\" stroke=\"#1a56a0\" stroke-width=\"2\"/><line x1=\"223\" y1=\"108\" x2=\"223\" y2=\"128\" stroke=\"#c62828\" stroke-width=\"2\"/><path d=\"M220.0,121.7 L223,128 L226.0,121.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><rect x=\"54\" y=\"130\" width=\"86\" height=\"28\" fill=\"#fff4cc\" stroke=\"#1a56a0\" stroke-width=\"2\"/><text x=\"97\" y=\"149\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">x</text><text x=\"160\" y=\"149\" font-size=\"16\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">+</text><rect x=\"180\" y=\"130\" width=\"86\" height=\"28\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"223\" y=\"149\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5</text><text x=\"160\" y=\"174\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">답: x + 5</text></svg>", "steps": ["동류항은 문자와 차수가 같은 항이에요. 2x 와 −x 는 동류항, 2x 와 5 는 아니에요.", "먼저 괄호를 풀어요. 앞에 수를 곱하면 모든 항에 곱하고, 앞이 − 이면 괄호 안 모든 부호를 반대로 해요. 2(x + 1) = 2x + 2, −(x − 3) = −x + 3.", "x 가 있는 항끼리, 숫자끼리 모아요. (2x − x) + (2 + 3).", "계산해서 정리해요. x + 5.", "💡 왜 −( ) 면 부호가 반대일까요? −(a − b) 는 (−1) × (a − b) = −a + b 이기 때문이에요. 같은 문자·차수끼리만 한 묶음(3x + 2x = 5x)으로 더할 수 있어요."], "ex": ["2(x + 1) − (x − 3) = 2x + 2 − x + 3 = x + 5", "3x + 2 + x − 5 = 4x − 3", "−(2x − 1) = −2x + 1"], "bad": ["− 뒤의 괄호에서 첫 항만 부호를 바꿈 (−(x − 3) = −x − 3 ✗)", "2(x + 1) = 2x + 1 로 둘째 항에 안 곱함"]}, "정다면체": {"short": "모든 면이 합동인 정다각형인 입체. 정사·정육·정팔·정십이·정이십면체 5가지 (이름 속 숫자 = 면의 수).", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"정사면체, 정육면체, 정팔면체, 정십이면체, 정이십면체 5가지와 면의 모양, 면의 수\" class=\"nsvg\"><text x=\"160\" y=\"14\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">정다면체 5가지 — 모든 면이 합동인 정다각형</text><rect x=\"20\" y=\"24\" width=\"280\" height=\"26\" fill=\"#f6f7f9\" stroke=\"#b9c0c8\" stroke-width=\"1.2\"/><path d=\"M44.0,28.0 L34.0,45.0 L54.0,45.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"70\" y=\"42\" font-size=\"13\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">정사면체</text><text x=\"170\" y=\"42\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">정삼각형 면</text><text x=\"262\" y=\"42\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">4개</text><rect x=\"20\" y=\"54\" width=\"280\" height=\"26\" fill=\"#f6f7f9\" stroke=\"#b9c0c8\" stroke-width=\"1.2\"/><rect x=\"35\" y=\"58\" width=\"18\" height=\"18\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\"/><text x=\"70\" y=\"72\" font-size=\"13\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">정육면체</text><text x=\"170\" y=\"72\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">정사각형 면</text><text x=\"262\" y=\"72\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">6개</text><rect x=\"20\" y=\"84\" width=\"280\" height=\"26\" fill=\"#f6f7f9\" stroke=\"#b9c0c8\" stroke-width=\"1.2\"/><path d=\"M44.0,88.0 L34.0,105.0 L54.0,105.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"70\" y=\"102\" font-size=\"13\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">정팔면체</text><text x=\"170\" y=\"102\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">정삼각형 면</text><text x=\"262\" y=\"102\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">8개</text><rect x=\"20\" y=\"114\" width=\"280\" height=\"26\" fill=\"#f6f7f9\" stroke=\"#b9c0c8\" stroke-width=\"1.2\"/><path d=\"M44.0,118.0 L52.6,124.2 L49.3,134.3 L38.7,134.3 L35.4,124.2 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"70\" y=\"132\" font-size=\"13\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">정십이면체</text><text x=\"170\" y=\"132\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">정오각형 면</text><text x=\"262\" y=\"132\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">12개</text><rect x=\"20\" y=\"144\" width=\"280\" height=\"26\" fill=\"#f6f7f9\" stroke=\"#b9c0c8\" stroke-width=\"1.2\"/><path d=\"M44.0,148.0 L34.0,165.0 L54.0,165.0 Z\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.8\" stroke-linejoin=\"round\"/><text x=\"70\" y=\"162\" font-size=\"13\" text-anchor=\"start\" fill=\"#333\" font-weight=\"bold\">정이십면체</text><text x=\"170\" y=\"162\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">정삼각형 면</text><text x=\"262\" y=\"162\" font-size=\"13\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">20개</text></svg>", "steps": ["정다면체는 모든 면이 합동인 정다각형이고, 각 꼭짓점에 모인 면의 수가 모두 같은 입체예요.", "이런 입체는 5가지뿐이에요: 정사면체, 정육면체, 정팔면체, 정십이면체, 정이십면체.", "이름 속 숫자가 면의 수예요. 정사면체 4개, 정육면체 6개, 정팔면체 8개, 정십이면체 12개, 정이십면체 20개.", "면의 모양은 정삼각형(정사·정팔·정이십), 정사각형(정육), 정오각형(정십이)이에요.", "💡 왜 5가지뿐일까요? 한 꼭짓점에 모인 면의 각을 합하면 360° 보다 작아야 입체가 돼요. 정삼각형(60°)은 3·4·5개, 정사각형은 3개, 정오각형은 3개만 가능하고 그 외는 360° 이상이라 입체가 안 돼요. 그래서 5가지예요."], "ex": ["정육면체(주사위 모양) → 면 6개, 면의 모양은 정사각형", "정팔면체 → 면 8개, 정삼각형", "정십이면체의 면의 모양 → 정오각형"], "bad": ["면의 모양이 서로 다른 입체를 정다면체라고 함 (예: 사각뿔)", "정육각형 면으로 된 정다면체가 있다고 생각함 (없어요)"]}, "최빈값": {"short": "가장 많이 나온 값.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"2,3,3,5에서 3이 두 번 나와 최빈값 3\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">자료 2, 3, 3, 5</text><line x1=\"30\" y1=\"128\" x2=\"300\" y2=\"128\" stroke=\"#333\" stroke-width=\"1.8\"/><line x1=\"50\" y1=\"124\" x2=\"50\" y2=\"132\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"50\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><line x1=\"94\" y1=\"124\" x2=\"94\" y2=\"132\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"94\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">2</text><line x1=\"138\" y1=\"124\" x2=\"138\" y2=\"132\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"138\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">3</text><line x1=\"182\" y1=\"124\" x2=\"182\" y2=\"132\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"182\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">4</text><line x1=\"226\" y1=\"124\" x2=\"226\" y2=\"132\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"226\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">5</text><line x1=\"270\" y1=\"124\" x2=\"270\" y2=\"132\" stroke=\"#333\" stroke-width=\"1.5\"/><text x=\"270\" y=\"148\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">6</text><circle cx=\"94\" cy=\"112\" r=\"10\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><circle cx=\"138\" cy=\"112\" r=\"10\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2.2\"/><circle cx=\"138\" cy=\"88\" r=\"10\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"2.2\"/><circle cx=\"226\" cy=\"112\" r=\"10\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"138\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">가장 많이!</text><line x1=\"138\" y1=\"60\" x2=\"138\" y2=\"76\" stroke=\"#c62828\" stroke-width=\"2\"/><path d=\"M135.0,69.7 L138,76 L141.0,69.7\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"2\"/><text x=\"160\" y=\"172\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">최빈값 = 가장 많이 나온 값 = 3</text></svg>", "steps": ["최빈값은 자료에서 가장 여러 번 나온 값이에요. '가장(최) 자주(빈) 나오는 값'이라는 뜻이에요.", "값마다 몇 번 나왔는지 세요. 2 → 1번, 3 → 2번, 5 → 1번.", "가장 많이 나온 값이 최빈값이에요. 3.", "가장 많이 나온 값이 둘 이상이면 최빈값도 둘 이상이에요. 자료의 값이 모두 같은 횟수로 나오면 최빈값은 없어요. (예: 1, 1, 2, 2)"], "ex": ["2, 3, 3, 5 → 최빈값 3", "4, 4, 6, 6, 7 → 최빈값 4 와 6", "신발 사이즈 240, 250, 250, 260, 250 → 최빈값 250 (가장 많이 팔린 사이즈)"], "bad": ["나온 횟수가 아니라 값이 가장 큰 수를 고름", "횟수(2번) 를 답으로 씀 (최빈값은 3이에요)"]}, "중앙값": {"short": "크기 순으로 놓았을 때 가운데 값. 개수가 짝수면 가운데 두 값의 평균.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"5,1,3을 정렬한 1,3,5의 중앙값 3, 1,3,5,9의 중앙값 4\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">크기 순서로 놓고 가운데 값</text><text x=\"20\" y=\"42\" font-size=\"12\" text-anchor=\"start\" fill=\"#333\" font-weight=\"normal\">5, 1, 3</text><line x1=\"70\" y1=\"38\" x2=\"96\" y2=\"38\" stroke=\"#2e7d32\" stroke-width=\"2\"/><path d=\"M89.7,41.0 L96,38 L89.7,35.0\" fill=\"none\" stroke=\"#2e7d32\" stroke-width=\"2\"/><rect x=\"100\" y=\"26\" width=\"40\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.4\"/><text x=\"120\" y=\"46\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><rect x=\"144\" y=\"26\" width=\"40\" height=\"28\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2.2\"/><text x=\"164\" y=\"46\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3</text><rect x=\"188\" y=\"26\" width=\"40\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.4\"/><text x=\"208\" y=\"46\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">5</text><text x=\"280\" y=\"46\" font-size=\"14\" text-anchor=\"start\" fill=\"#c62828\" font-weight=\"bold\">→ 3</text><text x=\"160\" y=\"86\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">개수가 짝수일 때: 가운데 두 값의 평균</text><rect x=\"60\" y=\"98\" width=\"44\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.4\"/><text x=\"82\" y=\"118\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">1</text><rect x=\"110\" y=\"98\" width=\"44\" height=\"28\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2.2\"/><text x=\"132\" y=\"118\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">3</text><rect x=\"160\" y=\"98\" width=\"44\" height=\"28\" fill=\"#fff4cc\" stroke=\"#c62828\" stroke-width=\"2.2\"/><text x=\"182\" y=\"118\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">5</text><rect x=\"210\" y=\"98\" width=\"44\" height=\"28\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"1.4\"/><text x=\"232\" y=\"118\" font-size=\"14\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">9</text><text x=\"160\" y=\"152\" font-size=\"14\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">(3 + 5) ÷ 2 = 4</text><text x=\"160\" y=\"172\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">먼저 줄을 세우는 게(정렬) 가장 중요해요</text></svg>", "steps": ["중앙값은 자료를 크기 순서로 늘어놓았을 때 한가운데 있는 값이에요.", "순서가 뒤죽박죽이면 먼저 작은 것부터 정렬해요. 5, 1, 3 → 1, 3, 5.", "개수가 홀수면 정확히 가운데 값 하나가 중앙값이에요. 1, 3, 5 → 3.", "개수가 짝수면 가운데 두 값이 있어서 그 둘의 평균을 구해요. 1, 3, 5, 9 → (3 + 5) ÷ 2 = 4."], "ex": ["5, 1, 3 → 1, 3, 5 → 중앙값 3", "1, 3, 5, 9 → 가운데 3, 5 → (3 + 5) ÷ 2 = 4", "2, 8, 4, 6, 10 → 2, 4, 6, 8, 10 → 중앙값 6"], "bad": ["정렬하지 않고 주어진 순서대로 가운데를 고름", "짝수 개인데 가운데 값 하나만 고름 (평균을 구해야 해요)"]}, "소금물의 농도": {"short": "농도(%) = 소금 ÷ 소금물 × 100. 물을 넣거나 증발시켜도 소금의 양은 그대로.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"소금 20g이 소금물 100g에 있으면 20%, 물을 더하면 소금물 200g이 되어 10%\" class=\"nsvg\"><text x=\"160\" y=\"16\" font-size=\"12\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">소금물 100 g  (소금 20 g + 물 80 g)</text><rect x=\"30\" y=\"24\" width=\"24\" height=\"22\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"54\" y=\"24\" width=\"96\" height=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"42\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">20</text><text x=\"102\" y=\"40\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">물 80</text><text x=\"160\" y=\"66\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">농도 = 20 ÷ 100 × 100 = 20 %</text><text x=\"160\" y=\"92\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#2e7d32\" font-weight=\"bold\">물 100 g 을 더 넣으면 (소금은 그대로 20 g)</text><rect x=\"30\" y=\"100\" width=\"24\" height=\"22\" fill=\"#fde8e8\" stroke=\"#c62828\" stroke-width=\"1.5\"/><rect x=\"54\" y=\"100\" width=\"216\" height=\"22\" fill=\"#e8f0fb\" stroke=\"#1a56a0\" stroke-width=\"1.5\"/><text x=\"42\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">20</text><text x=\"162\" y=\"116\" font-size=\"11\" text-anchor=\"middle\" fill=\"#1a56a0\" font-weight=\"bold\">물 180</text><text x=\"160\" y=\"144\" font-size=\"13\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"bold\">농도 = 20 ÷ 200 × 100 = 10 %</text><text x=\"160\" y=\"166\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#c62828\" font-weight=\"bold\">소금의 양은 그대로, 소금물만 늘어요</text></svg>", "steps": ["농도는 소금물 전체 중 소금이 차지하는 비율이에요. 농도(%) = 소금 ÷ 소금물 × 100.", "소금물 = 소금 + 물이에요. 물만 있는 양이 아니에요. 소금 20 g, 물 80 g → 소금물 100 g, 농도 20 %.", "물을 더하거나 증발시켜도 소금의 양은 변하지 않아요. 변하는 건 소금물의 양뿐이에요.", "그래서 문제를 풀 때 ‘소금의 양’ 을 구해 두고, 새 소금물의 양으로 나눠요.", "💡 왜 소금은 그대로일까요? 물이 늘거나 증발해도 녹아 있는 소금의 양은 변하지 않아요. 그래서 소금의 양을 식의 중심으로 두고 (소금 = 농도 × 소금물/100)로 세워요."], "ex": ["소금 20 g, 물 80 g → 20 ÷ 100 × 100 = 20 %", "10 % 소금물 200 g 의 소금 = 200 × 10/100 = 20 g", "소금 20 g이 든 소금물 100 g에 물 100 g 추가 → 20 ÷ 200 × 100 = 10%"], "bad": ["소금 ÷ 물 로 계산함 (분모는 소금물 전체예요)", "물을 넣었는데 소금의 양도 바꿈"]}, "경우의 수 세기 (순서쌍)": {"short": "주사위 두 개는 (첫째, 둘째)로 빠짐없이 적는다. (1, 2)와 (2, 1)은 다른 경우.", "svg": "<svg viewBox=\"0 0 320 180\" role=\"img\" aria-label=\"주사위 두 개의 눈을 순서쌍으로 적은 표, 합이 4인 칸은 (1,3),(2,2),(3,1)\" class=\"nsvg\"><text x=\"108\" y=\"14\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">둘째 눈</text><text x=\"18\" y=\"98\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">첫째</text><text x=\"58.0\" y=\"30\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><text x=\"40\" y=\"48.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-weight=\"normal\">1</text><text x=\"78.0\" y=
